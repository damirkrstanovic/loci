<style>

5px;color:var(--accent)}.bd{padding:10px 12px;overflow-x:auto}.prose{margin:0;color:var(--ink2);font-size:13.5px}.hint,.caption{color:var(--muted);font-size:11.5px}.caption{margin:9px 0 0}.tablebox{overflow:auto}table{border-collapse:collapse;width:100%;min-width:470px;font-size:11.5px}th,td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left}th{background:var(--panel);font-weight:600;color:var(--muted)}.num{text-align:right;font-variant-numeric:tabular-nums}.viewrow,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:9px}.viewrow label{font:11px var(--mono);color:var(--faint)}select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:white}.composer{margin:0 0 12px;padding:12px;border:1px dashed var(--aline);border-radius:8px;background:var(--panel)}.composer label{display:block;font:10px var(--mono);color:var(--muted);margin-bottom:5px}.composer textarea{width:100%;min-height:72px;border:1px solid var(--line);padding:8px;resize:vertical}.study{margin:12px 0;padding:9px 11px;border-left:3px solid var(--attn);background:#fffaf3;color:#66471f;font-size:11.5px}.summary{margin:9px 0;padding:9px 11px;border-left:3px solid var(--accent);background:#eff5f1;font-size:12px}.summary b{display:block}.record{font:11px var(--mono);color:var(--muted);margin-top:7px;white-space:pre-wrap}.palette,.data-panel{margin:0 0 12px;padding:11px;border:1px dashed var(--aline);border-radius:8px;background:var(--panel)}.palette h3,.data-panel h3{font:500 16px var(--serif);margin:0 0 7px}.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.mini{padding:8px;border:1px solid var(--line);background:white;font-size:11px}.mini b{display:block}.origin{border:0;background:transparent;color:var(--accent);padding:0;text-align:left;font-size:11px}.drawer{position:fixed;z-index:20;inset:0 0 0 auto;width:min(410px,100%);padding:20px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 50px -30px rgba(20,30,25,.55);overflow:auto}.drawer h2{font:500 23px var(--serif);margin:8px 0}.drawer .close{float:right}.fact{margin:10px 0;padding:10px;border:1px solid var(--line);background:white}.fact p{margin:5px 0}.overlay{position:fixed;inset:0;background:rgba(20,30,25,.12);z-index:19}.error{color:#963f32;margin:7px 0 0}.hidden{display:none}@media(min-width:681px){html,body{height:100vh}body{overflow:hidden;display:flex;flex-direction:column}.topbar,.leapwrap{flex:none}.shell{flex:1;min-height:0;height:auto;margin:26px auto 24px}.panel{height:100%;display:flex;flex-direction:column}.p-body{overflow:auto;flex:1;min-height:0}}@media(max-width:680px){body{display:block;overflow:auto}.topbar{padding:0 13px}.crumb,.ambient{display:none}.shell{width:100%;margin:10px 0 30px}.panel{border-radius:0;border-left:0;border-right:0}.p-body{display:block;padding:14px}.nbrail{display:flex;gap:4px;overflow:auto;position:static;margin-bottom:12px}.nbrail .nr-h{display:none}.nbrail button{width:auto;white-space:nowrap}.beforeafter{grid-template-columns:1fr}.leapwrap{padding:10px 12px 2px}.p-head{padding:22px 18px 14px}}
</style></head><body>
<header class="topbar"><div class="mark"><i class="dot"></i><span class="wordmark">loci <span>/ research study</span></span></div><span class="crumb">Product usage</span><span class="ambient" id="status">Current record · 12 rows</span></header>
<div class="leapwrap"><div class="cmd"><b class="leap">LEAP</b><input id="leap" aria-label="LEAP request" placeholder="Ask or make something from this Space"><button class="plain" id="leapGo">Go</button></div></div>
<main class="shell"><section class="panel"><header class="p-head"><div class="eyebrow">Space · research</div><h1 class="p-title">Weekly product usage</h1><p class="p-intent">Find what needs attention from weekly product use.</p></header><div class="p-body"><nav class="nbrail" aria-label="Notebook outline"><p class="nr-h">NOTEBOOK</p><button class="on" data-jump="usage">▦ <span>Weekly usage</span></button><button data-jump="question">¶ <span>Question</span></button><button data-jump="derive">ƒ <span>Feature adoption</span></button><button data-jump="ask">? <span>Discovery note</span></button></nav><div class="notebook"><p class="study">Interaction study. Runs use local, calculated sample output. No external agent or data service runs. <button class="origin" id="reset">Reset</button></p><div id="dataMount"></div><div id="notebook"></div></div></div></section></main><div id="drawerMount"></div>
<script>
const sample=`customer,feature,weekly_users,seats
Atlas,Search,32,40
Atlas,Reports,27,40
Atlas,Automations,6,40
Birch,Search,21,30
Birch,Reports,16,30
Birch,Automations,3,30
Cove,Search,14,20
Cove,Reports,9,20
Cove,Automations,1,20
Delta,Search,6,10
Delta,Reports,4,10
Delta,Automations,0,10`;
const esc=v=>String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function parse(text){let rows=[],row=[],field='',quoted=false;for(let i=0,t=text.replace(/^\uFEFF/,'');i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&quoted&&n==='"'){field+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(field.trim());field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(field.trim());if(row.some(Boolean))rows.push(row.splice(0));field=''}else field+=c}if(quoted)throw Error('Close the quoted CSV field.');row.push(field.trim());if(row.some(Boolean))rows.push(row);if(rows.length<2)throw Error('Add a header and at least one data row.');let h=rows.shift().map(x=>x.toLowerCase()),need=['customer','feature','weekly_users','seats'];if(need.some(x=>!h.includes(x)))throw Error('Use headers: customer, feature, weekly_users, seats.');let ix=need.map(x=>h.indexOf(x));return rows.map((r,n)=>{if(r.length!==h.length)throw Error(`Row ${n+2} has ${r.length} fields; expected ${h.length}.`);let o=[r[ix[0]],r[ix[1]],+r[ix[2]],+r[ix[3]]];if(!o[0]||!o[1]||!Number.isFinite(o[2])||!Number.isFinite(o[3])||o[2]<0||o[3]<=0)throw Error(`Row ${n+2} has invalid values.`);return o})}
const total=r=>Object.entries(r.reduce((a,[,f,u,s])=>((a[f]??=[0,0])[0]+=u,(a[f][1]+=s),a),{})).map(([f,[u,s]])=>[f,u,s,Math.round(u/s*100)]);
const raw=r=>`<div class="tablebox"><table><thead><tr><th>customer</th><th>feature</th><th class="num">weekly users</th><th class="num">seats</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class="num">${x[2]}</td><td class="num">${x[3]}</td></tr>`).join('')}</tbody></table></div>`;
const adopt=r=>`<div class="tablebox"><table><thead><tr><th>feature</th><th class="num">weekly users</th><th class="num">seats</th><th class="num">adoption</th></tr></thead><tbody>${total(r).map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${x[1]}</td><td class="num">${x[2]}</td><td class="num">${x[3]}%</td></tr>`).join('')}</tbody></table></div>`;
const graph=r=>`<div class="viewout">${total(r).map(x=>`<div style="display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:7px 0"><span>${esc(x[0])}</span><span style="height:11px;background:var(--soft)"><i style="display:block;width:${x[3]}%;height:100%;background:var(--accent)"></i></span><b class="num">${x[3]}%</b></div>`).join('')}</div>`;
const init=()=>({rows:parse(sample),file:'usage-by-customer.csv',sourceVersion:1,resultVersion:0,reportVersion:0,mode:'',view:'rows',fn:null,derived:null,report:null,data:false,palette:false,pending:null,error:'',make:'Create a feature-adoption table. Group by feature, sum weekly users and seats, calculate adoption, and save a reusable function.',ask:'Which feature needs a discovery interview first? Use the selected Feature adoption table. State the evidence and one limit.',fresh:'',selected:'usage'});let s=init(),lastOrigin=null;
const c=(id,k,t,b,tools='',cl='')=>`<section class="cellwrap" id="${id}"><div class="cellmold ${cl}"><div class="hd"><span class="tag">${k}</span><span class="t">${t}</span><span class="tools">${tools}</span></div><div class="bd">${b}</div></div></section>`;const o=(x,t='Produced by')=>`<button class="origin" data-origin="${x}">${t}</button>`;
function data(){if(!s.data)return '';let p=s.pending?`<div class="summary"><b>Preview: ${s.pending.rows.length} rows from ${esc(s.pending.name)}</b>${raw(s.pending.rows)}<button class="run" id="add">Use as source Table</button></div>`:'';return `<div class="data-panel"><h3>Add CSV data</h3><p class="hint">This replaces the source Table in this study. Existing results keep captured snapshots.</p><input id="file" type="file" accept=".csv,text/csv"><textarea id="paste" style="width:100%;min-height:70px;margin-top:7px" placeholder="Paste CSV">${esc(s.draft||'')}</textarea><div class="actions"><button class="plain" id="preview">Preview pasted CSV</button><button class="plain" id="sampleBtn">Use supplied sample</button><button class="plain" data-data>Close</button></div><p class="error">${esc(s.error)}</p>${p}</div>`}
function palette(){return !s.palette?'':`<div class="palette"><h3>ƒ Saved functions</h3>${s.fn?`<b>Feature adoption</b><p class="hint">${esc(s.fn)}</p><div class="beforeafter"><div class="mini"><b>Before</b>${s.rows.length} customer-feature rows</div><div class="mini"><b>After</b>${total(s.rows).length} feature rows</div></div><button class="run" id="apply">Apply to make a new Table</button>`:'<p class="hint">Run Make to save Feature adoption here.</p>'} <button class="plain" data-palette>Close</button></div>`}
function source(){let out=s.view==='rows'?raw(s.rows):graph(s.rows);return c('usage','Table','Weekly product usage',`<div class="viewrow"><label>View <select id="view"><option value="rows">Rows</option><option value="adoption">Adoption graph</option></select></label><span class="hint">A View changes how you read this Table.</span></div>${out}<p class="caption">${s.view==='rows'?`${s.rows.length} source records.`:'Adoption graph: weekly users divided by seats, grouped by feature.'} The source stays unchanged.</p>`,`${o('source',`Imported by you · ${s.file}`)}<button class="mkcell" data-mode="make">Make</button><button class="mkcell" data-palette>ƒ</button><button class="mkcell" data-data>+ Data</button>`)}
function maker(){return s.mode!=='make'?'':c('derive','Make','Make from Weekly product usage',`<div class="composer"><label>Request to the simulated agent</label><textarea id="make">${esc(s.make)}</textarea><div class="study">One Run adds a calculated Table and saves the function. Your exact request is recorded.</div><button class="run" id="runMake">Run</button> <button class="plain" data-close>Cancel</button></div>`)}
function derived(){return !s.derived?'':c('derived','Table','Feature adoption',`${adopt(s.derived.rows)}<div class="summary"><b>${s.derived.version>1?'Updated':'Created'} Feature adoption Table (${total(s.derived.rows).length} rows)</b>${s.derived.actor==='you'?'Applied Feature adoption function.':'Saved Feature adoption function.'} Source v${s.derived.sourceVersion} stays unchanged.</div><details><summary>Request and action</summary><p class="record">${esc(s.derived.prompt)}</p></details>`,`${o('derived')}<button class="mkcell" data-mode="ask">Ask</button>`,s.fresh==='derived'?'new':'')}
function asker(){return !s.derived||s.mode!=='ask'?'':c('ask-composer','Ask','Ask about Feature adoption',`<div class="composer"><label>Request to the simulated agent</label><textarea id="ask">${esc(s.ask)}</textarea><div class="study">One Run adds a calculated Report. Your exact request is recorded.</div><button class="run" id="runAsk">Run</button> <button class="plain" data-close>Cancel</button></div>`)}
function report(){if(!s.report)return '';let x=total(s.report.rows).sort((a,b)=>a[3]-b[3])[0],old=s.derived&&s.report.resultVersion!==s.derived.version;return c('report','Report','Discovery recommendation',`<h2 style="font:500 21px/1.2 var(--serif);margin:0 0 7px">Interview ${esc(x[0])} users first.</h2><p class="prose">${esc(x[0])} has <b>${x[1]} weekly users across ${x[2]} seats (${x[3]}%)</b>, the lowest adoption.</p><p class="caption">Usage shows a gap. It does not show why it exists.</p><div class="summary"><b>Agent wrote Discovery recommendation from Feature adoption v${s.report.resultVersion}</b>${old?`The current Feature adoption is v${s.derived.version}. Use Ask to update this Report.`:'The report uses the captured Table input.'}</div><details><summary>Request and action</summary><p class="record">${esc(s.report.prompt)}</p></details>`,o('report'),'report '+(s.fresh==='report'?'new':''))}
function render(){document.querySelector('#dataMount').innerHTML=data()+palette();document.querySelector('#notebook').innerHTML=c('question','Text','Question','<p class="prose">Which part of product use needs a closer discovery conversation?</p>',o('question'))+source()+maker()+derived()+asker()+report();document.querySelector('#status').textContent=`Current record · ${s.rows.length} source rows${s.fn?' · Feature adoption saved':''}`;document.querySelectorAll('[data-jump]').forEach(b=>{let id=b.dataset.jump==='derive'?'derived':b.dataset.jump==='ask'?'report':b.dataset.jump;b.disabled=!document.querySelector('#'+id);b.classList.toggle('on',id===s.selected);b.onclick=()=>{let el=document.querySelector('#'+id);if(el){s.selected=id;el.classList.add('flash');el.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>el.classList.remove('flash'),900)}}});wire();if(s.fresh){let id=s.fresh;s.fresh='';requestAnimationFrame(()=>document.querySelector('#'+id)?.scrollIntoView({behavior:'smooth',block:'center'}))}}
function load(t,n){try{s.pending={rows:parse(t),name:n};s.error=''}catch(e){s.pending=null;s.error=e.message}render()}
function wire(){let v=document.querySelector('#view');if(v){v.value=s.view;v.onchange=e=>{s.view=e.target.value;render()}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;s.data=false;s.palette=false;render();document.querySelector('#'+(s.mode==='make'?'make':'ask'))?.focus()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{s.mode='';render()});document.querySelectorAll('[data-data]').forEach(b=>b.onclick=()=>{s.data=!s.data;s.mode='';s.palette=false;render()});document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{s.palette=!s.palette;s.mode='';s.data=false;render()});document.querySelectorAll('[data-origin]').forEach(b=>b.onclick=()=>{lastOrigin=b;drawer(b.dataset.origin)});document.querySelector('#runMake')?.addEventListener('click',()=>{s.make=document.querySelector('#make').value.trim();if(!s.make)return;s.fn=s.make;s.derived={rows:s.rows.map(x=>[...x]),prompt:s.make,file:s.file,sourceVersion:s.sourceVersion,actor:'simulated agent',version:(s.resultVersion||0)+1};s.resultVersion=s.derived.version;s.mode='';s.fresh='derived';render()});document.querySelector('#runAsk')?.addEventListener('click',()=>{s.ask=document.querySelector('#ask').value.trim();if(!s.ask)return;s.reportVersion+=1;s.report={rows:s.derived.rows.map(x=>[...x]),prompt:s.ask,file:s.derived.file,sourceVersion:s.derived.sourceVersion,actor:'simulated agent',resultVersion:s.derived.version,version:s.reportVersion};s.mode='';s.fresh='report';render()});document.querySelector('#apply')?.addEventListener('click',()=>{s.derived={rows:s.rows.map(x=>[...x]),prompt:s.fn,file:s.file,sourceVersion:s.sourceVersion,actor:'you',operation:'Apply saved function',version:(s.resultVersion||0)+1};s.resultVersion=s.derived.version;s.palette=false;s.fresh='derived';render()});document.querySelector('#preview')?.addEventListener('click',()=>load(document.querySelector('#paste').value,'pasted CSV'));document.querySelector('#sampleBtn')?.addEventListener('click',()=>load(sample,'usage-by-customer.csv'));document.querySelector('#add')?.addEventListener('click',()=>{s.rows=s.pending.rows.map(x=>[...x]);s.file=s.pending.name;s.sourceVersion=(s.sourceVersion||1)+1;s.pending=null;s.data=false;render()});let f=document.querySelector('#file');if(f)f.onchange=e=>{let x=e.target.files[0],r=new FileReader();if(!x)return;r.onload=()=>load(r.result,x.name);r.readAsText(x)}}
document.addEventListener('input',e=>{if(e.target.id==='make')s.make=e.target.value;if(e.target.id==='ask')s.ask=e.target.value;if(e.target.id==='paste')s.draft=e.target.value});
function closeDrawer(){document.querySelector('#drawerMount').innerHTML='';let opener=lastOrigin;lastOrigin=null;opener?.focus()}
function drawer(k){let d={source:['Weekly product usage','you','Import CSV',s.file,`Current source · ${s.file} · v${s.sourceVersion} · ${s.rows.length} rows`,`Weekly product usage Table · v${s.sourceVersion}`],question:['Question','you','Write text','Which part of product use needs a closer discovery conversation?','Question text','Question cell'],derived:['Feature adoption',s.derived?.actor,s.derived?.operation||'Make',s.derived?.prompt,`${s.derived?.file} · Weekly product usage v${s.derived?.sourceVersion}`,`Feature adoption Table · v${s.derived?.version}`],report:['Discovery recommendation',s.report?.actor,'Ask',s.report?.prompt,`${s.report?.file} · Feature adoption v${s.report?.resultVersion}`,`Discovery recommendation Report · v${s.report?.version}`]}[k];document.querySelector('#drawerMount').innerHTML=`<div class="overlay" data-x></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="origin-title"><button class="plain close" data-x>Close</button><div class="eyebrow">Origin</div><h2 id="origin-title">${esc(d[0])}</h2><div class="fact"><b>Actor</b><p>${esc(d[1])}</p><b>Operation</b><p>${esc(d[2])}</p></div><div class="fact"><b>Exact request</b><p class="record">${esc(d[3])}</p></div><div class="fact"><b>Captured input</b><p>${esc(d[4])}</p><button class="origin" id="snap">Open saved input snapshot</button></div><div class="fact"><b>Output</b><p>${esc(d[5])}</p></div></aside>`;document.querySelectorAll('[data-x]').forEach(x=>x.onclick=closeDrawer);document.querySelector('#snap').onclick=()=>{let out=k==='derived'?raw(s.derived.rows):k==='report'?adopt(s.report.rows):k==='question'?'<p class="prose">Which part of product use needs a closer discovery conversation?</p>':raw(s.rows);document.querySelector('.drawer').insertAdjacentHTML('beforeend',`<div class="fact"><b>Read-only snapshot</b>${out}</div>`)};document.querySelector('.drawer .close').focus()}
document.querySelector('#leapGo').onclick=()=>{let q=document.querySelector('#leap').value.trim();if(q){s.make=q;s.mode='make';s.data=false;s.palette=false;render();document.querySelector('#make').focus()}};document.querySelector('#leap').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#leapGo').click()};document.querySelector('#reset').onclick=()=>{s=init();render()};render();
document.addEventListener('keydown',e=>{let drawer=document.querySelector('.drawer');if(!drawer)return;if(e.key==='Escape'){e.preventDefault();closeDrawer();return}if(e.key!=='Tab')return;let focusable=[...drawer.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);let first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
</script></body></html>
