document.getElementById('timeBtn').addEventListener('click',()=>TIME?exitTime():enterTime());
document.getElementById('timeNow').addEventListener('click',exitTime);
timeRange.addEventListener('input',()=>scrubTo(+timeRange.value));

// ---------------- LEAP filters the overview ----------------
// Filtering is an entry in LEAP's own list rather than a mode: the dropdown
// closes because you finished with it, and Ask / New space / memory hits stay
// reachable from the overview, which suppressing the panel would have cost.
let overviewFilter=null;          // {q, ids:Set} — sticky until you leave overview

// A notebook matches on its own title/id, on a prose cell inside it (LEAP
// returns the NOTEBOOK's id for prose), or on containing an object that
// matched — `in text` hits carry the document's id, not its notebook's.
function notebooksMatching(entries){
  const direct=new Set(entries.filter(e=>e.group==='space'||e.group==='prose').map(e=>e.id));
  const hits=new Set(entries.map(e=>e.id));
  const ids=new Set();
  STATE.spaces.forEach(sp=>{
    if(direct.has(sp.id) || (sp.members||[]).some(m=>hits.has(m))) ids.add(sp.id);
  });
  return ids;
}

function applyOverviewFilter(){
  const lit = sp => (!overviewFilter || overviewFilter.ids.has(sp.id)) && passesTags(sp);
  panels.forEach((p,k)=>p.classList.toggle('dim', mode==='overview' && !lit(STATE.spaces[k])));
  const cr=document.getElementById('crumbFilter'); if(cr) cr.remove();
  const tagBits=Object.entries(tagState).map(([t,v])=>(v==='in'?'+':'−')+t);
  if(!overviewFilter && !tagBits.length) return;
  const n=STATE.spaces.filter(lit).length;
  const el=document.createElement('span'); el.id='crumbFilter'; el.className='crumbfilter';
  el.innerHTML='· '+(overviewFilter?'“'+esc(overviewFilter.q)+'” ':'')+
               (tagBits.length?esc(tagBits.join(' '))+' ':'')+
               '<b>'+n+' of '+STATE.spaces.length+'</b>'+
               ' <span class="x" title="clear the filter">✕</span>';
  el.querySelector('.x').addEventListener('click',e=>{ e.stopPropagation(); clearAllFilters(); });
  crumb.appendChild(el);
}
function clearOverviewFilter(){ overviewFilter=null; applyOverviewFilter(); }
function clearAllFilters(){ overviewFilter=null; clearTags(); applyOverviewFilter(); }

// ---------------- tags narrow the same set LEAP's filter narrows ----------------
// One dimming path, one crumb, one predicate. A second parallel filter with its
// own rules would be the mode this design has avoided throughout.
let tagState={};                  // {tag: 'in' | 'out'} — absent means neutral

function allTags(){
  const seen=new Map();
  STATE.spaces.forEach(sp=>(sp.tags||[]).forEach(t=>seen.set(t.tag,(seen.get(t.tag)||0)+1)));
  return [...seen.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

// include if it carries any included tag (or none are included); exclude wins,
// because "semiconductors except the geopolitics" is the question people ask
function passesTags(sp){
  const on=Object.entries(tagState);
  if(!on.length) return true;
  const mine=new Set((sp.tags||[]).map(t=>t.tag));
  const inc=on.filter(([,v])=>v==='in').map(([t])=>t);
  const exc=on.filter(([,v])=>v==='out').map(([t])=>t);
  if(exc.some(t=>mine.has(t))) return false;
  return !inc.length || inc.some(t=>mine.has(t));
}

function cycleTag(tag){
  tagState[tag] = tagState[tag]==='in' ? 'out' : tagState[tag]==='out' ? undefined : 'in';
  if(!tagState[tag]) delete tagState[tag];
  renderTagStrip(); applyOverviewFilter();
}
function clearTags(){ tagState={}; renderTagStrip(); }

function renderTagStrip(){
  let strip=document.getElementById('tagstrip');
  const tags=allTags();
  if(mode!=='overview' || !tags.length){ if(strip) strip.remove(); return; }
  if(!strip){ strip=document.createElement('div'); strip.id='tagstrip';
              document.body.appendChild(strip); }
  strip.innerHTML=tags.map(([t,n])=>
    '<button class="tagchip '+(tagState[t]||'')+'" data-tag="'+esc(t)+'" '+
    'title="click: include · again: exclude · again: off">'+esc(t)+' <i>'+n+'</i></button>').join('');
  strip.querySelectorAll('.tagchip').forEach(b=>
    b.addEventListener('click',()=>cycleTag(b.dataset.tag)));
}

// with the canvas scrolling, a filter whose matches are all below the fold
// shows a screen of grey and looks broken — bring the first one into view
function scrollToFirstMatch(){
  if(!overviewFilter) return;
  const k=STATE.spaces.findIndex(s=>overviewFilter.ids.has(s.id));
  if(k<0) return;
  const r=panels[k].getBoundingClientRect(), w=document.getElementById('world');
  if(r.top<140||r.bottom>innerHeight) w.scrollTop+=r.top-180;
}

// ---------------- LEAP ----------------
async function renderLeap(){
  const qv=q.value.trim();
  const entries=await API.leap(qv);
  filtered = qv
    ? [{id:'__ask__',label:'Ask the agent: “'+qv+'”',group:'ask',prompt:qv}]
        .concat(entries, [{id:'__new__',label:'New space (agent): “'+qv+'”',group:'create',prompt:qv}])
    : entries;
  // ⧉ connect: from a focused notebook, a space hit offers a non-destructive merge
  if(mode==='focus'&&!TIME&&qv&&STATE.spaces[focusIdx]){
    const cur=STATE.spaces[focusIdx];
    filtered.filter(r=>r.group==='space'&&r.id!==cur.id).slice(0,2).forEach(s=>{
      filtered.push({id:'__connect:'+s.id, label:'⧉ Connect “'+cur.title+'” + “'+(s.label||s.id)+'”',
                     group:'create', connect:s.id});
    });
  }
  // ⊟ filter: only from the overview, where the dropdown is what's in the way.
  // Second, right under Ask — appended it sits at flat index 11 for a rich query,
  // below the .results 46vh fold, which is precisely the burial this verb exists
  // to undo. Ask keeps the top slot; from 25 notebooks, "show me fewer" is next.
  if(mode==='overview'&&!TIME&&qv){
    const n=notebooksMatching(entries).size;
    filtered.splice(1,0,{id:'__filter__', group:'filter',
      label:'⊟ Filter the overview: “'+qv+'” · '+n+' of '+STATE.spaces.length});
  }
  if(sel>=filtered.length) sel=0;
  if(!filtered.length){ results.innerHTML='<div class="group">no match</div>'; return; }
  let h='',last=null,flat=0;
  const gname={ask:'Ask',space:'Notebooks',viewer:'View verbs',create:'Create',filter:'Filter',prose:'In notebooks','in text':'In documents',memory:'Memory','views & functions':'Views & functions'};
  filtered.forEach(e=>{ const grp=gname[e.group]||'Content';
    if(grp!==last){h+='<div class="group">'+grp+'</div>';last=grp;}
    const i=flat++; const cls=(e.group==='space')?'space':(e.group==='viewer'||e.group==='create'||e.group==='ask'||e.group==='filter')?'verb':'';
    const ic=e.group==='ask'?'✦':e.group==='space'?'▢':e.group==='viewer'?'▸':e.group==='create'?'✦':e.group==='filter'?'⊟':e.group==='memory'?'⌾':e.group==='prose'?'¶':e.group==='in text'?'§':e.group==='views & functions'?'ƒ':'▤';
    h+='<div class="res '+cls+(i===sel?' sel':'')+'" data-i="'+i+'"><span class="ic">'+ic+'</span>'+
       '<span class="title">'+esc(e.label)+'</span><span class="gp">'+esc(e.id)+'</span></div>'; });
  results.innerHTML=h;
  results.querySelectorAll('.res').forEach(r=>{ r.addEventListener('mousemove',()=>{sel=+r.dataset.i;paintSel();}); r.addEventListener('click',()=>{sel=+r.dataset.i;act();}); });
}
// the list scrolls at 46vh, so arrowing past the fold used to move the selection
// somewhere invisible — keep whatever is selected on screen
function paintSel(){
  results.querySelectorAll('.res').forEach(r=>{
    const on=+r.dataset.i===sel;
    r.classList.toggle('sel',on);
    if(on) r.scrollIntoView({block:'nearest'});
  });
}
async function act(){ const e=filtered[sel]; if(!e) return;
  if(e.connect){                       // ⧉ non-destructive merge of two notebooks
    let r; try{ r=await API.connect(STATE.spaces[focusIdx].id, e.connect); }catch(err){ showToast('connect: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    applyState(r.state); closeLeap(); rebuild();
    const j=STATE.spaces.findIndex(s=>s.id===r.openId); if(j>=0) enter(j);
    showToast('Connected — a new notebook, originals untouched (reversible)', undo);
    return;
  }
  if(e.id&&e.id.slice(0,3)==='fn:'&&e.group==='views & functions'){ closeLeap(); openFunctions(); return; }
  if(e.target){                        // a view/applet found by LEAP — land on its data, molded
    closeLeap();
    await openObject(e.target);
    await remold(e.target, e.id);
    return;
  }
  if(e.group==='filter'){
    const qv=q.value.trim();
    let entries; try{ entries=await API.leap(qv); }catch(err){ showToast('leap: network error'); return; }
    overviewFilter={q:qv, ids:notebooksMatching(entries)};
    closeLeap(); applyOverviewFilter(); scrollToFirstMatch();
    if(!overviewFilter.ids.size) showToast('no notebook matches “'+qv+'”');
    return;
  }
  if(e.group==='ask'){ askAgent(e.prompt, mode==='focus'?STATE.spaces[focusIdx].id:null); }
  else if(e.group==='create'){ createSpace(e.prompt); }
  else if(e.group==='space'){ const i=STATE.spaces.findIndex(s=>s.id===e.id); if(i>=0) enter(i); }
  else if(e.group==='viewer'){ /* a view-verb: no-op until applied to a selection */ closeLeap(); }
  else if(e.group==='memory'){ const qq=q.value.trim(); closeLeap(); openMemory(qq); }
  else if(e.group==='prose'){ const i=STATE.spaces.findIndex(s=>s.id===e.id); if(i>=0) enter(i); }
  else { openObject(e.id); } }
async function createSpace(prompt){
  closeLeap();
  showToast('asking the agent to set up a space…');
  const res=await API.newSpace(prompt);
  if(TIME){ showToast('finished — ↩ now to see it'); return; }
  if(res.error){ showToast('agent: '+res.error); return; }
  applyState(res.state); rebuild();
  const i=STATE.spaces.findIndex(s=>s.id===res.spaceId);
  if(i>=0) enter(i);
  showToast('Space created by the agent — reversible', undo);
}

// ---------------- ask the agent (grounded answer) ----------------
const modal=document.getElementById('modal');
let lastAnswer=null;
// agent outputs are markdown — render them properly. esc() FIRST (everything
// below operates on escaped text), then a small line-walker: fences, tables,
// headings, lists, quotes, then inline marks. No library, no surprises.
function mdToHtml(md){
  const lines=esc(md||'').split('\n');
  const out=[]; let i=0, para=[];
  const inline=s=>s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flush=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); para=[]; } };
  const sep=l=>/\|/.test(l)&&/^[\s|:\-]+$/.test(l);
  const cells=l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inline(c.trim()));
  while(i<lines.length){
    const l=lines[i]; let m;
    if(/^```/.test(l)){ flush(); const buf=[]; i++;
      while(i<lines.length&&!/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; out.push('<pre class="mdcode">'+buf.join('\n')+'</pre>'); continue; }
    if(/\|/.test(l)&&sep(lines[i+1]||'')){
      flush();
      let t='<table class="mold"><tr>'+cells(l).map(c=>'<th>'+c+'</th>').join('')+'</tr>'; i+=2;
      while(i<lines.length&&/\|/.test(lines[i])&&!sep(lines[i])){
        t+='<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; i++; }
      out.push(t+'</table>'); continue; }
    if(m=l.match(/^###+\s+(.*)/)){ flush(); out.push('<h4>'+inline(m[1])+'</h4>'); i++; continue; }
    if(m=l.match(/^##?\s+(.*)/)){ flush(); out.push('<h3>'+inline(m[1])+'</h3>'); i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ flush(); const it=[];
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){ it.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++; }
      out.push('<ul>'+it.join('')+'</ul>'); continue; }
    if(/^\s*\d+\.\s+/.test(l)){ flush(); const it=[];
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){ it.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; }
      out.push('<ol>'+it.join('')+'</ol>'); continue; }
    if(/^&gt;\s?/.test(l)){ flush(); const q=[];
      while(i<lines.length&&(m=lines[i].match(/^&gt;\s?(.*)/))){ q.push(inline(m[1])); i++; }
      out.push('<blockquote>'+q.join('<br>')+'</blockquote>'); continue; }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){ flush(); out.push('<hr>'); i++; continue; }
    if(/^\s*$/.test(l)){ flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return '<div class="md">'+out.join('')+'</div>';
}
function openModal(html,question,canKeep,scope){
  modal.innerHTML='<div class="modalcard"><div class="modal-h">'+
    '<span style="font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:2px 7px">ANSWER</span>'+
    '<span class="q">“<b>'+esc(question)+'</b>”</span></div>'+
    '<div class="modal-b">'+html+'</div>'+
    '<div class="modal-f">'+(canKeep?'<button class="btn sm" id="keepBtn">Keep as note here</button>':'')+
    '<button class="btn ghost sm" id="closeModal">Close</button>'+
    '<span style="font-size:11.5px;color:var(--muted)">grounded in '+esc(scope||'your workspace')+'</span></div></div>';
  modal.classList.add('on');
  modal.querySelector('#closeModal').addEventListener('click',closeModal);
  const kb=modal.querySelector('#keepBtn'); if(kb) kb.addEventListener('click',keepNote);
}
function closeModal(){ modal.classList.remove('on'); modal.innerHTML=''; }
// the functions living in the substrate, with their source — a peek under the
// hood. Functions ARE objects here: reversible, inspectable. Not the daily flow.

    '<div class="modal-h"><span style="font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:2px 7px">FUNCTIONS</span>'+
    '<span class="q">'+list.length+' in the substrate · each a reversible, inspectable object</span></div><div class="modal-b">';
  h+='<div class="sec-h">built-in library</div><div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">'+
    'Filter rows · Group &amp; aggregate · Pivot · Top N · Change vs previous row · Share of total — '+
    'available on any table cell via <b>ƒ</b>, previewed before anything is committed.</div>';
  if(!list.length) h+='<div style="color:var(--muted);font-size:13px">No functions yet — on any table cell hit <b>✦</b> (or open the table and use <b>✦ make…</b>) and describe what you want: a view, a computed table, or a visualization.</div>';
  list.forEach(f=>{
    h+='<div style="border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px">'+
      '<div style="font-size:13px;font-weight:500">'+esc(f.title)+'</div>'+
      '<div style="font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:3px 0 8px">'+
        esc(f.id)+' · '+esc(f.kind)+(f.lang?' · '+esc(f.lang):'')+(f.target?' · over '+esc(f.target):'')+'</div>'+
      '<pre style="margin:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px;overflow:auto;font-size:11.5px;line-height:1.5;max-height:260px">'+esc(f.code||'(no code)')+'</pre></div>';
  });
  h+='</div><div class="modal-f"><button class="btn ghost sm" id="closeModal">Close</button>'+
    '<span style="font-size:11.5px;color:var(--muted)">a peek under the hood — not the everyday flow</span></div></div>';
  modal.innerHTML=h; modal.classList.add('on');

}
document.getElementById('fnBtn').addEventListener('click',openFunctions);
// the agent's memory — browsable, searchable, cited. Revisable and decaying;
// undo never touches it (that's the record/recall split, visible).
async function openMemory(qstr){
  const res=await API.memory(qstr||'');
  const facts=res.facts||[];
  let h='<div class="modalcard" style="max-width:720px"><div class="modal-h">'+
    '<span style="font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:2px 7px">MEMORY</span>'+
    '<span class="q">'+facts.length+' remembered fact'+(facts.length===1?'':'s')+(qstr?' for “<b>'+esc(qstr)+'</b>”':'')+'</span></div>'+
    '<div class="modal-b"><input id="memq" placeholder="search memory…" value="'+esc(qstr||'')+'" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;margin-bottom:12px">';
  if(!facts.length) h+='<div style="color:var(--muted);font-size:13px">Nothing yet — memory fills as the agent researches, drafts and answers.</div>';
  facts.forEach(f=>{
    const age=Math.round((Date.now()-f.ts)/86400000);
    h+='<div class="memfact"><div style="font-size:13px">'+esc(f.fact)+'</div>'+
      '<div class="src"><span class="dots">'+'●'.repeat(Math.min(5,f.strength||1))+'</span> · '+
      (f.source&&f.source.obj?'<span class="ghostchip" data-open="'+esc(f.source.obj)+'">⌾ '+esc(f.source.obj)+'</span>'
                             :'⌾ '+esc((f.source&&f.source.space)||'workspace'))+
      ' · '+(age<1?'today':age+'d ago')+(f.score!==undefined?' · relevance '+(+f.score).toFixed(2):'')+'</div></div>';
  });
  h+='</div><div class="modal-f"><button class="btn ghost sm" id="closeModal">Close</button>'+
    '<span style="font-size:11.5px;color:var(--muted)">the agent’s recall — revisable, never undone</span></div></div>';
  modal.innerHTML=h; modal.classList.add('on');
  modal.querySelector('#closeModal').addEventListener('click',closeModal);
  const mq=modal.querySelector('#memq');
  mq.focus();
  mq.addEventListener('keydown',e=>{ if(e.key==='Enter') openMemory(mq.value.trim()); });
  modal.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{ closeModal(); openObject(el.dataset.open); }));
}
document.getElementById('memBtn').addEventListener('click',()=>openMemory(''));
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
async function askAgent(prompt, space){
  closeLeap();
  const scope = space ? ((STATE.spaces.find(s=>s.id===space)||{}).title) : 'your whole workspace';
  openModal('<span style="color:var(--muted)">asking DeepSeek, grounded in '+esc(scope||'')+'…</span>', prompt, false, scope);
  const res=await API.ask(prompt, space);
  if(res.error){ closeModal(); showToast('agent: '+res.error); return; }
  lastAnswer={prompt, text:res.answer};
  if(TIME){ showToast('answer ready — ↩ now to see it'); return; }   // never re-open the modal in the past
  openModal(mdToHtml(res.answer), prompt, mode==='focus', scope);
}
async function keepNote(){
  if(TIME){ showToast('time mode — ↩ now to keep notes'); return; }
  if(!lastAnswer || mode!=='focus') return;
  const sp=STATE.spaces[focusIdx];
  const res=await API.keepNote(sp.id, 'Note: '+lastAnswer.prompt.slice(0,48), lastAnswer.text);
  applyState(res.state); closeModal(); rebuild();
  showToast('Kept as a note in '+sp.title+' — reversible', undo);
}
function openLeap(){ cmd.classList.add('live'); renderLeap(); }
function closeLeap(){ cmd.classList.remove('live'); q.value=''; q.blur(); }
q.addEventListener('focus',()=>{ if(TIME){ q.blur(); showToast('time mode — ↩ now to search'); return; } openLeap(); });
q.addEventListener('input',()=>{sel=0;renderLeap();});
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,filtered.length-1);paintSel();}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);paintSel();}
  else if(e.key==='Enter'){e.preventDefault();act();}
  else if(e.key==='Escape'){ if(q.value){q.value='';renderLeap();} else {closeLeap(); if(mode==='focus') overview();} }
});
addEventListener('keydown',e=>{
  if(modal.classList.contains('on')){ if(e.key==='Escape') closeModal(); return; }
  if(document.activeElement===q) return;
  // don't steal typing from any focused field (code-a-view, describe, edit, …)
  { const a=document.activeElement, t=a&&a.tagName; if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||(a&&a.isContentEditable)){ if(e.key==='Escape')a.blur(); return; } }
  if(e.key==='Escape'){ if(TIME){ exitTime(); return; }
    if(openId){openId=null;renderBody(focusIdx);}
    else if(overviewFilter||Object.keys(tagState).length){ clearAllFilters(); }
    else if(mode==='focus') overview(); return; }
  if(TIME) return;   // LEAP is disabled while viewing the past
  if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !e.altKey) q.focus();
});

boot();
