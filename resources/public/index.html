<!doctype html>
<!-- loci shell — layer 5. Spaces + LEAP, data-driven from the Clojure substrate (/api). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loci</title>
<!-- inline so the shell asks the server for nothing it doesn't need (the 404 was noise) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ECEEEA'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232f6f5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif&display=swap" rel="stylesheet">
<!-- The ClojureScript grid, opt-in via ?cljs. Loaded but inert unless the flag
     is set, so every existing path without it is byte-identical. -->
<script defer src="/js/grid.js"></script>
<style>
  :root{
    --paper:#ECEEEA; --panel:#F7F8F5; --white:#fff;
    --ink:#1B211E; --ink-2:#3f4a44; --muted:#6d7872; --faint:#97a09a;
    --line:#d6dad3; --line-2:#e6e9e3; --record:#c8cdc5;
    --accent:#2f6f5b; --accent-line:#73a797; --accent-soft:rgba(47,111,91,.09);
    --attn:#a9632f; --attn-soft:rgba(169,99,47,.10);
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:12.5px;line-height:1.5;
       -webkit-font-smoothing:antialiased;overflow:hidden;
       background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);
       background-size:28px 28px}   /* paper with a faint rule, not a flat fill */
  button,input{font-family:inherit}
  mark{background:var(--accent-soft);border-radius:3px;padding:0 1px}

  .topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:50;display:flex;align-items:center;gap:16px;padding:0 22px;
          background:linear-gradient(var(--paper),rgba(236,238,234,.85));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .mark{display:flex;align-items:baseline;gap:9px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);position:relative;top:-1px}
  .wordmark{font-weight:600;font-size:20px;letter-spacing:-.02em}.wordmark span{color:var(--faint);font-weight:400}
  .crumb{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;background:transparent;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px}
  .crumb:hover{background:var(--panel);color:var(--ink)} .crumb b{color:var(--ink);font-weight:500}
  .crumb .ov{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint)}
  .crumbfilter{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:7px}
  .crumbfilter b{color:var(--accent);font-weight:500}
  .crumbfilter .x{margin-left:5px;cursor:pointer;color:var(--faint);padding:0 3px}
  .crumbfilter .x:hover{color:var(--attn)}
  /* the strip sits under LEAP in its own row — the mock floated it beneath the
     LEAP bar where nothing could be clicked, and only a scripted click hid that */
  #tagstrip{position:fixed;left:0;right:0;top:132px;z-index:12;display:flex;gap:6px;
            justify-content:center;flex-wrap:wrap;pointer-events:auto}
  .world.overview ~ #tagstrip{display:flex}
  .tagchip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:3px 9px;
           border-radius:2px;border:1px solid var(--line);background:var(--white);
           color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .tagchip i{font-style:normal;color:var(--faint);margin-left:4px}
  /* the swatch carries identity; the fill and the strike carry state.
     What keeps .out's line-through off the swatch is that the swatch is an
     atomic box, not the text-decoration below: decorations are not propagated
     into one. Measured in Chromium — deleting that declaration changes not a
     single pixel. It is kept only as a guard for engines that have historically
     painted through atomic inlines anyway, and inline-block is stated rather
     than left to flex-item blockification so the swatch keeps its 6px box if
     .tagchip ever stops being a flex container (as an inline <u> it would have
     no box at all — width and height do not apply). */
  .tagchip .ink{width:6px;height:6px;border-radius:1px;flex:none;display:inline-block;
                background:var(--tag-ink,var(--accent));text-decoration:none}
  .tagchip.in{border-color:var(--tag-ink,var(--accent-line));color:var(--tag-ink,var(--accent));
              background:color-mix(in srgb,var(--tag-ink,var(--accent)) 11%,transparent)}
  /* exclude overrides the ink: the strike and the clay are what say "subtracting",
     and the swatch still says which tag it is */
  .tagchip.out{border-color:var(--attn);color:var(--attn);background:var(--attn-soft);
               text-decoration:line-through}
  .tagedit{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tagedit .tagchip{cursor:default}
  .tagedit .tagchip.byagent{border-style:dashed}   /* an inference, not your word */
  .tagedit .tagchip .x{cursor:pointer;color:var(--faint);margin-left:3px}
  .tagedit .tagchip .x:hover{color:var(--attn)}
  /* in the editor the swatch is the one live spot on an otherwise inert chip —
     the chip above is cursor:default, so the pointer here is what says "click me" */
  .tagedit .tagchip .ink{cursor:pointer;outline-offset:2px}
  .tagedit .tagchip .ink:hover{outline:1px solid var(--line)}
  .inkpick{display:flex;gap:5px;padding:6px 8px;margin-top:8px;width:max-content;
           border:1px solid var(--line);border-radius:4px;background:var(--white)}
  .inkpick b{width:14px;height:14px;border-radius:2px;cursor:pointer;border:1px solid transparent}
  /* the border is always there, transparent until chosen, so picking a colour
     does not shift the row by 2px */
  .inkpick b.on{border-color:var(--ink)}
  /* !important is load-bearing: layout() writes opacity inline on every panel it
     places, so an unqualified rule here loses to the style attribute and the
     filter dims nothing at all — a silent no-op that still shows the crumb. */
  .panel.dim{opacity:.22 !important}
  .panel.dim:hover{opacity:.5 !important}
  .spacer{margin-left:auto} .ambient{font-size:12px;color:var(--muted)}

  .leapwrap{position:fixed;top:58px;left:0;right:0;z-index:45;display:flex;justify-content:center;padding:14px 22px 6px;pointer-events:none}
  .cmd{pointer-events:auto;width:100%;max-width:680px;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;
       box-shadow:0 18px 40px -28px rgba(20,30,25,.45)}
  .cmd.live{border-color:var(--accent-line)}
  .cmd-input{display:flex;align-items:center;gap:12px;padding:13px 16px}
  .leap{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:3px 8px;flex:none}
  #q{flex:1;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none}
  #q::placeholder{color:var(--faint)} .hint{font-size:11.5px;color:var(--faint)}
  .results{display:none;border-top:1px solid var(--line-2);padding:6px 0;max-height:46vh;overflow:auto}
  .cmd.live .results{display:block}
  .group{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 16px 4px}
  .res{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
  .res.sel{background:var(--accent-soft)}
  .res .ic{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;border:1px solid var(--record);background:var(--panel)}
  .res.verb .ic{border:1px solid var(--accent);background:var(--accent);color:#eef6f2}
  .res.space .ic{border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  .res .title{font-size:14px} .res .gp{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
  /* a `by meaning` note ("degraded", "n awaiting") is a statement about the
     search rather than a result: no pointer, because act() ignores it */
  .res.note{cursor:default} .res.note .title{color:var(--faint);font-size:13px}

  .world{position:fixed;inset:0;z-index:10}
  /* the grouped overview is taller than the screen past ~20 notebooks; the
     canvas scrolls rather than shrinking cards below reading size */
  .world.overview{overflow-y:auto;overflow-x:hidden}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0;transition:opacity .45s}
  .world.overview .edges{opacity:1}
  /* a solid spine joins a notebook to the deep-dives it spawned — this is
     containment, not the dashed "related to" thread it replaces */
  .edges line.spine{stroke:var(--accent-line);stroke-width:1;stroke-dasharray:none;opacity:.5}
  .panel{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity;
         transition:transform .5s cubic-bezier(.6,.02,.1,1),opacity .4s;background:var(--panel);border:1px solid var(--line);
         border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -40px rgba(20,30,25,.5)}
  .world.overview .panel{cursor:pointer} .world.overview .panel:hover{border-color:var(--accent-line)}
  /* zoomed far out: the notebook reads as a card — head only, intent clamped */
  .world.cards .p-body{display:none}
  .world.cards .p-head{border-bottom:none}
  .world.cards .p-intent{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .world.cards .p-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}  /* clear the status pill */
  /* a nested notebook is subordinate: smaller, quieter, no crop marks — its
     position already says whose it is */
  .world.cards .panel.kid .p-title{font-size:16px;line-height:1.2}
  .world.cards .panel.kid .p-intent{display:none}
  .world.cards .panel.kid .p-head{padding:13px 16px 11px}
  .world.cards .panel.kid .p-head::before,
  .world.cards .panel.kid .p-head::after{display:none}
  .world.cards .panel.kid{box-shadow:0 10px 22px -20px rgba(20,30,25,.5)}
  .world.cards .panel.kid .p-status{display:none}   /* the spine already says it */
  .panel.child{border-left:4px solid var(--accent-line)}
  /* the head is framed by registration ticks, not a box — an instrument's
     mark. The intention is set in serif: this is a thinking tool, and the one
     line stating what the notebook is FOR should not look like UI chrome. */
  .p-head{padding:24px 26px 14px;border-bottom:1px solid var(--line-2);position:relative}
  .p-head::before,.p-head::after{content:'';position:absolute;top:11px;width:11px;height:11px;
    border-top:1px solid var(--accent-line);pointer-events:none}
  .p-head::before{left:11px;border-left:1px solid var(--accent-line)}
  .p-head::after{right:11px;border-right:1px solid var(--accent-line)}
  .p-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .p-title{font-family:'IBM Plex Serif',Georgia,serif;font-size:25px;font-weight:500;letter-spacing:-.012em;line-height:1.18;margin:0}
  .p-intent{font-family:'IBM Plex Serif',Georgia,serif;font-style:italic;font-size:14px;color:var(--muted);margin:6px 0 0}
  .p-structure{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:9px 0 0}
  .p-structure .slink{color:var(--accent);cursor:pointer;border-bottom:1px solid transparent}
  .p-structure .slink:hover{border-bottom-color:var(--accent-line)}
  .world.cards .p-structure{display:none}   /* the arrangement already shows this */
  .p-body{padding:18px 26px 26px;overflow:auto;flex:1}
  .sec-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:4px 0 11px}
  .obj{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .12s}
  .obj:hover{border-color:var(--record);transform:translateY(-1px)}
  .obj .ttl{font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px}
  .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;
        background:transparent;border:1px solid var(--line);color:var(--faint)}

  .backlink{border:0;background:transparent;color:var(--accent);font-size:12.5px;cursor:pointer;padding:4px 0;margin-bottom:10px;display:inline-flex;gap:6px}
  .molder{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white)}
  .molder-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .molder-h .t{font-weight:600} .molder-h .lab{margin-left:auto;font-size:12px;color:var(--muted)}
  .molder-h select{padding:4px 8px;border-radius:7px;border:1px solid var(--line);font:inherit}
  .molder-b{padding:14px}
  /* ---- data tables: a column of figures should read as a column ---- */
  table.mold{border-collapse:collapse;width:100%;font-size:11.5px;table-layout:fixed}
  /* the header IS the column key — shown as written, not shouted. Uppercase
     with letter-spacing cost ~30% more width and clipped half of them. */
  /* headers wrap (at the underscores), data never does. A column name you
     cannot read is not a header; a row that grows to four lines because one
     value is long is not a table. Each gets the treatment it needs. */
  table.mold th{text-align:left;padding:5px 8px 6px;border-bottom:1px solid var(--line);
                font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);
                white-space:normal;line-height:1.25;vertical-align:bottom;overflow-wrap:anywhere}
  table.mold td{padding:5px 8px;border-bottom:1px solid var(--line-2);
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* figures right-aligned on a tabular grid; long labels truncate rather than
     wrap, because one 45-character region should not set every row's height */
  table.mold th.num,table.mold td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.mold td.num{font-family:var(--mono);font-size:11px;color:var(--ink)}
  table.mold td.txt{color:var(--ink-2)}
  table.mold tbody tr:first-child td{border-top:none}
  table.mold td:first-child{font-weight:500;color:var(--ink)}
  /* ---- the ClojureScript grid. `table.mold`'s own rules still apply — this
     adds only what the old renderer could not do. ---- */
  /* A column as wide as what it holds. `table-layout:auto` is half of it and not
     a detail: `fixed` above divides ONE width between the columns, which is the
     arithmetic being replaced, and under it `max-content` means nothing. */
  .grid table.mold{width:max-content;max-width:none;table-layout:auto}
  /* …up to a cap, because content-sizing has no upper bound. Measured on the
     36-column fixture in an 856px box: 6,646px uncapped, where one 900-character
     `note` value is five sixths of the table, against 1,726px with the cap. The
     cap is also what lets `table.mold td`'s `text-overflow:ellipsis` fire at all
     — a cell that is never constrained never overflows. */
  .grid table.mold th,.grid table.mold td{max-width:320px}
  /* The header IS the column key: at 36 columns `fa` is decodable as `archived`
     only while the header is on screen. `background` is not decoration — a
     sticky element is painted over scrolling content and shows through without
     one. */
  .grid thead th{position:sticky;top:0;z-index:2;background:var(--white);
    cursor:pointer;user-select:none}
  /* A header is a CONTROL, and it has three states rather than two: one click
     sorts ascending, a second descending, a third restores the table's own
     order. `user-select:none` because a control you click three times in a row
     otherwise selects its own label on the second.
     The arrow is a pseudo-element and NOT text in the cell: the browser suite
     finds every column by its header's textContent, and a marker inside the
     cell would rename whichever of the 36 is sorted, halfway through a test.
     Keyed off `aria-sort`, which is also what a screen reader reads and what
     the suite asserts on — one attribute rather than a second data-* copy of
     the same fact. */
  .grid thead th[aria-sort]::after{margin-left:4px;font-size:9px;color:var(--accent)}
  .grid thead th[aria-sort=ascending]::after{content:"\25b2"}
  .grid thead th[aria-sort=descending]::after{content:"\25bc"}
  /* The first column is the row's identity, and a table wider than its panel
     loses it on the first horizontal scroll. */
  .grid th:first-child,.grid td:first-child{
    position:sticky;left:0;z-index:1;background:var(--white);box-shadow:1px 0 0 var(--line)}
  /* the corner is sticky on both axes and must outrank both. */
  .grid thead th:first-child{z-index:3}
  /* The column chooser. `<details>` because it is a disclosure and the browser
     already owns opening and closing it — and because Replicant never writes
     `open`, so the refetch after a tick leaves it as the person left it. */
  .grid .colpick{margin-bottom:9px}
  .grid .colpick>summary{display:inline-block;cursor:pointer;font-size:11.5px;
    color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:7px;
    user-select:none}
  .grid .colpick>summary:hover{color:var(--ink)}
  /* Thirty-six names in one column would be a scroll of its own. A grid of
     tracks that fit their content, capped and scrollable, is the same shape the
     table itself uses one rule up. */
  .grid .colpick-list{margin-top:7px;padding:8px 10px;border:1px solid var(--line);
    border-radius:9px;max-height:190px;overflow:auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
  .grid .colpick-list label{display:flex;align-items:center;gap:6px;min-width:0;
    font-size:11.5px;color:var(--ink-2);cursor:pointer}
  .grid .colpick-list input{margin:0;cursor:pointer}
  /* The last visible column's box is dead, because unticking it would ask the
     server for no columns — which means ALL of them. It has to LOOK dead, or the
     refusal reads as a bug. */
  .grid .colpick-list input:disabled{cursor:default}
  .grid .colpick-list label:has(input:disabled){cursor:default;color:var(--muted)}
  .grid .pager{display:flex;align-items:center;gap:8px;margin-top:10px}
  .grid .pager select{padding:3px 8px;border-radius:7px;border:1px solid var(--line);
    font:inherit;font-size:11.5px;color:var(--muted);background:var(--white)}
  /* A control that cannot act should look like one. `[disabled]` and not a
     class: the attribute is what actually stops the click, so styling anything
     else could show a live button that does nothing, or a grey one that fires. */
  .grid .pager .btn[disabled]{opacity:.35;cursor:default}
  /* the caption sits at the far end, away from the controls — it reports, it is
     not something to press. */
  .grid .pgcap{margin-left:auto;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .moldtext{white-space:pre-wrap;font-size:13px;line-height:1.5} .moldlist{margin:0;padding-left:18px}
  /* a table whose rows the store reclaimed. --attn, like every other state the
     page raises rather than reports: the missing-object cell and a failed flow
     step are the two neighbours. */
  .reclaimed{border:1px solid var(--attn);background:var(--attn-soft);border-radius:9px;padding:11px 13px}
  .reclaimed .sec-h{color:var(--attn);margin-bottom:7px}
  .reclaimed p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .reclaimed p+p{margin-top:7px}
  /* a broken external source. The same box, because a reader has already learned
     it — what differs is that this one ends in a button: a reclaimed table is
     permanent, a broken source is fixable. */
  .srcblock .actions{margin-top:10px}
  /* and a live one's badge. --accent, not --attn: this reports where the rows
     come from, it does not raise a state. */
  .livebadge{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:11.5px}
  .livebadge .muted{color:var(--muted)}
  .badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:3px 7px;border-radius:3px;
         background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)}
  /* scrubbed into the past: --attn, because this one DOES raise a state — the
     rows on screen are not the rows at that point, and the badge is admitting it */
  .badge.past{background:var(--attn-soft);border-color:var(--attn);color:var(--attn)}
  /* ---- the ＋ Data panel: two doors, one panel ---- */
  .dtabs{margin-bottom:11px}
  /* a listing, not a grid: the name is what you read and the size is the tiebreak,
     so the rows are one column of full-width targets rather than cards to scan */
  .filelist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
  .filerow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;cursor:pointer;font:inherit;
           font-size:13px;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:8px 11px}
  .filerow:hover{border-color:var(--record)}
  /* a file that is ALREADY a table, said on the row before you pick it and again
     above the columns after you have. Muted and mono: it is a fact about what
     loci holds, not a warning about what you are doing — Connect stays enabled,
     because two tables from one file is a thing someone may well want and loci's
     answer to a mistake is undo, not a veto. */
  .filerow .dupe{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
  .dupe-note{font-size:12px;line-height:1.5;color:var(--muted);padding:0 0 8px}
  .dupe-note b{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-weight:500}
  .filerow .fmeta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  /* the other door into the same directory. The listing can only offer what loci
     already holds; a file on YOUR machine is not in it yet, and this is what puts
     it there — after which it is an ordinary row, previewed and connected by the
     same code a picked one is. */
  .dupload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 13px}
  .dupload input[type=file]{font:inherit;font-size:12.5px;color:var(--ink-2);max-width:100%}
  /* n/total while the chunks go, and the refusal if one is refused — the same
     line, because they are the same question: where did the file get to? */
  .dprog{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .dprog.bad{color:var(--attn)}
  /* the third door, and the only one for a location loci does not hold: a URL is
     typed, not picked, because `/api/source/files` lists a DIRECTORY and no
     directory will ever contain an s3:// bucket. Beside the upload row rather
     than behind a tab of its own — both rows answer "the file is not in the list
     below", and splitting them would make a reader choose between them before
     knowing the difference, which is the argument that collapsed ＋ Import CSV
     into ＋ Data in the first place. */
  .durl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 13px}
  .durl input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:8px;
              padding:8px 10px;font:inherit;font-size:12.5px}
  /* what `describe` answered, boxed so it reads as the FILE's shape and not as
     the table's — there is no table yet, and that is the whole point of it */
  .srcpreview{border:1px solid var(--line);border-radius:9px;padding:3px 11px 5px;background:var(--white);
              max-height:280px;overflow:auto}
  .dmode{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2)}
  /* where the two radios stand for a local file, and there is nothing to choose:
     `connect!` refuses passthrough for a remote location, so a radio for it could
     only ever produce that refusal. A statement, not a disabled control — a
     disabled control invites a click that can never work. */
  .dmode-fixed{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;
               letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
               border:1px solid var(--line);border-radius:7px;padding:5px 8px}
  /* `reading its columns…`, which for a URL is not a figure of speech: the
     fetch happens HERE, at preview, and an s3:// location whose credentials
     have to be walked and refused takes ~6 s — see `dataPreview`'s comment for
     the measurement and for why a container with no route out is fast instead.
     loci has no timeout and no cancel, so the panel's only honest move is to
     say what the wait is and keep the way out drawn. */
  .dwait{color:var(--muted);font-size:13px;line-height:1.55;padding:6px 0}
  /* loci's remote failures are PARAGRAPHS — `credential-problem`, and the head
     and tail `ensure-remote!` hands `extension-problem`, compose a sentence, an
     indented context block, DuckDB's own text and an indented fix, over eight
     lines. `esc()` keeps those newlines and a `<p>` collapses every one of them,
     so without this the whole of it is drawn as a single run-on line. `pre-wrap` and not `pre-line`: the
     two-space indents are the author's, and pre-line eats them.

     `overflow-wrap` is the other half of the same paragraph, and it is the
     declaration that decides how a long URL breaks. Every one of these messages
     names the location it failed on, and a presigned s3 URL is 500-odd
     characters with no space anywhere in it; `pre-wrap` breaks at soft wrap
     opportunities only, so without this that one word sets the width of the
     column and the message runs off the side of the panel. `anywhere` and not
     `break-word` because only `anywhere` is counted when the min-content width
     is computed, which is the width this box is actually laid out against. */
  .reclaimed p.srcerr{white-space:pre-wrap;overflow-wrap:anywhere}

  .undoBtn.dim{opacity:.4;cursor:not-allowed}          /* time mode: the past cannot be edited */
  /* the count of flows waiting on you. On the button rather than a toast,

  .fbadge{margin-left:6px;background:var(--attn);color:var(--white);border-radius:999px;

  .flowrow .frmeta .fp-attn{color:var(--attn)}
  .flowrow .frq{font-size:12px;color:var(--attn);margin-top:5px}
  .undoBtn:hover{border-color:var(--attn);color:var(--attn)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--ink);color:var(--paper);font-size:12.5px;padding:9px 15px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;display:flex;gap:10px;align-items:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .u{color:var(--accent-line);cursor:pointer;pointer-events:auto;font-weight:500}
  /* TWO ROWS, and the split is the whole fix. The label sizes to its own text and
     that text changes on every scrub — `now · 116 events` at one end, `event
     65/116 · ＋ Geopolitical Shock Scenarios · 23/07/2026, 21:07:24` in the middle.
     While it shared a row with the track inside this fixed-width pill, the track
     absorbed the difference: measured 500.9px → 325.5px on the test fixture, live,
     mid-drag. A pixel↔event scale that moves under the cursor is exactly what "it
     changes size / I cannot do fine control / I slide a little and nothing happens"
     feels like — three complaints, one mechanism.
     Reserving a fixed width for the label (flex:0 0 288px) would also have held the
     track still and been a smaller diff, but it spends 40% of the bar on text
     forever and leaves ~4px per event. On its own row the label cannot reach the
     track at all, and the track spans the pill: 686px measured, constant at every
     position. The precision is the point, so the bar gets taller instead.
     ↩ now moves up to the label row for the same reason — it is the same button in
     the same corner, and leaving it beside the track would have cost 84px of it. */
  .timebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:75;display:none;
           flex-direction:column;gap:8px;
           background:var(--white);border:1px solid var(--accent-line);border-radius:16px;padding:9px 16px 12px;box-shadow:0 20px 50px -30px rgba(20,30,25,.5);width:min(720px,92vw)}
  .timebar.on{display:flex}
  /* The toast lives at the bottom of the screen and so does this bar — and the bar
     grew a row, so a message about the scrub landed ON the track it was about.
     Measured: 72px tall at bottom:18px, so 102px clears it with room. `~` because
     the toast follows .world in the markup, and .timemode is on .world already. */
  .world.timemode ~ .toast{bottom:102px}

  .timebar input[type=range]{width:100%;margin:0;display:block}

  .timelabel{flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the keys are the real answer to "I cannot do fine control" — one press is one
     event at any log length, where the mouse gets 5.9px. A key that works but is
     never mentioned is a key nobody presses, so it is on the bar, not in a title. */
  .timekeys{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);opacity:.7;white-space:nowrap}

  .chips{font-size:10.5px;font-family:var(--mono);color:var(--faint);padding:5px 11px;border-top:1px dashed var(--line-2)}
  .ghostchip{display:inline-block;padding:0 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;margin:0 2px}
  .ghostchip:hover{border-color:var(--accent-line);color:var(--accent)}
  /* An id the agent cited, resolved to what it names. Quieter than a ghostchip
     — this sits INSIDE a sentence and must not break the line's rhythm — but
     underlined so it reads as followable rather than as emphasis. */
  .objref{border-bottom:1px dotted var(--accent-line);color:var(--accent);cursor:pointer}
  .objref:hover{border-bottom-style:solid;background:var(--accent-wash,transparent)}
  .flowgoal{font-weight:600;font-size:13.5px;margin-bottom:8px}
  /* A plan, not a list. Three things carry that: a spine threading the steps
     into one sequence, numbers so position is stated rather than counted, and
     weight that says where you are — done recedes, current is full strength,
     future is light. Before this the verb was --muted, the quietest thing on
     the row, so the eye read five paragraphs of prose with grey labels. */
  /* The notebook outline. A notebook is a vertical stack of cells and the only
     way to reach the sixth one was to scroll past five; this is the map. It is
     `position:sticky` inside .p-body, which is the scrolling ancestor, so it
     stays put without leaving the flow — a fixed rail would have to know the
     panel's transformed position, and panels are scaled and translated. */
  .nbrail{flex:0 0 138px;position:sticky;top:0;max-height:calc(100vh - 190px);
    overflow:auto;padding-right:4px}
  .nbrail .nr-h{font-family:var(--mono);font-size:9.5px;color:var(--faint);

    border-left:2px solid transparent}

     rail stays quiet while you read and still answers "where am I" */
  .nbrail button.on{color:var(--accent);border-left-color:var(--accent)}
  .nbrail .nr-ic{flex:none;width:11px;font-size:10px;opacity:.8}
  .nbrail .nr-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* where a rail click lands, for one beat, so the jump is legible */

  .flowplan{font-family:var(--mono);font-size:10.5px;color:var(--muted);

  .flowplan .fp-attn{color:var(--attn)}

     reads as finite rather than trailing off */
  .flowsteps::before{content:"";position:absolute;left:6px;top:7px;bottom:9px;
    width:1px;background:var(--line)}
  .flowstep{display:grid;grid-template-columns:13px 16px 68px 1fr;gap:8px;
    align-items:baseline;font-size:12.5px;position:relative}

  .flowstep .fnum{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
  /* the verb is the plan's vocabulary — it is the loud token now, not the note */
  .flowstep .fverb{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:600}
  .flowstep .fnote{color:var(--ink-2)}
  .flowstep .fwhy{color:var(--attn);font-size:11.5px;grid-column:4}

  .flowstep.s-done .fverb{color:var(--muted);font-weight:400}
  .flowstep.s-done .fnote{color:var(--muted)}
  .flowstep.s-done .fic{color:var(--muted)}

     happened is more real than what is merely planned */
  .flowstep.s-pending .fverb{color:var(--muted);font-weight:400;opacity:.75}
  .flowstep.s-pending .fnote{opacity:.6}
  .flowstep.s-pending .fic{color:var(--line)}

  .flowstep.v-gate .fverb{color:var(--attn);font-weight:600;opacity:1}
  .flowstep.s-needs-you .fic,.flowstep.s-failed .fic,.flowstep.s-rejected .fic{color:var(--attn)}
  .flowstep .fneeds{font-family:var(--mono);font-size:10px;color:var(--attn);
    letter-spacing:.06em;white-space:nowrap;margin-left:8px}
  .fstat{margin-top:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .nbrow{display:flex;gap:16px;align-items:flex-start}

  .raillink:hover{border-color:var(--accent-line)}
  .raillink .why{font-family:var(--mono);font-size:10px;color:var(--faint);line-height:1.5}
  .addrow{display:flex;gap:8px;margin-top:8px;align-items:center}
  .addrow input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px}
  .memfact{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:9px}
  .memfact .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px}
  .memfact .dots{color:var(--accent);letter-spacing:2px}
  /* what a fact is ABOUT, on its own line between the fact and the .src run —
     never inside that run, which is already six `·`-separated segments and would
     grow a dangling separator the first time a fact named nothing. Mono, because
     a chip reads `tsmc`: a normalized identity rather than a botched title, and
     the same register .entname draws it in on the page the chip opens.
     line-height, because several subjects wrap and inline-block chips on a
     wrapped line otherwise touch. */
  .memfact .ents{margin-top:6px;font-family:var(--mono);font-size:10.5px;line-height:2}
  .memfact .ents .ghostchip{margin:0 4px 0 0}
  /* what the memory layer is doing, in the same mono/muted register as .src */
  .memstat{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:-6px 0 12px}
  .memfact .mergedtoggle{cursor:pointer;color:var(--accent);border-bottom:1px dotted var(--accent-line)}
  .memfact .mergedlist{margin-top:6px;padding-left:9px;border-left:1px solid var(--line-2);
                       font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.6}
  /* the toggle sets [hidden]; the UA rule for it is display:none and nothing
     above declares display on .mergedlist, but say it here so a later rule that
     does cannot quietly turn the toggle into a no-op */
  .memfact .mergedlist[hidden]{display:none}
  .memfact .mergedlist .mid{color:var(--faint)}
  /* undoing a merge is an act, not a disclosure like .mergedtoggle beside it, so
     it is a real button — focusable and reachable without a pointer */
  .memfact .mergedlist .unmerge{font:inherit;font-size:10.5px;color:var(--accent);background:none;
                       border:1px solid var(--accent-line);border-radius:5px;padding:0 5px;cursor:pointer}
  .memfact .mergedlist .unmerge:hover{background:var(--accent-wash,transparent)}
  .memfact .mergedlist .unmerge[disabled]{opacity:.5;cursor:default}
  /* A fact that does not age says so INSIDE the run that carries its age, and
     that placement is the whole point: `365d ago` is still true for a durable
     fact and no longer affects how it ranks, so left alone the number reads as
     "buried" about a fact that is not. Ink rather than the run's muted grey —
     it is the one segment here that changes what recall does with the row. */
  .memfact .timeless{color:var(--ink)}
  /* and it is revisable, so it is a real button — focusable and reachable
     without a pointer, the same shape as .unmerge, which is the other act this
     pane offers. Its OWN row rather than a segment inside .src: that run is a
     line of `·`-separated statements about the fact, and a control sitting in it
     reads as one more statement rather than as something to press — and its text
     would land inside every assertion written about the run. */
  .memfact .factact{margin-top:5px}
  .memfact .agetoggle{font:inherit;font-family:var(--mono);font-size:10.5px;color:var(--accent);
                      background:none;border:1px solid var(--accent-line);border-radius:5px;
                      padding:0 5px;cursor:pointer}
  .memfact .agetoggle:hover{background:var(--accent-wash,transparent)}
  .memfact .agetoggle[disabled]{opacity:.5;cursor:default}
  /* Muted, not red. This is an ordinary action that happens to be permanent —
     the note in the footer says so once, and a row that shouted it every time
     would make the pane feel dangerous to read rather than to use. */
  .memfact .forget{font:inherit;font-family:var(--mono);font-size:10.5px;color:var(--muted);
    background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;
    cursor:pointer;margin-left:6px}
  .memfact .forget:hover{color:var(--danger,#a33);border-color:var(--danger,#a33)}
  .memfact .forget[disabled]{opacity:.5;cursor:default}
  /* the entity page — ONE renderer, three surfaces, so every rule here is drawn
     into the modal (before the subject is a citizen), into the molder (after),
     and into a notebook cell: materialize-entity! mints a notebook whose only
     cell is the entity, which is where the reader lands the moment they act.
     .entname is mono because `tsmc` is a normalized key and not a botched title:
     in the mono register a lowercase token reads as an identity, which is what
     it is, and nothing is tempted to re-case it. It reuses .memfact for the
     facts themselves — they ARE memory facts, and a second box that looked
     nearly like one would be the drift this page exists to avoid. */
  .entname{font-family:var(--mono);font-size:15px;color:var(--ink)}
  .entmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:3px 0 12px}
  .entmeta.warn{color:var(--attn)}
  .entsrc{font-size:11.5px;color:var(--muted);margin-top:10px}

  /* what the lake costs. THREE figures side by side and never one, because the
     one a reader reaches for — "how much would this free" — answers almost
     nothing on its own: measured on the real store, reclaiming every object's
     history moves the directory by 1.8%, since catalog.duckdb is 98% of it and
     never shrinks. Equal columns so no figure reads as the headline. */
  .stfigs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 12px}
  .stfig{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel)}
  .stfig .stnum{display:block;font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:500}
  .stfig .stlab{display:block;font-size:11px;line-height:1.35;color:var(--muted);margin-top:2px}
  /* --attn, not red: the catalog is not a fault, it is the part of the answer
     that does not move. The reader has to see it to read the other two. */
  .stfig.storage-catalog{border-color:var(--attn);background:var(--attn-soft)}
  .stfig.storage-catalog .stlab{color:var(--attn)}
  .stnote{font-size:11.5px;line-height:1.5;color:var(--muted);margin:0 0 12px}
  .storphan{border:1px solid var(--line);border-left:3px solid var(--attn);border-radius:7px;
            padding:8px 10px;margin:0 0 12px;font-size:11.5px;line-height:1.5;color:var(--ink-2)}
  .storphan code{font-family:var(--mono);font-size:10.5px;color:var(--ink)}
  .strow{border-top:1px solid var(--line-2);padding:9px 0;display:flex;align-items:baseline;gap:10px}
  .strow:first-of-type{border-top:0}
  .strow .stmain{flex:1;min-width:0}
  .strow .stid{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .strow .sttitle{font-size:12px;color:var(--muted);margin-left:7px}
  .strow .stmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
  /* an inlined table costs nothing in Parquet because DuckLake keeps it inside
     catalog.duckdb. "0 B" is true and unreadable — it looks like a table that
     failed to write. The phrase points at the figure above that DOES hold it. */
  .strow .stinlined{color:var(--attn)}
  .strow .stnone{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
  .strow .st-reclaim{font:inherit;font-family:var(--mono);font-size:10.5px;color:var(--muted);
    background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;white-space:nowrap}
  .strow .st-reclaim:hover{color:var(--attn);border-color:var(--attn)}
  .strow .st-reclaim[disabled]{opacity:.5;cursor:default}
  /* the files directory, under a rule of its own. NOT a fourth figure in the
     grid above: those three are the lake's arithmetic and they add up, and a
     directory total dropped among them would belong to neither sum. */
  .stfiles{border-top:1px solid var(--line);margin-top:13px;padding-top:10px}
  .stfiles .stfh{font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
  .stfiles .strow{border-top:0;padding:0}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  </div>
