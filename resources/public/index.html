// ---------------- an external source, and the two states you can repair ----
//
// A passthrough table copies nothing: its handle IS the recipe, so the file
// stays the truth and its bytes can change with no event committed. `hydrate`
// therefore degrades such a table with a marker rather than throwing, and the
// server ships the state STRUCTURALLY on `m.source` — reading it back out of
// `m.unusable`'s English is what `hydrate` itself refuses to do, and a shell
// branching on `indexOf('unreachable')` would reintroduce exactly that.
//
// `loci://files/sales.csv` → `sales.csv`. The uri is what the recipe records;
// the file name is what a reader recognises. Anything else comes back whole,
// because a `file://` source has nowhere shorter to be.
const srcFile = uri => String(uri||'').replace(/^loci:\/\/files\//,'');
// The format from the extension, and never from a control: the three formats
// the server reads map one-to-one onto extensions, so a second place to say it
// would be a second place to be wrong. Unknown extensions ask as CSV, which is
// what `read_csv`'s sniffer is for.
//
// **The query string comes off first**, for the same reason `uriTail` strips it
// a few lines down. A presigned URL is the ordinary way an S3 object is handed
// over https — it is the escape hatch loci's own credential message points at —
// and it carries its signature after a `?`. Matched with `$` against the whole
// string, `sales.parquet?X-Amz-Signature=…` ends in neither `.parquet` nor
// `.csv`, falls through to the default, and loci reads a parquet file with
// `read_csv`: a DuckDB parse error attributed to the URL, or, for `.json?token=`,
// one VARCHAR column of raw JSON text that Connect will happily materialise.
// The heading says `sales.parquet · csv` while it happens — the panel disagreeing
// with itself on screen. A `?` cannot occur in a `loci://files/<hash>` uri, so no
// caller that existed before the URL field changes.
const srcFormat = uri => (String(uri||'').toLowerCase().split(/[?#]/)[0]
  .match(/\.(csv|parquet|json)$/)||[,'csv'])[1];
// Is this a location DuckDB FETCHES rather than one loci resolves? The same
// question `sourcespec/remote?` answers, and yes, that is two places.
//
// It is two places because the shell has to decide what to DRAW before it has
// asked anything, and there is no route that answers "is this remote". What
// makes the duplication safe is what each copy decides: this one picks controls,
// `sourcespec/remote?` picks a code path, and the server stays the authority on
// both. Disagree in either direction and the cost is a message, never a wrong
// table — call a local file remote and the panel offers only copy-in, which is
// what a local file does anyway; call a remote one local and the panel offers
// read live, which `connect!` refuses BY NAME with a sentence naming the mode
// and the uri. Neither is silent, and neither writes anything.
const isRemote = uri => /^(https?|s3):\/\//.test(String(uri||''));
// The last path segment of a location, for a preview that has no file row
// behind it to take a name from: `https://h/a/sales.csv?t=1` → `sales.csv`.
// Falls back to the whole uri rather than to '' — an empty heading and a blank
// proposed title are worse than a long one.
//
// Decoded, because what this answers is a HEADING and a proposed table title —
// not a location. `sales%20q3.csv` is what the URL has to say; `sales q3.csv` is
// what the file is called, and it is the name that goes in the title field. In a
// try/catch and not bare: a lone `%` is a legal character in a path DuckDB will
// fetch, `decodeURIComponent` throws `URIError` on it, and that would take the
// whole preview out over a heading. The uri itself is never touched — `locate`
// answers a remote location verbatim, and `f.uri` is the only string that
// reaches DuckDB.
const uriTail = uri => {
  const t = String(uri||'').split(/[?#]/)[0].split('/').filter(Boolean).pop() || String(uri||'');
  try{ return decodeURIComponent(t); }catch(e){ return t; }
};

function tableHTML(rows){
  if(!rows||!rows.length) return '<i>empty</i>';

  // A column is numeric if the values say so — CSS cannot see that, so the
  // markup has to carry it. Figures then align right on a tabular grid, which
  // is the whole reason a column of numbers is readable at a glance. Blanks
  // don't count as evidence either way: real tables have holes.
  const numeric={};
  cols.forEach(c=>{
    const vals=rows.map(r=>r[c]).filter(v=>v!==null&&v!==undefined&&v!=='');
    numeric[c]=vals.length>0&&vals.every(v=>typeof v==='number');
  });
  const cell=(r,c)=>{
    const v=r[c], s=(v===null||v===undefined)?'':String(v);
    return '<td class="'+(numeric[c]?'num':'txt')+'" title="'+esc(s)+'">'+esc(s)+'</td>';
  };

  // width evenly — so a 4-character year gets as much room as a 45-character
  // region name. Size each column by what it actually holds, clamped so one
  // long value cannot starve the rest.
  const width=c=>{
    const seg=Math.max(...c.split('_').map(w=>w.length));           // longest unbroken word
    const longest=shown.reduce((m,r)=>Math.max(m,String(r[c]??'').length),seg);
    return Math.min(Math.max(longest+2,7),28);   // +2 for the cell's padding

    widths.map(w=>'<col style="width:'+(100*w/total).toFixed(2)+'%">').join('')+'</colgroup><thead><tr>'+
    cols.map(c=>'<th class="'+(numeric[c]?'num':'txt')+'" title="'+esc(c)+'">'+
                esc(c).replace(/_/g,'_<wbr>')+'</th>').join('')+'</tr></thead><tbody>'+
    shown.map(r=>'<tr>'+cols.map(c=>cell(r,c)).join('')+'</tr>').join('')+
    '</tbody></table></div>';

}

      case 'text':    return mdToHtml(b.text);

function chartSVG(spec){
  if(!spec||!spec.rows||!spec.rows.length) return '<i>no chart</i>';
  const rows=spec.rows, xf=spec.x, yf=spec.y;
  const W=520,H=200,pad=36;
  const colors=['#2f6f5b','#a9632f','#3f7d5f','#7a5ea7','#9a6a2f','#4a6d8f'];
  if(spec.chart==='bar'){
    const maxy=Math.max(1,...rows.map(r=>+r[yf]));
    const bw=(W-2*pad)/rows.length; let g='';
    rows.forEach((r,i)=>{ const bh=(+r[yf]/maxy)*(H-2*pad); const x=pad+i*bw+bw*0.15; const y=H-pad-bh;
      g+='<rect x="'+x+'" y="'+y+'" width="'+(bw*0.7)+'" height="'+bh+'" rx="2" fill="'+colors[i%colors.length]+'"/>';
      g+='<text x="'+(x+bw*0.35)+'" y="'+(H-pad+13)+'" font-size="9" text-anchor="middle" fill="#6d7872">'+esc(String(r[xf]).slice(0,9))+'</text>'; });
    return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';
  }
  // line (optionally multi-series)
  const xs=[...new Set(rows.map(r=>String(r[xf])))].sort();
  const xi=Object.fromEntries(xs.map((v,i)=>[v,i]));
  const maxy=Math.max(1,...rows.map(r=>+r[yf]));
  const sx=v=>pad+(xi[String(v)]/Math.max(1,xs.length-1))*(W-2*pad);
  const sy=v=>H-pad-(v/maxy)*(H-2*pad);
  let series; if(spec.series){ series={}; rows.forEach(r=>{(series[r[spec.series]]=series[r[spec.series]]||[]).push(r);}); }
  else series={'':rows};
  let g='',ci=0;
  Object.values(series).forEach(rs=>{ rs=rs.slice().sort((a,b)=>String(a[xf])<String(b[xf])?-1:1);
    const c=colors[ci++%colors.length];
    const pts=rs.map(r=>sx(r[xf])+','+sy(+r[yf])).join(' ');
    g+='<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="2"/>';
    rs.forEach(r=>g+='<circle cx="'+sx(r[xf])+'" cy="'+sy(+r[yf])+'" r="2.5" fill="'+c+'"/>'); });
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';
}

// ---------------- the shape the substrate already knows ----------------
// A notebook spawned by a deep-dive belongs UNDER it, recursively — the
// substrate computes spawned-by/merged-from and the overview should show that
// rather than laying 24 notebooks out as peers. Returns root nodes:
//   {i, sp, kids:[…same…]}
function clusterTree(){
  const byId={}, roots=[];
  STATE.spaces.forEach((sp,i)=>{ byId[sp.id]={i,sp,kids:[]}; });
  STATE.spaces.forEach(sp=>{
    // /api/state flattens spawned-by to a bare id; merged-from is a vector
    const parent = sp['spawned-by'] || (sp['merged-from']||[])[0];
    const node = byId[sp.id];
    if(parent && byId[parent] && parent!==sp.id) byId[parent].kids.push(node);
    else roots.push(node);
  });
  // a cycle would orphan its members from every root; surface them rather
  // than letting them vanish from the overview entirely
  const seen=new Set();
  (function walk(ns){ ns.forEach(n=>{ seen.add(n.i); walk(n.kids); }); })(roots);
  STATE.spaces.forEach((sp,i)=>{ if(!seen.has(i)) roots.push(byId[sp.id]); });
  return roots;
}

// ---------------- layout (focus / overview zoom) ----------------
// A root cluster keeps the column it is already in. Packing each one into

// every cluster placed before it, so creating one notebook could move a
// different one a full column across the screen — measured on a 35-notebook
// corpus, space:pub-pop went from x=72 to x=569 when an unrelated notebook was
// created. Two things perturbed the packing order: /api/state's :spaces comes
// from a hash map, so a new notebook lands at an arbitrary index rather than
// last; and any cluster growing taller re-routed every cluster after it.
// A root with no column yet still takes the shortest one — only the
// re-deciding was wrong.

      else{const off=k<focusIdx?-fw*1.12:fw*1.12;p.style.transform='translate('+(fx+off)+'px,'+top+'px) scale(.86)';p.style.opacity='0';p.style.zIndex=1;p.style.pointerEvents='none';}
    });

    // short and an intent is sliced mid-sentence — and that one line saying
    // what the notebook is FOR is the whole reason the overview is readable.
    let PH=150;
    roots.forEach(r=>{ const p=panels[r.i];
      p.style.width=PW+'px'; p.classList.remove('kid');
      PH=Math.max(PH, p.querySelector('.p-head').scrollHeight+3); });
    // a nested card is head-only too — so measure ITS head instead of padding
    // every one out to a fixed 96px. A one-line title left 29px of empty card
    // below it, which reads as a mistake rather than as breathing room; the
    // card that needs two lines still gets them.
    const kidH=n=>{ const p=panels[n.i];
      p.style.width=KW+'px'; p.classList.add('kid');
      return Math.max(66, p.querySelector('.p-head').scrollHeight+3); };
    // pack each cluster into the column it already has, or — for one that has
    // none yet — into whichever is currently shortest, measured as it is
    // placed, so no height needs predicting
    const colY=[padTop,padTop,padTop], spines=[];
    // ids that are no longer notebooks would otherwise pile up for the life of
    // the page. The prune is for size only: a stale entry is never consulted,
    // because only current roots are looked up.
    const live=new Set(STATE.spaces.map(sp=>sp.id));
    Object.keys(colOf).forEach(id=>{ if(!live.has(id)) delete colOf[id]; });
    const place=(n,x,y,w,h)=>{
      const p=panels[n.i];
      p.style.width=w+'px'; p.style.height=h+'px';
      p.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';
      p.style.opacity='1'; p.style.zIndex=2; p.style.pointerEvents='auto';
      p.classList.toggle('kid', w!==PW);
      return y+h*s;
    };
    roots.forEach(r=>{
      // clusterTree's nodes are {i,sp,kids} with sp===STATE.spaces[i]
      const id=r.sp.id;
      // the c>=colY.length arm only matters if the column count ever shrinks —
      // it is a hard-coded 3 today (see colW above), so it is a guard, not a
      // live path; it keeps a remembered index from pointing off the end.
      let c=colOf[id];
      if(c===undefined||c>=colY.length){ c=colY.indexOf(Math.min(...colY)); colOf[id]=c; }
      const x=padX+c*(colW+COLGAP);
      const top0=colY[c];
      let y=place(r,x,top0,PW,PH)+KGAP;
      // every notebook that spawned something carries its own rail, so a
      // grandchild hangs off the deep-dive that spawned it and not off the
      // root — otherwise three levels read as one flat list of siblings
      (function walk(n,depth,railX,railTop){
        let lastTick=null;
        n.kids.forEach(k=>{
          const kx=x+INDENT*depth+10, y0=y, kh=kidH(k);
          y=place(k,kx,y,KW,kh)+KGAP;
          lastTick=y0+kh*s/2;
          spines.push(['tick',railX,lastTick,kx]);   // the elbow into each child
          walk(k,depth+1,kx+9,y0+kh*s);
        });
        if(lastTick!==null) spines.push(['spine',railX,railTop,lastTick]);
      })(r,1,x+9,top0+PH*s);
      colY[c]=y+GROUPGAP;
    });
    // .world is fixed at viewport size; scrolling comes from content extending
    // past it. Absolutely-positioned panels do create scrollable overflow, but a
    // spacer makes the bottom margin explicit — and the edges SVG must grow too,
    // or every spine below the fold is clipped.
    const contentH=Math.max(vh,Math.max(...colY)+40);
    let end=document.getElementById('canvasEnd');
    if(!end){ end=document.createElement('div'); end.id='canvasEnd'; world.appendChild(end); }
    end.style.cssText='position:absolute;left:0;width:1px;height:1px;top:'+contentH+'px';
    const edges=document.getElementById('edges');
    edges.style.height=contentH+'px';
    edges.innerHTML=spines.map(sp=>
      sp[0]==='spine'
        ? '<line class="spine" x1="'+sp[1]+'" y1="'+sp[2]+'" x2="'+sp[1]+'" y2="'+sp[3]+'"/>'
        : '<line class="spine" x1="'+sp[1]+'" y1="'+sp[2]+'" x2="'+sp[3]+'" y2="'+sp[2]+'"/>'
    ).join('');
  }
  crumbHint.style.display=mode==='overview'?'none':'inline';
  crumbName.textContent=mode==='overview'?'all notebooks':(STATE.spaces[focusIdx]||{}).title||'—';
  applyOverviewFilter();   // survives resize and re-render
}
function enter(i){ mode='focus'; focusIdx=i; openId=null; closeLeap();
                   overviewFilter=null; tagState={};   // both belong to the overview
                   renderBody(i); layout(); }
function overview(){ mode='overview'; openId=null; closeLeap(); layout(); }
crumb.addEventListener('click',()=>mode==='focus'?overview():enter(focusIdx));
addEventListener('resize',layout);

// ---------------- time scrubber (the record, never the recall) ----------------
const timebar=document.getElementById('timebar'), timeRange=document.getElementById('timeRange'),
      timeLabel=document.getElementById('timeLabel');
let timeDeb;
async function enterTime(){
  let ev; try{ ev=await API.events(); }catch(e){ showToast('time: network error'); return; }
  TIME={n:ev.total,total:ev.total,events:ev.events};
  timeRange.min=0; timeRange.max=ev.total; timeRange.value=ev.total;
  // Entering time stands you at `now` — the world already on screen — so there is
  // nothing to re-render, and no reason to throw away what you were reading. This
  // used to be `overview(); rebuild()`, which closed the document you pressed ⏱
  // while reading, for the same bad reason `scrubTo` did. A rebuild would in fact
  // COST a round trip here: renderBody draws “loading…” for an open object, so it
  // would need openObject to fetch a payload that is already drawn.
  // closeLeap explicitly, because overview() used to do it and the palette's
  // refusal to open in the past is documented as relying on that.
  closeModal(); closeLeap();
  timebar.classList.add('on'); paintTime();
  // focus on the way in, or ← → do nothing until you have clicked the track —
  // which is the gesture the keys are there to replace
  timeRange.focus();
}
function timeCaption(){
  if(!TIME) return '—';
  if(TIME.n>=TIME.total) return 'now · '+TIME.total+' events';
  const e=TIME.events[TIME.n-1];
  return TIME.n===0 ? 'the beginning — before the first event'
       : 'event '+TIME.n+'/'+TIME.total+' · '+(e?e.label:'')+(e&&e.ts?' · '+new Date(e.ts).toLocaleString():'');
}
function paintTime(){
  timeLabel.textContent=timeCaption();
  world.classList.toggle('timemode', !!TIME);   // time mode on ⇒ read-only, at ANY slider position
  // the past is read-only, so undo must LOOK read-only too — it still answers
  // when clicked (with why), rather than being a control that quietly does nothing
  document.getElementById('undoBtn').classList.toggle('dim', !!TIME);
}
// Openable at a point in time: the object is in that state's `:objects` AND some
// notebook there holds it. Both halves are load-bearing — the molder draws INSIDE
// a notebook panel, and the seed puts every document before the spaces that
// reference it, so there is a stretch of the log where a document exists with
// nowhere to draw it (renderDetail would reach for a `#bodyN` that isn't there).
function openableAt(s,id){
  return !!id && s.objects.some(o=>o.id===id) && s.spaces.some(sp=>sp.members.includes(id));
}
// Draw the world `s` describes and keep what is open — if it is there to keep.
// `where` names the point we just moved to, for the one case where it isn't.
function restoreInto(s,where){
  const was=openId, wasTitle=(STATE.objects[was]||{}).title||was;
  applyState(s);
  if(was && !openableAt(s,was)){
    // An object open at event 90 may not exist at event 40, and the silent version
    // of this is a known defect at another door: /api/object answers a missing
    // object with {title:null, kind:"data", rendered:null} and the molder draws an
    // empty header over the word `null`. So fall back LOUDLY — name what was
    // dropped and say where it went.
    openId=null; mode='overview'; rebuild();
    showToast('“'+wasTitle+'” does not exist '+where+' — showing the overview');
    return;
  }
  rebuild(); if(openId) openObject(openId);   // renderBody draws “loading…” until this lands
}
async function scrubTo(n){
  TIME.n=n; paintTime();
  clearTimeout(timeDeb);
  timeDeb=setTimeout(async()=>{
    if(!TIME) return;
    const want=TIME.n;
    let s; try{ s=await API.state(want<TIME.total?want:undefined); }catch(e){ showToast('time: network error'); return; }
    if(!TIME||TIME.n!==want) return;                       // stale response
    // This used to end `mode='overview'; openId=null`, so the first millimetre of
    // drag closed whatever you were reading — and watching ONE thing change across
    // the log is the main reason to have a scrubber at all. Keep it open and
    // re-read it at the new `?at=`.
    restoreInto(s,'at event '+want);
  },120);
}
async function exitTime(){
  let s; try{ s=await API.state(); }catch(e){ showToast('network error — still in the past'); return; }
  TIME=null; timebar.classList.remove('on'); world.classList.remove('timemode');
  document.getElementById('undoBtn').classList.remove('dim');   // the present is writable again
  // ↩ now can land on something open, now that scrubbing keeps your place — and a
  // document you opened in the past may have been deleted since. Same restore, and
  // without it a bare `rebuild()` would leave the panel reading “loading…” forever.
  restoreInto(s,'in the present');
}
document.getElementById('timeBtn').addEventListener('click',()=>TIME?exitTime():enterTime());
document.getElementById('timeNow').addEventListener('click',exitTime);
timeRange.addEventListener('input',()=>scrubTo(+timeRange.value));
// Escape leaves the past — and now has to be caught HERE. The global handler sees
// a focused INPUT in front of it and does the right thing for a text field: blur
// and return. Without this, ⏱ would need two Escapes to close.
timeRange.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); exitTime(); } });

// ---------------- LEAP filters the overview ----------------
// Filtering is an entry in LEAP's own list rather than a mode: the dropdown
// closes because you finished with it, and Ask / New space / memory hits stay
// reachable from the overview, which suppressing the panel would have cost.
let overviewFilter=null;          // {q, ids:Set} — sticky until you leave overview

// A notebook matches on its own title/id, on a prose cell inside it (LEAP
// returns the NOTEBOOK's id for prose), or on containing an object that
// matched — `in text` hits carry the document's id, not its notebook's.
function notebooksMatching(entries){
  const direct=new Set(entries.filter(e=>e.group==='space'||e.group==='prose').map(e=>e.id));
  const hits=new Set(entries.map(e=>e.id));
  const ids=new Set();
  STATE.spaces.forEach(sp=>{
    if(direct.has(sp.id) || (sp.members||[]).some(m=>hits.has(m))) ids.add(sp.id);
  });
  return ids;
}

function applyOverviewFilter(){
  const lit = sp => (!overviewFilter || overviewFilter.ids.has(sp.id)) && passesTags(sp);
  panels.forEach((p,k)=>p.classList.toggle('dim', mode==='overview' && !lit(STATE.spaces[k])));
  const cr=document.getElementById('crumbFilter'); if(cr) cr.remove();
  const tagBits=Object.entries(tagState).map(([t,v])=>(v==='in'?'+':'−')+t);
  if(!overviewFilter && !tagBits.length) return;
  const n=STATE.spaces.filter(lit).length;
  const el=document.createElement('span'); el.id='crumbFilter'; el.className='crumbfilter';
  el.innerHTML='· '+(overviewFilter?'“'+esc(overviewFilter.q)+'” ':'')+
               (tagBits.length?esc(tagBits.join(' '))+' ':'')+
               '<b>'+n+' of '+STATE.spaces.length+'</b>'+
               ' <span class="x" title="clear the filter">✕</span>';
  el.querySelector('.x').addEventListener('click',e=>{ e.stopPropagation(); clearAllFilters(); });
  crumb.appendChild(el);
}
function clearOverviewFilter(){ overviewFilter=null; applyOverviewFilter(); }
function clearAllFilters(){ overviewFilter=null; clearTags(); applyOverviewFilter(); }

// ---------------- tags narrow the same set LEAP's filter narrows ----------------
// One dimming path, one crumb, one predicate. A second parallel filter with its
// own rules would be the mode this design has avoided throughout.
let tagState={};                  // {tag: 'in' | 'out'} — absent means neutral

function allTags(){
  const seen=new Map();
  STATE.spaces.forEach(sp=>(sp.tags||[]).forEach(t=>seen.set(t.tag,(seen.get(t.tag)||0)+1)));
  return [...seen.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

// The list is srv/tag-inks, same eight in the same order. Only the LIST is
// mirrored — the server's *assignment* rule (least-used ink, hash only to pick
// where to start looking) lives on the server and is not reimplemented here.
const TAG_INKS=['#2f6f5b','#2b6b74','#3f5a8a','#6b4a8a','#8c3f5a','#7a5a2f','#5f6b33','#4a5560'];
// The ink is interpolated into a style attribute, and esc() does not run on it,
// so its shape is checked rather than trusted: set-tag-color! refuses a
// non-palette hex but assign-inks! writes the registry without passing that
// gate, and one quote reaching the attribute would end it early.
const TAG_INK_RE=/^#[0-9a-fA-F]{6}$/;
// A tag set before colours existed has no registry entry. This fallback is a
// weaker, different rule from the server's — a bare hash, which can put two
// tags on one ink where the server's least-used pick would not. It exists only
// so such a corpus doesn't render every swatch the same accent green.
function tagInk(t){
  const c=(STATE.tagColors||{})[t]; if(TAG_INK_RE.test(c)) return c;
  let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  return TAG_INKS[h%TAG_INKS.length];
}

// include if it carries any included tag (or none are included); exclude wins,
// because "semiconductors except the geopolitics" is the question people ask
function passesTags(sp){
  const on=Object.entries(tagState);
  if(!on.length) return true;
  const mine=new Set((sp.tags||[]).map(t=>t.tag));
  const inc=on.filter(([,v])=>v==='in').map(([t])=>t);
  const exc=on.filter(([,v])=>v==='out').map(([t])=>t);
  if(exc.some(t=>mine.has(t))) return false;
  return !inc.length || inc.some(t=>mine.has(t));
}

function cycleTag(tag){
  tagState[tag] = tagState[tag]==='in' ? 'out' : tagState[tag]==='out' ? undefined : 'in';
  if(!tagState[tag]) delete tagState[tag];
  renderTagStrip(); applyOverviewFilter();
}
function clearTags(){ tagState={}; renderTagStrip(); }

function renderTagStrip(){
  let strip=document.getElementById('tagstrip');
  const tags=allTags();
  if(mode!=='overview' || !tags.length){ if(strip) strip.remove(); return; }
  if(!strip){ strip=document.createElement('div'); strip.id='tagstrip';
              document.body.appendChild(strip); }
  strip.innerHTML=tags.map(([t,n])=>
    '<button class="tagchip '+(tagState[t]||'')+'" data-tag="'+esc(t)+'" '+
    'style="--tag-ink:'+tagInk(t)+'" '+
    'title="click: include · again: exclude · again: off">'+
    '<u class="ink"></u>'+esc(t)+' <i>'+n+'</i></button>').join('');
  strip.querySelectorAll('.tagchip').forEach(b=>
    b.addEventListener('click',()=>cycleTag(b.dataset.tag)));
}

// with the canvas scrolling, a filter whose matches are all below the fold
// shows a screen of grey and looks broken — bring the first one into view
function scrollToFirstMatch(){
  if(!overviewFilter) return;
  const k=STATE.spaces.findIndex(s=>overviewFilter.ids.has(s.id));
  if(k<0) return;
  const r=panels[k].getBoundingClientRect(), w=document.getElementById('world');
  if(r.top<140||r.bottom>innerHeight) w.scrollTop+=r.top-180;
}

// ---------------- LEAP ----------------
// Two requests, one list. Every keystroke asks the lexical /api/leap and draws
// the answer, exactly as it always has. ~250 ms after you stop typing — and on
// Enter — a second request with `deep=1` comes back with a `by meaning` group
// that is MERGED into what is already on screen.
//
// The deep answer is slower by an embedding round trip, so the race is the
// defect to design against, not to hope past: it must never redraw the lexical
// half, and an answer for a query the box has moved on from must never land on
// top of a newer one. So both responses are checked against the input's CURRENT
// value before anything renders, `leapQ` records which query the drawn list
// belongs to, and the deep rows are kept WITH the query they answer rather than
// merged blind — if they beat their own lexical half home they wait for it
// instead of attaching themselves to the previous query's list.
const DEEP_GROUP='by meaning';
const DEEP_PAUSE=250;
let leapQ=null;         // the query `leapEntries` is the answer to
let leapEntries=[];     // the lexical rows, as /api/leap returned them
let leapDeep=null;      // {q, rows} — the `by meaning` rows and their query
let deepTimer=null;

// `by meaning` sits after the lexical content and before the view verbs, which
// is where a ?deep=1 response itself puts it: it is content, and the verbs stay
// where the hands already know they are.
function withDeep(entries){
  const rows=(leapDeep&&leapDeep.q===leapQ)?leapDeep.rows:[];
  if(!rows.length) return entries;
  // The server already drops a semantic hit on an object the lexical pass
  // found; this only keeps that true if the two responses read the substrate at
  // different moments. Notes have no object behind them and are never dropped.
  const seen=new Set(entries.map(e=>e.id));
  const add=rows.filter(e=>e.note||!seen.has(e.id));
  if(!add.length) return entries;
  const k=entries.findIndex(e=>e.group==='viewer');
  return k<0?entries.concat(add):entries.slice(0,k).concat(add,entries.slice(k));
}
// identity is no good across a rebuild — the ask/filter/new rows are made fresh
// every time — so a row is recognised by what it says it is
const rowKey=r=>r?r.group+'␀'+r.id+'␀'+(r.label||''):null;

async function renderLeap(){
  const qv=q.value.trim();
  const entries=await API.leap(qv);
  if(q.value.trim()!==qv) return;   // a later keystroke has already asked; this answer is behind the box
  leapQ=qv; leapEntries=entries;
  composeLeap(false);
}

// Fired on the pause and on Enter, never on a keystroke.
function scheduleDeep(){
  clearTimeout(deepTimer);
  deepTimer=setTimeout(()=>deepen(q.value.trim()), DEEP_PAUSE);
}
async function deepen(qv){
  clearTimeout(deepTimer);
  // "" has no meaning to search by, and the past is not what a present-tense
  // vector answers about — the server refuses the first, and this refuses both.
  if(!qv||TIME) return;
  let entries; try{ entries=await API.leapDeep(qv); }catch(err){ return; }  // an extra: a failure leaves the list alone
  if(!Array.isArray(entries)) return;                                       // nor does an error body become a row
  // Two checks, and neither is spare. This one drops an answer the box has
  // already moved past, so a slow one cannot displace the fresh one in hand;
  // the stash below is keyed by its query, so rows are only ever drawn beside
  // the lexical list they belong to. A test covers each.
  if(q.value.trim()!==qv) return;
  leapDeep={q:qv, rows:entries.filter(e=>e.group===DEEP_GROUP)};
  if(leapQ===qv) composeLeap(true);
}

// keepSel: hold the cursor on the row it was on. A merge happens while you are
// looking at the list and inserts rows above the verbs, so without this the
// selection would quietly slide onto a different result.
function composeLeap(keepSel){
  const qv=leapQ, entries=withDeep(leapEntries);
  const was=keepSel?rowKey(filtered[sel]):null;
  filtered = qv
    ? [{id:'__ask__',label:'Ask the agent: “'+qv+'”',group:'ask',prompt:qv}]
        .concat(entries, [{id:'__new__',label:'New space (agent): “'+qv+'”',group:'create',prompt:qv}])
    : entries;
  // ⧉ connect: from a focused notebook, a space hit offers a non-destructive merge
  if(mode==='focus'&&!TIME&&qv&&STATE.spaces[focusIdx]){
    const cur=STATE.spaces[focusIdx];
    filtered.filter(r=>r.group==='space'&&r.id!==cur.id).slice(0,2).forEach(s=>{
      filtered.push({id:'__connect:'+s.id, label:'⧉ Connect “'+cur.title+'” + “'+(s.label||s.id)+'”',
                     group:'create', connect:s.id});
    });
  }
  // ⊟ filter: only from the overview, where the dropdown is what's in the way.
  // Second, right under Ask — appended it sits at flat index 11 for a rich query,
  // below the .results 46vh fold, which is precisely the burial this verb exists
  // to undo. Ask keeps the top slot; from 25 notebooks, "show me fewer" is next.
  if(mode==='overview'&&!TIME&&qv){
    // leapEntries, not the merged list: clicking this row re-runs the LEXICAL
    // query and filters on that, so counting semantic hits here would advertise
    // a number the filter then does not apply.
    const n=notebooksMatching(leapEntries).size;
    filtered.splice(1,0,{id:'__filter__', group:'filter',
      label:'⊟ Filter the overview: “'+qv+'” · '+n+' of '+STATE.spaces.length});
  }
  if(was){ const i=filtered.findIndex(r=>rowKey(r)===was); if(i>=0) sel=i; }
  if(sel>=filtered.length) sel=0;
  if(!filtered.length){ results.innerHTML='<div class="group">no match</div>'; return; }
  let h='',last=null,flat=0;
  const gname={ask:'Ask',space:'Notebooks',viewer:'View verbs',create:'Create',filter:'Filter',prose:'In notebooks','in text':'In documents',subject:'Subjects',memory:'Memory','views & functions':'Views & functions','by meaning':'By meaning'};
  filtered.forEach(e=>{ const grp=gname[e.group]||'Content';
    if(grp!==last){h+='<div class="group">'+grp+'</div>';last=grp;}
    const i=flat++;
    // a semantic hit carries the KIND of the object it found, so a notebook
    // found by meaning wears a notebook's mark — and act() enters it rather
    // than opening it as a document. The group header says how it was found.
    const sp=e.group==='space'||(e.group===DEEP_GROUP&&e.kind==='space');
    // A subject takes no class of its own. `space` and `verb` are promises about
    // what Enter does — go inside a notebook; do something rather than go
    // somewhere — and a subject's Enter opens a page to read, which is what an
    // undressed row promises already. A `.subject` rule would be a stylesheet
    // grown for a distinction the heading and the mark make without one.
    const cls=e.note?'note':sp?'space':(e.group==='viewer'||e.group==='create'||e.group==='ask'||e.group==='filter')?'verb':'';
    // ◈ and not ⌾: ⌾ is memory's mark, a subject is where memory hangs, and the
    // two groups appear in the same list — one query returns both.
    const ic=e.note?'⋯':sp?'▢':e.group==='ask'?'✦':e.group==='viewer'?'▸':e.group==='create'?'✦':e.group==='filter'?'⊟':e.group==='subject'?'◈':e.group==='memory'?'⌾':e.group==='prose'?'¶':e.group==='in text'?'§':e.group==='views & functions'?'ƒ':'▤';
    // The grey right-hand column says WHICH of several same-reading rows this is,
    // and above a subject the heading has just said it — `subject:tsmc` there
    // would be that heading plus the label again, in the one slot on the row
    // whose job is to add something. What only this row can say is how much is
    // behind the name, which is also what decides whether it is worth going to,
    // and the only thing that tells two subjects apart. `:object` rides on the
    // row too and is deliberately NOT drawn: it is a snapshot act() must not read
    // (see there), and putting it on screen would advertise the very short-circuit
    // the design refused.
    const gp=e.group==='subject'?(e.count===1?'1 fact':(e.count||0)+' facts'):e.id;
    h+='<div class="res '+cls+(i===sel?' sel':'')+'" data-i="'+i+'"><span class="ic">'+ic+'</span>'+
       '<span class="title">'+esc(e.label)+'</span><span class="gp">'+esc(gp)+'</span></div>'; });
  results.innerHTML=h;
  results.querySelectorAll('.res').forEach(r=>{ r.addEventListener('mousemove',()=>{sel=+r.dataset.i;paintSel();}); r.addEventListener('click',()=>{sel=+r.dataset.i;act();}); });
}
// the list scrolls at 46vh, so arrowing past the fold used to move the selection
// somewhere invisible — keep whatever is selected on screen
function paintSel(){
  results.querySelectorAll('.res').forEach(r=>{
    const on=+r.dataset.i===sel;
    r.classList.toggle('sel',on);
    if(on) r.scrollIntoView({block:'nearest'});
  });
}
async function act(){ const e=filtered[sel]; if(!e) return;
  // a `by meaning` note is a statement about the search — "degraded", "n chunks
  // awaiting" — and `__deep__` is not an id anything can open. Nothing acts on it.
  if(e.note) return;
  if(e.connect){                       // ⧉ non-destructive merge of two notebooks
    let r; try{ r=await API.connect(STATE.spaces[focusIdx].id, e.connect); }catch(err){ showToast('connect: network error'); return; }
    if(r.error){ showToast(r.error); return; }

// headings, lists, quotes, then inline marks. No library, no surprises.
// URL and object-id linkifying, hoisted out of mdToHtml so the paths that are
// NOT markdown can share them. A notebook's intent and a prose cell are plain
// sentences rendered with esc() — full markdown there would start turning a
// stray asterisk into emphasis — but an id cited in one is exactly as dead as
// an id cited in a draft, which was the complaint these exist to answer.
// Trailing punctuation is not part of a URL — but /wiki/Mercury_(planet) is.
// The text is already esc()'d, so a closing quote arrives as &quot;, which is
// punctuation too; a query's &amp; in the MIDDLE stays, and the parser turns it
// back into & on read. Trim entities, then . , ; : ! ?, then an UNBALANCED ) or
// ], and repeat — "(https://x/a)." needs three passes.
const trimUrl=u=>{ let prev; const n=ch=>u.split(ch).length-1;
  do{ prev=u;
    u=u.replace(/(?:&(?:amp|quot|lt|gt|#\d+);|[.,;:!?])$/,'');
    if(/\)$/.test(u)&&n('(')<n(')')) u=u.slice(0,-1);
    if(/\]$/.test(u)&&n('[')<n(']')) u=u.slice(0,-1);

// inside anchor text must not re-arm linkifying for the rest of the anchor.

    return p.replace(/\bhttps?:\/\/[^\s<]+/g,m=>{ const u=trimUrl(m);

function mdToHtml(md){
  const lines=esc(md||'').split('\n');
  const out=[]; let i=0, para=[];
  // order matters: [**bold**](u) works only because bold runs before the link rule
  const inline=s=>objlink(autolink(s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')));
  const flush=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); para=[]; } };
  const sep=l=>/\|/.test(l)&&/^[\s|:\-]+$/.test(l);
  const cells=l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inline(c.trim()));
  while(i<lines.length){
    const l=lines[i]; let m;
    if(/^```/.test(l)){ flush(); const buf=[]; i++;
      while(i<lines.length&&!/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; out.push('<pre class="mdcode">'+buf.join('\n')+'</pre>'); continue; }
    if(/\|/.test(l)&&sep(lines[i+1]||'')){
      flush();
      let t='<table class="mold"><tr>'+cells(l).map(c=>'<th>'+c+'</th>').join('')+'</tr>'; i+=2;
      while(i<lines.length&&/\|/.test(lines[i])&&!sep(lines[i])){
        t+='<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; i++; }
      out.push(t+'</table>'); continue; }
    if(m=l.match(/^###+\s+(.*)/)){ flush(); out.push('<h4>'+inline(m[1])+'</h4>'); i++; continue; }
    if(m=l.match(/^##?\s+(.*)/)){ flush(); out.push('<h3>'+inline(m[1])+'</h3>'); i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ flush(); const it=[];
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){ it.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++; }
      out.push('<ul>'+it.join('')+'</ul>'); continue; }
    if(/^\s*\d+\.\s+/.test(l)){ flush(); const it=[];
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){ it.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; }
      out.push('<ol>'+it.join('')+'</ol>'); continue; }
    if(/^&gt;\s?/.test(l)){ flush(); const q=[];
      while(i<lines.length&&(m=lines[i].match(/^&gt;\s?(.*)/))){ q.push(inline(m[1])); i++; }
      out.push('<blockquote>'+q.join('<br>')+'</blockquote>'); continue; }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){ flush(); out.push('<hr>'); i++; continue; }
    if(/^\s*$/.test(l)){ flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return '<div class="md">'+out.join('')+'</div>';
}

// One line under the search field, always present — not a badge that shows up
// when something breaks, so "everything is fine" is something you can read
// rather than infer from an absence. Switching to an uncalibrated embedding
// model otherwise stops deduplication with one line on stderr at boot and
// nothing in the app that ever says so again.
//
// A number and a model name always appear together: "12 awaiting" with no model
// beside it reads like a backlog, when with no embedder configured it means the
// feature is off and every fact awaits one forever. So the unconfigured line
// carries no count.
//
// `total` is the size of the whole memory — the payload's `total`, which the
// server computes over every live fact independently of `?q=` and `?space=`. It
// is NOT `facts.length`: a query answers with the ranked top 20, so a page-
// derived denominator would say "12 of 20 awaiting", a claim about the memory
// made out of a page of results. null when the response carries no total at all,
// and then the line says what it knows and no denominator — an unknown 80 is
// better left unsaid than replaced with the 20 that happens to be on screen.
function memoryStatus(res,total){
  const model=res.embedding, awaiting=res.awaiting||0, detail=[];
  let text;
  // `degraded` is ABSENT when healthy rather than present-and-empty, and is read
  // in exactly this one place — `if (p.degraded)` here and `if ('degraded' in p)`
  // somewhere else is the pair that disagrees. It exists only when an embedder
  // was asked something and did not answer, so it never means "unconfigured".
  if(!model) text='no embedder configured — recall is by words only';
  else if(res.degraded){ text='embedder unreachable — showing word matches only'; detail.push(res.degraded); }
  else if(awaiting) text=model+' · '+awaiting+(total===null?'':' of '+total)+' awaiting embedding';
  else text=model+' · '+(total===null?'all facts embedded':total+' fact'+(total===1?'':'s')+', all embedded');
  // Merge state is orthogonal to embedding state, so it is a clause on whichever
  // of the four lines applies — but only on a refusal. `{off:true}` is the
  // missing embedder, which the first line has already said, and one cause said
  // twice is noise. `:merge` carries no model name of its own; the model is
  // `:embedding`, and a refusal can only happen when one is configured.
  if(res.merge&&res.merge.refused){

    detail.push(res.merge.refused);

  // measure a new one, which is more than a status line should be spending

// What a fact is about, as the pane draws it.
//
// `:entities` are the raw strings the distiller wrote, and the design keeps them
// that way — facts are never rewritten to point at entity ids. `absorb` then
// unions them with `distinct` over those raw strings, so one survivor really can
// carry ["tsmc","TSMC"," tsmc "]: three chips for one subject, all three opening
// the same page. And a model's JSON puts "" and null in there, which are not
// subjects at all.
//
// So fold before drawing: collapse whitespace, trim, lowercase, drop blanks, keep
// first-seen order. That is loci.entities/normalize's rule, and this is a PORT of
// it — the shell has no access to the real one, and there is no endpoint that
// normalizes a list. An earlier draft called it an approximation and said a
// disagreement would be "cosmetic". Both halves of that were wrong, and it is
// worth saying how, because the correction is not the obvious one:
//
//   1. It is not cosmetic. A chip is drawn from the folded string AND opens it, so
//      a fold that disagrees with the server's asks for a subject that is not the
//      one the fact names. Measured on a fact whose only entity was "Nanjing﻿":
//      the chip read `nanjing`, `/api/entity?name=nanjing` answered `{count:0}`,
//      and the page said "Nothing is remembered about this yet" — a chip ON a fact
//      opening a page that denies the fact exists, still offering ✦ New notebook
//      about this, so you could commit a subject with no evidence behind it.
//
//   2. The obvious repair — swap `\s` for Java's `[\s\p{Z}]` — does not fix that
//      case. `String.prototype.trim()` strips JS WhiteSpace, which carries U+FEFF,
//      so a TRAILING BOM is still eaten after the collapse leaves it alone. And
//      `clojure.string/trim` is not `String::trim` either: it walks
//      `Character.isWhitespace`, which is false for NUL..U+0008 and true for
//      U+001C..U+001F. After the collapse the only members of that set still
//      standing are U+0020 and U+001C..U+001F, which is exactly the class below.
//
// Measured, not reasoned: every one of the 1,114,112 code points folded in three
// positions (leading, internal, trailing) through both this function and
// `ent/normalize` on the JVM. 3,336,192 cases, 0 disagreements. The shipped fold
// had 11 (U+001C..U+001F at either end, U+FEFF anywhere); `[\s\p{Z}]` + `.trim()`
// has 10. Lowercasing agrees everywhere, final sigma included, so `Locale/ROOT`
// needs no counterpart here.
//
// Rejected: draw the raw string and deduplicate on the folded one. That makes the
// pane pick a winner among six spellings and then show a chip whose text is not
// the subject it opens.
//
// Uncapped, also deliberately. Measured on the live corpus: 84 facts, mean 2.5
// subjects, widest 7 — and the thing that inflates the list, a merge unioning raw
// spellings, is precisely what the fold above collapses. A cap would need a reveal
// control to avoid truncating in silence (this project's rule), which is a second
// disclosure widget beside .mergedtoggle for a case that has never occurred; and a
// fact naming forty subjects is a distiller that over-extracted, which is
// something this pane exists to make visible rather than to hide behind "+33 more".
function factEntities(f){
  const out=[], seen=new Set();
  for(const e of ((f&&f.entities)||[])){
    // `[\t\n\v\f\r\p{Z}]` is Java's `[\s\p{Z}]` spelled out — Java's `\s` is the six
    // ASCII whitespace characters and nothing more, so JS's is a WIDER class, not
    // the same one — and `[\u001c-\u0020]` is what clojure.string/trim still has
    // left to remove once that collapse has run. Neither may be shortened to `\s`
    // or to `.trim()`; see the note above for the 3.3M-case sweep that says so.
    const k=String(e==null?'':e)
      .replace(/[\t\n\v\f\r\p{Z}]+/gu,' ')
      .replace(/^[\u001c-\u0020]+|[\u001c-\u0020]+$/g,'')
      .toLowerCase();
    if(!k||seen.has(k)) continue;
    seen.add(k); out.push(k);
  }
  return out;
}
