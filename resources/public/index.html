<!doctype html>
<!-- loci shell — layer 5. Spaces + LEAP, data-driven from the Clojure substrate (/api). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loci</title>
<!-- inline so the shell asks the server for nothing it doesn't need (the 404 was noise) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ECEEEA'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232f6f5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEEEA; --panel:#F7F8F5; --white:#fff;
    --ink:#1B211E; --ink-2:#3f4a44; --muted:#6d7872; --faint:#97a09a;
    --line:#d6dad3; --line-2:#e6e9e3; --record:#c8cdc5;
    --accent:#2f6f5b; --accent-line:#73a797; --accent-soft:rgba(47,111,91,.09);
    --attn:#a9632f; --attn-soft:rgba(169,99,47,.10);
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:12.5px;line-height:1.5;
       -webkit-font-smoothing:antialiased;overflow:hidden;
       background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);
       background-size:28px 28px}   /* paper with a faint rule, not a flat fill */
  button,input{font-family:inherit}
  mark{background:var(--accent-soft);border-radius:3px;padding:0 1px}

  .topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:50;display:flex;align-items:center;gap:16px;padding:0 22px;
          background:linear-gradient(var(--paper),rgba(236,238,234,.85));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .mark{display:flex;align-items:baseline;gap:9px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);position:relative;top:-1px}
  .wordmark{font-weight:600;font-size:20px;letter-spacing:-.02em}.wordmark span{color:var(--faint);font-weight:400}
  .crumb{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;background:transparent;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px}
  .crumb:hover{background:var(--panel);color:var(--ink)} .crumb b{color:var(--ink);font-weight:500}
  .crumb .ov{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint)}
  .crumbfilter{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:7px}
  .crumbfilter b{color:var(--accent);font-weight:500}
  .crumbfilter .x{margin-left:5px;cursor:pointer;color:var(--faint);padding:0 3px}
  .crumbfilter .x:hover{color:var(--attn)}
  /* the strip sits under LEAP in its own row — the mock floated it beneath the
     LEAP bar where nothing could be clicked, and only a scripted click hid that */
  #tagstrip{position:fixed;left:0;right:0;top:132px;z-index:12;display:flex;gap:6px;
            justify-content:center;flex-wrap:wrap;pointer-events:auto}
  .world.overview ~ #tagstrip{display:flex}
  .tagchip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:3px 9px;
           border-radius:2px;border:1px solid var(--line);background:var(--white);
           color:var(--muted);cursor:pointer}
  .tagchip i{font-style:normal;color:var(--faint);margin-left:4px}
  .tagchip.in{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
  .tagchip.out{border-color:var(--attn);color:var(--attn);background:var(--attn-soft);
               text-decoration:line-through}
  /* !important is load-bearing: layout() writes opacity inline on every panel it
     places, so an unqualified rule here loses to the style attribute and the
     filter dims nothing at all — a silent no-op that still shows the crumb. */
  .panel.dim{opacity:.22 !important}
  .panel.dim:hover{opacity:.5 !important}
  .spacer{margin-left:auto} .ambient{font-size:12px;color:var(--muted)}

  .leapwrap{position:fixed;top:58px;left:0;right:0;z-index:45;display:flex;justify-content:center;padding:14px 22px 6px;pointer-events:none}
  .cmd{pointer-events:auto;width:100%;max-width:680px;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;
       box-shadow:0 18px 40px -28px rgba(20,30,25,.45)}
  .cmd.live{border-color:var(--accent-line)}
  .cmd-input{display:flex;align-items:center;gap:12px;padding:13px 16px}
  .leap{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:3px 8px;flex:none}
  #q{flex:1;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none}
  #q::placeholder{color:var(--faint)} .hint{font-size:11.5px;color:var(--faint)}
  .results{display:none;border-top:1px solid var(--line-2);padding:6px 0;max-height:46vh;overflow:auto}
  .cmd.live .results{display:block}
  .group{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 16px 4px}
  .res{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
  .res.sel{background:var(--accent-soft)}
  .res .ic{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;border:1px solid var(--record);background:var(--panel)}
  .res.verb .ic{border:1px solid var(--accent);background:var(--accent);color:#eef6f2}
  .res.space .ic{border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  .res .title{font-size:14px} .res .gp{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}

  .world{position:fixed;inset:0;z-index:10}
  /* the grouped overview is taller than the screen past ~20 notebooks; the
     canvas scrolls rather than shrinking cards below reading size */
  .world.overview{overflow-y:auto;overflow-x:hidden}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0;transition:opacity .45s}
  .world.overview .edges{opacity:1}
  /* a solid spine joins a notebook to the deep-dives it spawned — this is
     containment, not the dashed "related to" thread it replaces */
  .edges line.spine{stroke:var(--accent-line);stroke-width:1;stroke-dasharray:none;opacity:.5}
  .panel{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity;
         transition:transform .5s cubic-bezier(.6,.02,.1,1),opacity .4s;background:var(--panel);border:1px solid var(--line);
         border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -40px rgba(20,30,25,.5)}
  .world.overview .panel{cursor:pointer} .world.overview .panel:hover{border-color:var(--accent-line)}
  /* zoomed far out: the notebook reads as a card — head only, intent clamped */
  .world.cards .p-body{display:none}
  .world.cards .p-head{border-bottom:none}
  .world.cards .p-intent{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .world.cards .p-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}  /* clear the status pill */
  /* a nested notebook is subordinate: smaller, quieter, no crop marks — its
     position already says whose it is */
  .world.cards .panel.kid .p-title{font-size:16px;line-height:1.2}
  .world.cards .panel.kid .p-intent{display:none}
  .world.cards .panel.kid .p-head{padding:13px 16px 11px}
  .world.cards .panel.kid .p-head::before,
  .world.cards .panel.kid .p-head::after{display:none}
  .world.cards .panel.kid{box-shadow:0 10px 22px -20px rgba(20,30,25,.5)}
  .world.cards .panel.kid .p-status{display:none}   /* the spine already says it */
  .panel.child{border-left:4px solid var(--accent-line)}
  /* the head is framed by registration ticks, not a box — an instrument's
     mark. The intention is set in serif: this is a thinking tool, and the one
     line stating what the notebook is FOR should not look like UI chrome. */
  .p-head{padding:24px 26px 14px;border-bottom:1px solid var(--line-2);position:relative}
  .p-head::before,.p-head::after{content:'';position:absolute;top:11px;width:11px;height:11px;
    border-top:1px solid var(--accent-line);pointer-events:none}
  .p-head::before{left:11px;border-left:1px solid var(--accent-line)}
  .p-head::after{right:11px;border-right:1px solid var(--accent-line)}
  .p-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .p-title{font-family:'IBM Plex Serif',Georgia,serif;font-size:25px;font-weight:500;letter-spacing:-.012em;line-height:1.18;margin:0}
  .p-intent{font-family:'IBM Plex Serif',Georgia,serif;font-style:italic;font-size:14px;color:var(--muted);margin:6px 0 0}
  .p-structure{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:9px 0 0}
  .p-structure .slink{color:var(--accent);cursor:pointer;border-bottom:1px solid transparent}
  .p-structure .slink:hover{border-bottom-color:var(--accent-line)}
  .world.cards .p-structure{display:none}   /* the arrangement already shows this */
  .p-body{padding:18px 26px 26px;overflow:auto;flex:1}
  .sec-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:4px 0 11px}
  .obj{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .12s}
  .obj:hover{border-color:var(--record);transform:translateY(-1px)}
  .obj .ttl{font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px}
  .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;
        background:transparent;border:1px solid var(--line);color:var(--faint)}

  .backlink{border:0;background:transparent;color:var(--accent);font-size:12.5px;cursor:pointer;padding:4px 0;margin-bottom:10px;display:inline-flex;gap:6px}
  .molder{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white)}
  .molder-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .molder-h .t{font-weight:600} .molder-h .lab{margin-left:auto;font-size:12px;color:var(--muted)}
  .molder-h select{padding:4px 8px;border-radius:7px;border:1px solid var(--line);font:inherit}
  .molder-b{padding:14px}
  /* ---- data tables: a column of figures should read as a column ---- */
  table.mold{border-collapse:collapse;width:100%;font-size:11.5px;table-layout:fixed}
  /* the header IS the column key — shown as written, not shouted. Uppercase
     with letter-spacing cost ~30% more width and clipped half of them. */
  /* headers wrap (at the underscores), data never does. A column name you
     cannot read is not a header; a row that grows to four lines because one
     value is long is not a table. Each gets the treatment it needs. */
  table.mold th{text-align:left;padding:5px 8px 6px;border-bottom:1px solid var(--line);
                font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);
                white-space:normal;line-height:1.25;vertical-align:bottom;overflow-wrap:anywhere}
  table.mold td{padding:5px 8px;border-bottom:1px solid var(--line-2);
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* figures right-aligned on a tabular grid; long labels truncate rather than
     wrap, because one 45-character region should not set every row's height */
  table.mold th.num,table.mold td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.mold td.num{font-family:var(--mono);font-size:11px;color:var(--ink)}
  table.mold td.txt{color:var(--ink-2)}
  table.mold tbody tr:first-child td{border-top:none}
  table.mold td:first-child{font-weight:500;color:var(--ink)}
  .moldtext{white-space:pre-wrap;font-size:13px;line-height:1.5} .moldlist{margin:0;padding-left:18px}
  .md{white-space:normal;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
  .md p{margin:0 0 9px} .md p:last-child{margin-bottom:0}
  .md h3{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:16px;margin:14px 0 6px;color:var(--ink)}
  .md h3:first-child,.md h4:first-child{margin-top:0}
  .md h4{font-size:13.5px;font-weight:600;margin:12px 0 4px;color:var(--ink)}
  .md ul,.md ol{margin:0 0 10px;padding-left:20px} .md li{margin:2px 0}
  .md code{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
  .md .mdcode{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:0 0 10px}
  .md blockquote{border-left:3px solid var(--accent-line);margin:0 0 10px;padding:2px 0 2px 12px;color:var(--muted)}
  .md hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
  .md a{color:var(--accent)} .md table{margin:0 0 10px}

  .p-status{position:absolute;top:18px;right:20px;display:none;align-items:center;gap:7px;font-size:11.5px;font-family:var(--mono);color:var(--muted)}
  .world.overview .p-status{display:flex}
  .adot{width:7px;height:7px;border-radius:50%;background:var(--record)}
  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer}
  .btn:hover{opacity:.9} .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.sm{padding:4px 10px;font-size:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .undoBtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;font-size:12.5px;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer;font-family:var(--mono)}
  .undoBtn.dim{opacity:.4;cursor:not-allowed}          /* time mode: the past cannot be edited */
  .undoBtn:hover{border-color:var(--attn);color:var(--attn)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--ink);color:var(--paper);font-size:12.5px;padding:9px 15px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;display:flex;gap:10px;align-items:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .u{color:var(--accent-line);cursor:pointer;pointer-events:auto;font-weight:500}
  .timebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:75;display:none;align-items:center;gap:12px;
           background:var(--white);border:1px solid var(--accent-line);border-radius:999px;padding:8px 16px;box-shadow:0 20px 50px -30px rgba(20,30,25,.5);width:min(720px,92vw)}
  .timebar.on{display:flex}
  .timebar input[type=range]{flex:1}
  .timelabel{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
  .world.timemode .actions,.world.timemode .cellbar,.world.timemode .addrow,
  .world.timemode .mkcell,.world.timemode select[data-remold],
  .world.timemode #editbtn,.world.timemode #makebtn,.world.timemode .fnpal{display:none!important}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(20,28,24,.28);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding-top:92px}
  .modal.on{display:flex}
  .modalcard{width:100%;max-width:620px;max-height:76vh;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 40px 80px -40px rgba(20,30,25,.6)}
  .modal-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line-2);background:var(--panel)}
  .modal-h .q{font-size:13px;color:var(--muted)} .modal-h .q b{color:var(--ink)}
  .modal-b{padding:18px 20px;overflow:auto;font-size:14px;line-height:1.6;color:var(--ink-2)}
  .modal-b h3{font-family:'IBM Plex Serif',serif;font-weight:400;font-size:17px;margin:14px 0 6px;color:var(--ink)}
  .modal-b h4{font-size:14px;margin:12px 0 4px;color:var(--ink)}
  .modal-f{display:flex;gap:8px;align-items:center;padding:13px 18px;border-top:1px solid var(--line-2);background:var(--panel)}
  .prose{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0 0 4px;white-space:pre-wrap}
  .cellwrap{position:relative;padding:2px 0;border-radius:8px}
  .cellwrap:hover{background:rgba(20,30,25,.02)}
  .cellbar{position:absolute;top:2px;right:0;display:none;gap:4px;z-index:2}
  .cellwrap:hover .cellbar{display:flex}
  .cellbar button{border:1px solid var(--line);background:var(--white);border-radius:6px;font-size:10px;font-family:var(--mono);color:var(--muted);cursor:pointer;padding:2px 6px}
  .cellbar button:hover{color:var(--ink);border-color:var(--record)}
  .cellmold{border:1px solid var(--line);border-radius:4px;background:var(--white);margin:6px 0 12px;overflow:hidden}
  .cellmold .hd{display:flex;align-items:center;gap:8px;padding:7px 11px;background:transparent;border-bottom:1px solid var(--line-2);font-size:12px}
  .cellmold .hd .t{font-weight:500;cursor:pointer} .cellmold .hd .t:hover{color:var(--accent)}
  .cellmold .hd select{margin-left:auto;padding:2px 6px;border-radius:6px;border:1px solid var(--line);font:inherit;font-size:11.5px}
  .cellmold .mkcell{border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--accent);cursor:pointer;font-size:11.5px;padding:2px 7px}
  .cellmold .mkcell:hover{border-color:var(--accent-line);background:var(--accent-soft)}
  .fnpal{border:1px dashed var(--accent-line);border-radius:10px;background:var(--panel);padding:10px 12px;margin:0 0 10px}
  .fnchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .fnchip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
  .fnchip:hover{border-color:var(--accent-line)} .fnchip.on{border-color:var(--accent);color:var(--accent)}
  .fnchip.dis{opacity:.45;cursor:not-allowed}
  .fnparams{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;margin-bottom:8px}
  .fnparams select,.fnparams input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px}
  .fnba{display:flex;gap:10px;align-items:flex-start;overflow-x:auto}
  .fnba>div{flex:1;min-width:0} .fnarrow{flex:none;color:var(--accent);padding-top:22px}
  .cellmold .bd{padding:10px 12px;overflow-x:auto}
  .chips{font-size:10.5px;font-family:var(--mono);color:var(--faint);padding:5px 11px;border-top:1px dashed var(--line-2)}
  .ghostchip{display:inline-block;padding:0 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;margin:0 2px}
  .ghostchip:hover{border-color:var(--accent-line);color:var(--accent)}
  .flowgoal{font-weight:600;font-size:13.5px;margin-bottom:8px}
  .flowsteps{display:flex;flex-direction:column;gap:4px}
  .flowstep{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
  .flowstep .fic{width:16px;flex:none;color:var(--accent)}
  .flowstep.s-failed .fic,.flowstep.s-rejected .fic{color:var(--attn)}
  .flowstep.s-needs-you .fic{color:var(--attn)}
  .flowstep .fverb{font-family:var(--mono);font-size:11px;color:var(--muted);width:64px;flex:none}
  .flowstep .fnote{color:var(--ink-2)}
  .flowstep .fwhy{color:var(--attn);font-size:11.5px}
  .fstat{margin-top:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .nbrow{display:flex;gap:16px;align-items:flex-start}
  .rail{flex:none;width:210px}
  .raillink{border:1px solid var(--line);border-radius:9px;background:var(--white);padding:8px 11px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
  .raillink:hover{border-color:var(--accent-line)}
  .raillink .why{font-family:var(--mono);font-size:10px;color:var(--faint);line-height:1.5}
  .addrow{display:flex;gap:8px;margin-top:8px;align-items:center}
  .addrow input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px}
  .memfact{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:9px}
  .memfact .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px}
  .memfact .dots{color:var(--accent);letter-spacing:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="topbar">
  <div class="mark"><span class="dot"></span><span class="wordmark">loci<span>.</span></span></div>
  <button class="crumb" id="crumb"><span class="ov" id="crumbHint">⊞ overview</span> <b id="crumbName">—</b></button>
  <div class="spacer"></div>
  <div class="ambient" id="ambient"></div>
  <button class="undoBtn" id="memBtn" title="what the agent remembers — distilled facts with provenance">⌾ memory</button>
  <button class="undoBtn" id="fnBtn" title="peek at the functions in this substrate (for the curious — not the everyday flow)">ƒ functions</button>
  <button class="undoBtn" id="timeBtn" title="scrub the substrate's history — view any past moment, read-only">⏱ time</button>
  <button class="undoBtn" id="undoBtn" title="revert the last substrate event">↺ undo</button>
</div>

<div class="leapwrap"><div class="cmd" id="cmd">
  <div class="cmd-input"><span class="leap">LEAP</span>
    <input id="q" autocomplete="off" spellcheck="false" placeholder="Type to find anything across the substrate…">
    <span class="hint">esc · overview</span></div>
  <div class="results" id="results"></div>
</div></div>

<div class="world" id="world"><svg class="edges" id="edges"></svg></div>
<div class="toast" id="toast"></div>
<div class="timebar" id="timebar">
  <button class="btn ghost sm" id="timeNow">↩ now</button>
  <input type="range" id="timeRange" min="0" max="0" value="0">
  <div class="timelabel" id="timeLabel">—</div>
</div>
<div class="modal" id="modal"></div>

<script>
const POST = (url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
const API = {
  state: at => fetch('/api/state'+(at!=null?'?at='+at:'')).then(r=>r.json()),
  object: (id,at) => fetch('/api/object/'+encodeURIComponent(id)+(at!=null?'?at='+at:'')).then(r=>r.json()),
  mold: (id,view,at) => fetch('/api/mold?id='+encodeURIComponent(id)+'&view='+encodeURIComponent(view)+(at!=null?'&at='+at:'')).then(r=>r.json()),
  leap: q => fetch('/api/leap?q='+encodeURIComponent(q)).then(r=>r.json()),
  undo: () => fetch('/api/undo').then(r=>r.json()),
  edit: (id,value) => POST('/api/edit',{id,value}),
  delegate: space => POST('/api/delegate',{space}),
  do: (id,prompt,space) => POST('/api/do',{id,prompt,space}),
  functions: () => fetch('/api/functions').then(r=>r.json()),
  newSpace: prompt => POST('/api/new-space',{prompt}),
  ask: (prompt,space) => POST('/api/ask',{prompt,space}),
  keepNote: (space,title,text) => POST('/api/keep-note',{space,title,text}),
  importCsv: (title,csv,space) => POST('/api/import-csv',{title,csv,space}),
  research: (space,prompt) => POST('/api/research',{space,prompt}),
  flow: (space,goal) => POST('/api/flow',{space,goal}),
  flowGate: (id,approve) => POST('/api/flow-gate',{id,approve}),
  notebook: (id,at) => fetch('/api/notebook?id='+encodeURIComponent(id)+(at!=null?'&at='+at:'')).then(r=>r.json()),
  events: () => fetch('/api/events').then(r=>r.json()),
  notebookOp: body => POST('/api/notebook', body),
  memory: q => fetch('/api/memory'+(q?'?q='+encodeURIComponent(q):'')).then(r=>r.json()),
  deepDive: space => POST('/api/deep-dive',{space}),
  job: id => fetch('/api/job?id='+encodeURIComponent(id)).then(r=>r.json()),
  fns: id => fetch('/api/fns?id='+encodeURIComponent(id)).then(r=>r.json()),
  fnPreview: (id,fnid,params) => POST('/api/fn-preview',{id,fnid,params}),
  fnApply: (id,fnid,params,space) => POST('/api/fn-apply',{id,fnid,params,space}),
  rerun: id => POST('/api/rerun',{id}),
  connect: (a,b) => POST('/api/connect',{a,b}),
};

let STATE={spaces:[],objects:{}};
let panels=[], mode='focus', focusIdx=0, openId=null;
let filtered=[], sel=0;
let TIME=null;   // {n,total,events} while scrubbing, else null
const tat=()=>TIME?TIME.n:undefined;

const world=document.getElementById('world');
const cmd=document.getElementById('cmd'), q=document.getElementById('q'), results=document.getElementById('results');
const crumb=document.getElementById('crumb'), crumbName=document.getElementById('crumbName'), crumbHint=document.getElementById('crumbHint');
const ambient=document.getElementById('ambient');

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ---------------- boot / state ----------------
async function boot(){ applyState(await API.state()); rebuild(); }
function applyState(s){
  const fid=(STATE.spaces[focusIdx]||{}).id;
  // cluster spawned/connected notebooks right after their hub (first parent) so the overview groups them
  const byHub={}; s.spaces.forEach(sp=>{ const h=sp['spawned-by']||((sp['merged-from']||[])[0]); if(h) (byHub[h]=byHub[h]||[]).push(sp); });
  const ordered=[], seen=new Set();
  const emit=sp=>{ if(seen.has(sp.id)) return; seen.add(sp.id); ordered.push(sp); (byHub[sp.id]||[]).forEach(emit); };
  s.spaces.forEach(sp=>{ const h=sp['spawned-by']||((sp['merged-from']||[])[0]); if(!h||!s.spaces.some(x=>x.id===h)) emit(sp); });
  s.spaces.forEach(sp=>{ if(!seen.has(sp.id)) emit(sp); });   // paranoia: never drop a panel
  STATE.spaces=ordered;
  STATE.objects={}; s.objects.forEach(o=>STATE.objects[o.id]=o); STATE.events=s.events;
  const ni=STATE.spaces.findIndex(sp=>sp.id===fid); if(ni>=0) focusIdx=ni;
  else focusIdx=Math.min(focusIdx,Math.max(0,STATE.spaces.length-1));   // focused space vanished — stay in range
  renderStrip();
}
function renderStrip(){ ambient.textContent = STATE.spaces.length+' notebooks · '+Object.keys(STATE.objects).length+' objects · '+STATE.events+' events'; }
function rebuild(){
  world.querySelectorAll('.panel').forEach(p=>p.remove()); panels=[];
  STATE.spaces.forEach((sp,i)=>buildPanel(sp,i));
  panels.forEach((p,i)=>renderBody(i));
  layout();
}

// ---------------- undo + toast (reversibility, made visible) ----------------
let toastTimer;
function showToast(msg,undoFn){
  const t=document.getElementById('toast'); clearTimeout(toastTimer);
  t.innerHTML=esc(msg)+(undoFn?' <span class="u">Undo</span>':'');
  t.classList.add('on');
  if(undoFn) t.querySelector('.u').addEventListener('click',()=>{undoFn();t.classList.remove('on');});
  toastTimer=setTimeout(()=>t.classList.remove('on'), undoFn?5000:2500);
}
async function undo(){
  if(TIME){ showToast('time mode — ↩ now to edit'); return; }
  const s=await API.undo();
  const gone = openId && !s.objects.find(o=>o.id===openId);
  applyState(s); if(gone) openId=null;
  rebuild(); if(openId) openObject(openId);
}
document.getElementById('undoBtn').addEventListener('click',()=>{ undo(); if(!TIME) showToast('Reverted last event'); });

// long agent flows run server-side as jobs; we poll instead of holding a fetch
// open for minutes (browsers kill those — the old "refresh to see it" bug).
function pollJob(id,onDone){
  const tick=async()=>{
    let s; try{ s=await API.job(id); }catch(e){ setTimeout(tick,4000); return; }  // network blip — keep waiting
    if(!s.done){ setTimeout(tick,3000); return; }
    onDone(s.result||{error:s.error||'job lost'});
  };
  setTimeout(tick,2000);
}
// a job can finish while the user is typing somewhere — don't yank the DOM out
// from under them; wait until no input is focused (LEAP box excepted).
function safeRebuild(){
  if(TIME){ setTimeout(safeRebuild,4000); return; }   // never yank the user out of the past
  const ae=document.activeElement;
  if(ae&&ae!==q&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){ setTimeout(safeRebuild,4000); return; }
  rebuild(); if(openId) openObject(openId);
}

// One line telling a focused notebook where it sits: its parent, how many
// notebooks share that parent, and what it spawned. The tree-view on
// selection, at the cost of a line rather than a permanent rail.
function structureLine(i){
  const sp=STATE.spaces[i]; if(!sp) return '';
  const pid=sp['spawned-by']||(sp['merged-from']||[])[0];
  const parent=pid?STATE.spaces.find(x=>x.id===pid):null;
  const kids=STATE.spaces.filter(x=>(x['spawned-by']||(x['merged-from']||[])[0])===sp.id);
  const sibs=parent?STATE.spaces.filter(x=>(x['spawned-by']||(x['merged-from']||[])[0])===parent.id&&x.id!==sp.id):[];
  const bits=[];
  if(parent) bits.push('<span class="slink" data-space="'+esc(parent.id)+'">↰ '+esc(parent.title)+'</span>');
  if(sibs.length) bits.push(sibs.length+(sibs.length===1?' sibling':' siblings'));
  if(kids.length) bits.push('<span class="slink" data-kids="1">'+kids.length+
                            (kids.length===1?' deep-dive':' deep-dives')+'</span>');
  return bits.length?'<div class="p-structure">'+bits.join(' · ')+'</div>':'';
}

function buildPanel(sp,i){
  const hubId = sp['spawned-by']||((sp['merged-from']||[])[0]);
  const hub = hubId ? STATE.spaces.find(h=>h.id===hubId) : null;
  const merged = sp['merged-from'];
  const mtitles = merged ? merged.map(id=>((STATE.spaces.find(s=>s.id===id)||{}).title)||id).join(' × ') : '';
  const p=document.createElement('div'); p.className='panel'+(hub?' child':''); p.dataset.i=i;
  // In the overview a child sits UNDER its parent, so naming the parent in the
  // eyebrow is redundant — and it was truncated at card width anyway. Focus
  // mode has no such context, so the full form survives there via .p-structure.
  p.innerHTML='<div class="p-status"><span class="adot"></span>'+(merged?'connected':hub?'spawned':'notebook')+'</div>'+
    '<div class="p-head"><div class="p-eyebrow">'+
      (merged?'connected · '+esc(mtitles):hub?'deep-dive':'notebook · intention')+'</div>'+
    '<h2 class="p-title">'+esc(sp.title)+'</h2><p class="p-intent">'+esc(sp.intent)+'</p>'+
    structureLine(i)+'</div>'+
    '<div class="p-body" id="body'+i+'"></div>';
  p.addEventListener('click',e=>{
    const link=e.target.closest('.slink[data-space]');
    if(link){ e.stopPropagation();
      const j=STATE.spaces.findIndex(x=>x.id===link.dataset.space);
      if(j>=0) enter(j);
      return; }
    if(e.target.closest('.slink[data-kids]')){ e.stopPropagation(); overview(); return; }
    if(mode==='overview'){ e.stopPropagation(); enter(i);}
  });
  world.appendChild(p); panels.push(p);
}

function renderBody(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  if(i===focusIdx && openId){ renderDetail(i); return; }
  if(mode==='focus' && i===focusIdx){ renderNotebook(i); return; }
  // overview card: cheap title list only — the full notebook loads on focus
  let h='<div class="sec-h">in this notebook</div>';
  if(!sp.members.length) h+='<div style="color:var(--muted);font-size:13px;padding:4px 0 8px">Empty — Research or Import to fill it.</div>';
  sp.members.forEach(id=>{ const o=STATE.objects[id]||{id,title:id,kind:'?'};
    h+='<div class="obj" data-open="'+id+'"><div class="ttl">'+esc(o.title)+' <span class="chip">'+id+'</span></div></div>'; });
  b.innerHTML=h;
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openObject(el.dataset.open)));
}

async function cellOp(i,body){
  if(TIME){ showToast('time mode — ↩ now to edit'); return; }
  const sp=STATE.spaces[i], before=STATE.events;
  const res=await API.notebookOp(Object.assign({space:sp.id},body));
  if(res.error){ showToast(res.error); return; }
  applyState(res.state); renderBody(i);
  if(res.state.events>before) showToast('Notebook updated — reversible', undo);
}

function editProse(i,idx,text){
  const b=document.getElementById('body'+i);
  const target = idx===null ? b.querySelector('.addrow') : b.querySelector('[data-cell="'+idx+'"]');
  if(!target) return;
  const ed=document.createElement('div');
  ed.innerHTML='<textarea class="prosed" style="width:100%;min-height:90px;font:13px/1.6 var(--sans);border:1px solid var(--accent-line);border-radius:8px;padding:9px;box-sizing:border-box">'+esc(text||'')+'</textarea>'+
    '<div class="actions" style="margin:6px 0 10px"><button class="btn sm" data-a="save">Save</button><button class="btn ghost sm" data-a="cancel">Cancel</button></div>';
  target.replaceWith(ed);
  ed.querySelector('[data-a="save"]').addEventListener('click',()=>{
    const t=ed.querySelector('.prosed').value;
    cellOp(i, idx===null?{op:'add-text',text:t}:{op:'edit-text',idx,text:t});
  });
  ed.querySelector('[data-a="cancel"]').addEventListener('click',()=>renderBody(i));
  ed.querySelector('.prosed').focus();
}

async function renderNotebook(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  // don't flash "loading…" (and reset scroll) when this notebook is already
  // painted — watchFlow re-renders every 2.5s; the fetch repaints fully below
  if(!b.querySelector('.cellwrap')) b.innerHTML='<div class="sec-h">loading notebook…</div>';
  const nb=await API.notebook(sp.id,tat());
  if(mode!=='focus'||i!==focusIdx||openId) return;   // panel moved on while we fetched
  if(nb.error){ b.innerHTML='<div style="color:var(--attn);font-size:13px">'+esc(nb.error)+'</div>'; return; }
  let cellsH='';
  nb.cells.forEach(c=>{
    const bar='<div class="cellbar">'+(c.i>0?'<button data-act="up" data-i="'+c.i+'">↑</button>':'')+
      (c.i<nb.cells.length-1?'<button data-act="down" data-i="'+c.i+'">↓</button>':'')+
      (c.type==='text'?'<button data-act="edit" data-i="'+c.i+'">✎</button>':'')+
      '<button data-act="rm" data-i="'+c.i+'">✕</button></div>';
    if(c.type==='text'){
      cellsH+='<div class="cellwrap" data-cell="'+c.i+'">'+bar+'<p class="prose">'+esc(c.text)+'</p></div>';
    } else if(c.type==='missing'){
      cellsH+='<div class="cellwrap" data-cell="'+c.i+'">'+bar+'<div style="color:var(--attn);font-size:12px">missing object '+esc(c.ref)+'</div></div>';
    } else {
      let opts=''; (c.alternatives||[]).forEach(([vid,label])=>{ opts+='<option value="'+vid+'"'+(vid===c.view?' selected':'')+'>'+esc(label)+'</option>'; });
      let chips='';
      if(c.from) chips+='↳ derived from <span class="ghostchip" data-open="'+esc(c.from)+'">'+esc(c.from)+'</span>'+(c.via?' via '+esc(c.via):'');
      if(c.from) chips+=' <button class="mkcell" data-rerun="'+esc(c.id)+'" title="↻ re-run lineage — recompute this table from its source (and everything derived from it)">↻</button>';
      if(c['also-in']&&c['also-in'].length) chips+=(chips?' · ':'')+'↳ also in '+
        c['also-in'].map(s=>'<span class="ghostchip" data-space="'+esc(s.id)+'">'+esc(s.title)+'</span>').join(' ');
      const mkable=(c.alternatives||[]).some(a=>a[1]==='Rows');   // table-shaped → ✦ make lives here too
      cellsH+='<div class="cellwrap" data-cell="'+c.i+'">'+bar+
        '<div class="cellmold"><div class="hd"><span class="t" data-open="'+esc(c.id)+'">'+esc(c.title)+'</span>'+
        '<span class="chip">'+esc(c.id)+'</span>'+
        ((c.alternatives||[]).length?'<select data-remold="'+c.i+'">'+opts+'</select>':'')+   // a flow has no molds — no empty control
        (mkable?'<button class="mkcell" data-make="'+esc(c.id)+'" title="✦ make… — ask for a view, a computed table, or a visualization of this data">✦</button>'+
                '<button class="mkcell" data-fnp="'+esc(c.id)+'" title="ƒ apply a function — filter, group, pivot, top-N…">ƒ</button>':'')+'</div>'+
        '<div class="bd">'+renderMold(c)+'</div>'+(chips?'<div class="chips">'+chips+'</div>':'')+'</div></div>';
    }
  });
  const dl='<datalist id="objlist">'+Object.values(STATE.objects).map(o=>'<option value="'+esc(o.id)+'">'+esc(o.title)+'</option>').join('')+'</datalist>';
  const add='<div class="addrow"><button class="btn ghost sm" id="addProse">＋ prose</button>'+
    '<input id="addRef" list="objlist" placeholder="＋ object by id…">'+dl+'</div>';
  const rail = nb.connected.length
    ? '<div class="rail"><div class="sec-h">connected · '+nb.connected.length+'</div>'+
      nb.connected.map(cn=>'<div class="raillink" data-space="'+esc(cn.id)+'"><b>'+esc(cn.title)+'</b><br><span class="why">'+
        cn.reasons.map(r=>r.type==='spawned'?'deep-dive · spawned from here':r.type==='spawned-by'?'spawned this notebook':r.type==='shares'?'shares '+esc(r.obj):r.type==='merged-from'?'connected · made from this notebook':r.type==='merged'?'part of this connection':'lineage · '+esc(r.obj)).join('<br>')+
        '</span></div>').join('')+'</div>'
    : '';
  const actions='<div class="actions" style="margin-bottom:6px">'+
    '<button class="btn sm" id="askBtn">✦ Ask</button>'+
    '<button class="btn ghost sm" id="researchBtn">🔍 Research</button>'+
    '<button class="btn ghost sm" id="ddBtn">⌘ Deep-dive</button>'+
    '<button class="btn ghost sm" id="flowBtn">⚑ Flow</button>'+
    '<button class="btn ghost sm" id="draftBtn">✎ Draft</button>'+
    '<button class="btn ghost sm" id="importBtn">＋ Import CSV</button></div>'+
    (nb['spawned-by']?'<div style="font-size:11px;font-family:var(--mono);color:var(--faint);margin-bottom:8px">spawned from <span class="ghostchip" data-space="'+esc(nb['spawned-by'].space)+'">'+esc(nb['spawned-by'].space)+'</span> · “'+esc(nb['spawned-by'].prompt||'')+'”</div>':'');
  b.innerHTML=actions+'<div class="nbrow"><div style="flex:1;min-width:0">'+cellsH+add+'</div>'+rail+'</div>';
  b.querySelector('#askBtn').addEventListener('click',()=>startAsk(i));
  b.querySelector('#researchBtn').addEventListener('click',()=>startResearch(i));
  b.querySelector('#draftBtn').addEventListener('click',async()=>{
    let res; try{ res=await API.delegate(sp.id); }catch(e){ showToast('draft: network error'); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    if(res.error){ showToast('draft: '+res.error); return; }
    applyState(res.state); openId=res.openId; rebuild(); openObject(res.openId);
    showToast('Draft written by the agent (reversible)', undo);
  });
  b.querySelector('#importBtn').addEventListener('click',()=>startImport(i));
  b.querySelector('#ddBtn').addEventListener('click',async()=>{
    b.innerHTML='<div class="sec-h">deep-diving</div><div style="color:var(--muted);font-size:13px">the agent is proposing subtopics, spawning connected notebooks and researching each — this takes a while. You can keep working; they land when ready…</div>';
    let res; try{ res=await API.deepDive(sp.id); }catch(e){ showToast('deep-dive: network error'); renderBody(i); return; }
    if(res.error){ showToast('deep-dive: '+res.error); renderBody(i); return; }
    pollJob(res.job, r=>{
      if(TIME){ showToast('agent finished — ↩ now to see it'); return; }
      if(r.error){ showToast('deep-dive: '+r.error); if(mode==='focus'&&focusIdx===i&&!openId) renderBody(i); return; }
      applyState(r.state); safeRebuild();
      showToast('Spawned '+r.spawned.length+' connected deep-dive notebook'+(r.spawned.length===1?'':'s'));
    });
  });
  b.querySelector('#flowBtn').addEventListener('click',()=>startFlow(i));
  b.querySelectorAll('[data-remold]').forEach(sel=>sel.addEventListener('change',()=>cellOp(i,{op:'set-view',idx:+sel.dataset.remold,view:sel.value})));
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openObject(el.dataset.open)));
  b.querySelectorAll('[data-make]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();makeOn(el.dataset.make);}));
  b.querySelectorAll('[data-fnp]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    openFnPalette(i, el.dataset.fnp, el.closest('.cellmold'));
  }));
  b.querySelectorAll('[data-rerun]').forEach(el=>el.addEventListener('click',async ev=>{
    ev.stopPropagation();
    if(TIME){ showToast('time mode — ↩ now to edit'); return; }
    let r; try{ r=await API.rerun(el.dataset.rerun); }catch(e){ showToast('rerun: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    applyState(r.state); renderBody(i);
    const skips=(r.skipped||[]).length, n=r.refreshed.length;
    showToast('Recomputed '+n+' table'+(n===1?'':'s')+
      (skips?' · '+skips+' skipped':'')+(n?' — reversible':''), n?undo:null);
    if(skips) console.log('rerun skipped:', r.skipped);
  }));
  b.querySelectorAll('[data-space]').forEach(el=>el.addEventListener('click',()=>{
    const j=STATE.spaces.findIndex(s=>s.id===el.dataset.space); if(j>=0) enter(j);
  }));
  b.querySelectorAll('[data-gate]').forEach(el=>el.addEventListener('click',async ev=>{
    ev.stopPropagation();
    if(TIME){ showToast('time mode — ↩ now to decide'); return; }
    const ok=el.dataset.gate==='yes';
    let r; try{ r=await API.flowGate(el.dataset.flow, ok); }catch(e){ showToast('gate: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    if(ok){ showToast('Approved — the flow continues'); watchFlow(i, r.job); renderBody(i); }
    else  { applyState(r.state); renderBody(i); showToast('Rejected — the flow stopped (reversible)', undo); }
  }));
  b.querySelectorAll('.cellbar button').forEach(btn=>btn.addEventListener('click',ev=>{
    ev.stopPropagation();
    const idx=+btn.dataset.i, act=btn.dataset.act;
    if(act==='rm') cellOp(i,{op:'remove',idx});
    else if(act==='up') cellOp(i,{op:'move',idx,to:idx-1});
    else if(act==='down') cellOp(i,{op:'move',idx,to:idx+1});
    else if(act==='edit') editProse(i,idx,(nb.cells[idx]||{}).text||'');
  }));
  b.querySelector('#addProse').addEventListener('click',()=>editProse(i,null,''));
  const ar=b.querySelector('#addRef');
  ar.addEventListener('change',()=>{ const id=ar.value.trim(); if(!id) return;
    if(STATE.objects[id]) cellOp(i,{op:'add-ref',ref:id});
    else showToast('no object “'+id+'” — pick one from the list'); });
  // agent-written applet cells run scoped to their own cell
  nb.cells.forEach(c=>{
    if(c.type==='ref'&&c.kind==='applet'){
      const w=b.querySelector('[data-cell="'+c.i+'"]'), host=w&&w.querySelector('#appletHost');
      if(host){ try{(new Function('data','el',c.code))(c.rendered,host);}catch(e){host.textContent='applet error: '+e.message;} }
    }
  });
}
function startResearch(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  b.innerHTML='<div class="actions"><input id="rq" placeholder="what should the agent research? e.g. “competitor pricing for X”" '+
    'style="flex:1;min-width:280px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px">'+
    '<button class="btn sm" id="goRes">Research</button><button class="btn ghost sm" id="cancelRes">Cancel</button></div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">the agent searches the web &amp; your data, then saves a findings note into this space</div>';
  const go=async()=>{
    const p=b.querySelector('#rq').value.trim(); if(!p) return;
    b.innerHTML='<div class="sec-h">researching</div><div style="color:var(--muted);font-size:13px">searching the web &amp; your data — this can take a minute…</div>';
    let res; try{ res=await API.research(sp.id, p); }catch(e){ showToast('research: network error'); renderBody(i); return; }
    if(res.error){ showToast('research: '+res.error); renderBody(i); return; }
    pollJob(res.job, r=>{
      if(TIME){ showToast('agent finished — ↩ now to see it'); return; }
      if(r.error){ showToast('research: '+r.error); if(mode==='focus'&&focusIdx===i&&!openId) renderBody(i); return; }
      applyState(r.state);
      // only jump to the findings if the user is still waiting in this notebook
      if(mode==='focus'&&focusIdx===i&&!openId){ openId=r.openId; rebuild(); openObject(r.openId); }
      else safeRebuild();
      showToast('Findings saved to '+sp.title+' — reversible', undo);
    });
  };
  b.querySelector('#goRes').addEventListener('click',go);
  b.querySelector('#rq').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  b.querySelector('#cancelRes').addEventListener('click',()=>renderBody(i));
  b.querySelector('#rq').focus();
}
function startFlow(i){

    '<button class="btn sm" id="goFlow">Plan &amp; run</button><button class="btn ghost sm" id="cancelFlow">Cancel</button></div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">the agent plans a short flow (research → gate → compute → draft), runs it step by step, and STOPS to ask you at gates — every step reversible</div>';
  const go=async()=>{
    const g=b.querySelector('#fq').value.trim(); if(!g) return;
    b.innerHTML='<div class="sec-h">planning</div><div style="color:var(--muted);font-size:13px">the agent is planning the flow…</div>';
    let res; try{ res=await API.flow(sp.id, g); }catch(e){ showToast('flow: network error'); renderBody(i); return; }

    watchFlow(i, res.job);
  };
  b.querySelector('#goFlow').addEventListener('click',go);
  b.querySelector('#fq').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  b.querySelector('#cancelFlow').addEventListener('click',()=>renderBody(i));
  b.querySelector('#fq').focus();
}
// watch a running flow: refresh the notebook every 2.5s so the checklist is
// live, and toast when the job ends (done / needs-you / failed).
function watchFlow(i, job){
  const tick=async()=>{
    let s; try{ s=await API.job(job); }catch(e){ setTimeout(tick,4000); return; }
    const ae=document.activeElement, typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
    // an open inline form (research/flow/import/ask/prose edit/ƒ palette) would be
    // destroyed by a repaint even when unfocused — keep polling, skip the paint
    const b=document.getElementById('body'+i);
    const formOpen=b&&b.querySelector('#fq,#rq,#csv,#aq,#ctitle,.prosed,.fnpal');
    if(!TIME && !typing && !formOpen && mode==='focus' && focusIdx===i && !openId) renderBody(i);
    if(!s.done){ setTimeout(tick,2500); return; }
    const r=s.result||{error:s.error||'job lost'};
    if(r.error){ showToast('flow: '+r.error); return; }
    if(TIME){ showToast('flow '+(r.status==='needs-you'?'needs you':'finished')+' — ↩ now to see it'); return; }
    if(r.state){ applyState(r.state); safeRebuild(); }
    showToast(r.status==='needs-you' ? 'The flow needs you — open the notebook to approve'
             : r.status==='failed' ? 'Flow stopped — a step failed (see the flow cell)'
             : 'Flow complete — everything it made is in the notebook (reversible)');
  };
  setTimeout(tick,1500);
}

// ---------------- object detail (molder) ----------------
async function openObject(id){
  openId=id;
  // make sure the owning space is focused
  const owner=STATE.spaces.findIndex(s=>s.members.includes(id));
  if(owner>=0 && (mode!=='focus' || focusIdx!==owner)){ focusIdx=owner; }
  mode='focus'; closeLeap();
  const m=await API.object(id,tat());
  renderDetail(focusIdx,m); layout();
}
async function remold(id,view){ const m=await API.mold(id,view,tat()); renderDetail(focusIdx,m); }

function renderDetail(i,m){
  const b=document.getElementById('body'+i);
  if(!m){ b.innerHTML='<div class="sec-h">loading…</div>'; return; }
  let opts=''; m.alternatives.forEach(([vid,label])=>{ opts+='<option value="'+vid+'"'+(vid===m.view?' selected':'')+'>'+esc(label)+'</option>'; });
  const describable = m.alternatives.some(a=>a[1]==='Rows');   // a table-shaped object
  const editBtn = m.kind==='text' ? '<button class="btn ghost sm" id="editbtn" style="margin-left:10px">Edit</button>' : '';
  const makeBtn = describable ? '<button class="btn ghost sm" id="makebtn" style="margin-left:8px">✦ make…</button>' : '';
  b.innerHTML='<button class="backlink" id="back">‹ back to the space</button>'+
    '<div class="molder"><div class="molder-h"><span class="t">'+esc(m.title)+'</span>'+
    (m.alternatives.length?'<span class="lab">view this as</span><select id="moldsel">'+opts+'</select>':'')+editBtn+makeBtn+'</div>'+
    '<div class="molder-b" id="moldbody">'+renderMold(m)+'</div></div>';
  b.querySelector('#back').addEventListener('click',()=>{ openId=null; renderBody(i); });
  const selEl=b.querySelector('#moldsel');
  if(selEl) selEl.addEventListener('change',()=>remold(m.id, selEl.value));
  const eb=b.querySelector('#editbtn'); if(eb) eb.addEventListener('click',()=>startEdit(i,m));
  const mk=b.querySelector('#makebtn'); if(mk) mk.addEventListener('click',()=>startDo(i,m));
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openObject(el.dataset.open)));
  b.querySelectorAll('[data-gate]').forEach(el=>el.addEventListener('click',async ev=>{
    ev.stopPropagation();
    if(TIME){ showToast('time mode — ↩ now to decide'); return; }
    const ok=el.dataset.gate==='yes';
    let r; try{ r=await API.flowGate(el.dataset.flow, ok); }catch(e){ showToast('gate: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    if(ok){ showToast('Approved — the flow continues'); watchFlow(i, r.job); openObject(m.id); }
    else  { applyState(r.state); openObject(m.id); showToast('Rejected — the flow stopped (reversible)', undo); }
  }));
  if(m.kind==='applet') runApplet(m);
}
// run an agent-written applet over the object's data. ponytail: new Function in
// the page — fine for a local prototype; the agent code self-stops via el.isConnected.
function runApplet(m){
  const host=document.getElementById('appletHost'); if(!host) return;
  try{ (new Function('data','el', m.code))(m.rendered, host); }
  catch(e){ host.innerHTML='<div style="color:var(--attn);font-size:13px">applet error: '+esc(e.message)+'</div>'; }
}

// ƒ on a cell: the function palette, close to the data. Incompatible functions
// stay visible but greyed WITH the reason — the palette teaches the vocabulary.
async function openFnPalette(i, id, anchor){
  const sp=STATE.spaces[i];
  document.querySelectorAll('.fnpal').forEach(el=>el.remove());   // one palette at a time
  let res; try{ res=await API.fns(id); }catch(e){ showToast('palette: network error'); return; }
  if(res.error){ showToast(res.error); return; }
  if(!anchor.isConnected) return;   // notebook re-rendered mid-fetch — don't land in a detached subtree
  const host=document.createElement('div'); host.className='fnpal';
  host.innerHTML='<div class="sec-h" style="margin-top:0">ƒ apply a function <button class="mkcell" style="float:right" data-x="close">✕</button></div>'+
    '<div class="fnchips">'+res.fns.map((f,k)=>
      '<button class="fnchip'+(f.ok?'':' dis')+'" data-k="'+k+'" title="'+esc(f.ok?(f.doc||''):f.why)+'">'+esc(f.label)+'</button>').join('')+'</div>'+
    '<div class="fnbody"></div>';
  document.querySelectorAll('.fnpal').forEach(el=>el.remove());   // again — a second ƒ click may have raced the fetch
  anchor.insertAdjacentElement('afterend', host);
  host.querySelector('[data-x="close"]').addEventListener('click',()=>host.remove());
  const body=host.querySelector('.fnbody');
  host.querySelectorAll('.fnchip').forEach(ch=>ch.addEventListener('click',()=>{
    const f=res.fns[+ch.dataset.k];
    if(!f.ok){ showToast(f.why); return; }
    host.querySelectorAll('.fnchip').forEach(c=>c.classList.remove('on')); ch.classList.add('on');
    const ctl=p=>{
      if(p.options) return '<label>'+esc(p.name)+' <select data-p="'+esc(p.name)+'">'+
        p.options.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select></label>';
      if(p.type==='num') return '<label>'+esc(p.name)+' <input data-p="'+esc(p.name)+'" type="number" value="10" style="width:64px"></label>';
      return '<label>'+esc(p.name)+' <input data-p="'+esc(p.name)+'" style="width:110px"></label>';
    };
    body.innerHTML='<div class="fnparams">'+(f.params||[]).map(ctl).join('')+
      '<button class="btn ghost sm" data-a="pv">Preview</button>'+
      '<button class="btn sm" data-a="ap">Apply</button></div><div class="fnprev"></div>';
    const collect=()=>{ const ps={}; body.querySelectorAll('[data-p]').forEach(el=>ps[el.dataset.p]=el.value); return ps; };
    const prev=body.querySelector('.fnprev');
    let pvSeq=0;   // in-flight previews can resolve out of order — only the latest may write
    const preview=async()=>{
      prev.innerHTML='<div style="color:var(--muted);font-size:12px">previewing…</div>';
      const tok=++pvSeq;
      let r; try{ r=await API.fnPreview(id,f.id,collect()); }catch(e){ if(tok!==pvSeq) return; prev.innerHTML=''; showToast('preview: network error'); return; }
      if(tok!==pvSeq) return;
      if(r.error){ prev.innerHTML='<div style="color:var(--attn);font-size:12px">'+esc(r.error)+'</div>'; return; }
      prev.innerHTML='<div class="fnba"><div><div class="sec-h">before</div>'+tableHTML(r.before)+'</div>'+
        '<div class="fnarrow">→</div><div><div class="sec-h">after · '+r.count+' rows</div>'+tableHTML(r.after)+'</div></div>'+
        '<div style="font-size:11px;color:var(--faint);margin-top:4px">first 8 rows each — nothing is committed until you Apply</div>';
    };
    body.querySelector('[data-a="pv"]').addEventListener('click',preview);
    body.querySelectorAll('[data-p]').forEach(el=>el.addEventListener('change',preview));
    body.querySelector('[data-a="ap"]').addEventListener('click',async()=>{
      let r; try{ r=await API.fnApply(id,f.id,collect(),sp.id); }catch(e){ showToast('apply: network error'); return; }
      if(TIME){ showToast('finished — ↩ now to see it'); return; }
      if(r.error){ showToast(r.error); return; }
      applyState(r.state); renderBody(i);
      showToast('Applied '+f.label+' — new table in this notebook (reversible)', undo);
    });
  }));
}

function renderMold(m){
  const d=m.rendered;
  switch(m.kind){
    case 'table':  return tableHTML(d);
    case 'list':   return '<ul class="moldlist">'+d.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
    case 'text':   return '<div class="moldtext">'+mdToHtml(d)+'</div>';
    case 'chart':  return chartSVG(d);
    case 'report': return renderReport(d);
    case 'cards':  return renderCards(d);
    case 'kpi':    return renderKPI(d);
    case 'applet': return '<div id="appletHost" style="min-height:340px"></div>';
    case 'flow':   return renderFlow(m.rendered, m.id);
    default:       return '<pre>'+esc(JSON.stringify(d,null,2))+'</pre>';
  }
}
const FLOWICON={pending:'○',running:'◐',done:'●','needs-you':'⚑',failed:'✕',rejected:'⊘'};
function renderFlow(f, fid){
  let h='<div class="flowgoal">'+esc(f.goal)+'</div><div class="flowsteps">';
  (f.steps||[]).forEach((s,k)=>{
    h+='<div class="flowstep s-'+esc(s.status)+'"><span class="fic">'+(FLOWICON[s.status]||'○')+'</span>'+
      '<span class="fverb">'+esc(s.verb)+'</span>'+
      (s.verb==='gate'?'<span class="fnote">'+esc((s.args&&s.args.question)||'')+'</span>'
                      :'<span class="fnote">'+esc(s.note||((s.args&&s.args.prompt)||''))+'</span>')+
      (s.out?' <span class="ghostchip" data-open="'+esc(s.out)+'">'+esc(s.out)+'</span>':'')+
      (s.why?' <span class="fwhy">'+esc(s.why)+'</span>':'')+'</div>';
  });
  h+='</div>';
  if(f.status==='needs-you')
    h+='<div class="actions" style="margin-top:8px"><button class="btn sm" data-gate="yes" data-flow="'+esc(fid)+'">Approve &amp; continue</button>'+
       '<button class="btn ghost sm" data-gate="no" data-flow="'+esc(fid)+'">Reject</button></div>';
  else h+='<div class="fstat">'+esc(f.status)+'</div>';
  return h;
}
function fmtNum(n){ return (+n).toLocaleString(); }
function renderCards(rows){
  if(!rows||!rows.length) return '<i>empty</i>';
  const cap=24, shown=rows.slice(0,cap);
  let h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px">';
  shown.forEach(r=>{ h+='<div style="border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--white)">'+
    Object.entries(r).map(([k,v])=>'<div style="display:flex;gap:8px;font-size:12px;margin:2px 0"><span style="color:var(--muted);font-family:var(--mono);font-size:10px;min-width:62px;flex:none">'+esc(k)+'</span><span>'+esc(String(v))+'</span></div>').join('')+'</div>'; });
  h+='</div>';
  if(rows.length>cap) h+='<div style="font-size:11px;color:var(--muted);margin-top:8px;font-family:var(--mono)">showing '+cap+' of '+rows.length+' cards</div>';
  return h;
}
function renderKPI(k){
  const up=k.delta>=0;
  return '<div style="display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap">'+
    '<div><div style="font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em">'+esc(k.metric)+'</div>'+
    '<div style="font-size:38px;font-weight:600;line-height:1.15">'+fmtNum(k.latest)+'</div>'+
    '<div style="font-size:13px;color:'+(up?'var(--accent)':'var(--attn)')+'">'+(up?'▲':'▼')+' '+fmtNum(Math.abs(k.delta))+' ('+k.pct+'%) vs prior</div></div>'+
    '<div style="font-size:12px;color:var(--muted);line-height:1.7">min '+fmtNum(k.min)+'<br>max '+fmtNum(k.max)+'<br>'+k.periods+' periods</div></div>';
}
function tableHTML(rows){
  if(!rows||!rows.length) return '<i>empty</i>';
  const cols=Object.keys(rows[0]); const cap=60, shown=rows.slice(0,cap);
  // A column is numeric if the values say so — CSS cannot see that, so the
  // markup has to carry it. Figures then align right on a tabular grid, which
  // is the whole reason a column of numbers is readable at a glance. Blanks
  // don't count as evidence either way: real tables have holes.
  const numeric={};
  cols.forEach(c=>{
    const vals=rows.map(r=>r[c]).filter(v=>v!==null&&v!==undefined&&v!=='');
    numeric[c]=vals.length>0&&vals.every(v=>typeof v==='number');
  });
  const cell=(r,c)=>{
    const v=r[c], s=(v===null||v===undefined)?'':String(v);
    return '<td class="'+(numeric[c]?'num':'txt')+'" title="'+esc(s)+'">'+esc(s)+'</td>';
  };
  // fixed layout is what makes truncation possible, but it also splits the
  // width evenly — so a 4-character year gets as much room as a 45-character
  // region name. Size each column by what it actually holds, clamped so one
  // long value cannot starve the rest.
  const width=c=>{
    const seg=Math.max(...c.split('_').map(w=>w.length));           // longest unbroken word
    const longest=shown.reduce((m,r)=>Math.max(m,String(r[c]??'').length),seg);
    return Math.min(Math.max(longest+2,7),28);   // +2 for the cell's padding
  };
  const widths=cols.map(width), total=widths.reduce((a,b)=>a+b,0);
  let h='<div style="max-height:360px;overflow:auto"><table class="mold"><colgroup>'+
    widths.map(w=>'<col style="width:'+(100*w/total).toFixed(2)+'%">').join('')+'</colgroup><thead><tr>'+
    cols.map(c=>'<th class="'+(numeric[c]?'num':'txt')+'" title="'+esc(c)+'">'+
                esc(c).replace(/_/g,'_<wbr>')+'</th>').join('')+'</tr></thead><tbody>'+
    shown.map(r=>'<tr>'+cols.map(c=>cell(r,c)).join('')+'</tr>').join('')+
    '</tbody></table></div>';
  if(rows.length>cap) h+='<div style="font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--mono)">showing '+cap+' of '+rows.length+' rows</div>';
  return h;
}
function renderReport(blocks){
  return blocks.map(b=>{
    switch(b.block){
      case 'heading': return '<h3 style="font-family:\'IBM Plex Serif\',serif;font-weight:400;font-size:18px;margin:18px 0 6px">'+esc(b.text)+'</h3>';
      case 'text':    return mdToHtml(b.text);
      case 'table':   return (b.title?'<div class="sec-h">'+esc(b.title)+'</div>':'')+tableHTML(b.rows);
      case 'chart':   return '<div style="margin:6px 0 14px">'+chartSVG(b.spec)+'</div>';
      default:        return '';
    }
  }).join('');
}
function chartSVG(spec){
  if(!spec||!spec.rows||!spec.rows.length) return '<i>no chart</i>';
  const rows=spec.rows, xf=spec.x, yf=spec.y;
  const W=520,H=200,pad=36;
  const colors=['#2f6f5b','#a9632f','#3f7d5f','#7a5ea7','#9a6a2f','#4a6d8f'];
  if(spec.chart==='bar'){
    const maxy=Math.max(1,...rows.map(r=>+r[yf]));
    const bw=(W-2*pad)/rows.length; let g='';
    rows.forEach((r,i)=>{ const bh=(+r[yf]/maxy)*(H-2*pad); const x=pad+i*bw+bw*0.15; const y=H-pad-bh;
      g+='<rect x="'+x+'" y="'+y+'" width="'+(bw*0.7)+'" height="'+bh+'" rx="2" fill="'+colors[i%colors.length]+'"/>';
      g+='<text x="'+(x+bw*0.35)+'" y="'+(H-pad+13)+'" font-size="9" text-anchor="middle" fill="#6d7872">'+esc(String(r[xf]).slice(0,9))+'</text>'; });
    return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';
  }
  // line (optionally multi-series)
  const xs=[...new Set(rows.map(r=>String(r[xf])))].sort();
  const xi=Object.fromEntries(xs.map((v,i)=>[v,i]));
  const maxy=Math.max(1,...rows.map(r=>+r[yf]));
  const sx=v=>pad+(xi[String(v)]/Math.max(1,xs.length-1))*(W-2*pad);
  const sy=v=>H-pad-(v/maxy)*(H-2*pad);
  let series; if(spec.series){ series={}; rows.forEach(r=>{(series[r[spec.series]]=series[r[spec.series]]||[]).push(r);}); }
  else series={'':rows};
  let g='',ci=0;
  Object.values(series).forEach(rs=>{ rs=rs.slice().sort((a,b)=>String(a[xf])<String(b[xf])?-1:1);
    const c=colors[ci++%colors.length];
    const pts=rs.map(r=>sx(r[xf])+','+sy(+r[yf])).join(' ');
    g+='<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="2"/>';
    rs.forEach(r=>g+='<circle cx="'+sx(r[xf])+'" cy="'+sy(+r[yf])+'" r="2.5" fill="'+c+'"/>'); });
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';
}

// ---------------- the shape the substrate already knows ----------------
// A notebook spawned by a deep-dive belongs UNDER it, recursively — the
// substrate computes spawned-by/merged-from and the overview should show that
// rather than laying 24 notebooks out as peers. Returns root nodes:
//   {i, sp, kids:[…same…]}
function clusterTree(){
  const byId={}, roots=[];
  STATE.spaces.forEach((sp,i)=>{ byId[sp.id]={i,sp,kids:[]}; });
  STATE.spaces.forEach(sp=>{
    // /api/state flattens spawned-by to a bare id; merged-from is a vector
    const parent = sp['spawned-by'] || (sp['merged-from']||[])[0];
    const node = byId[sp.id];
    if(parent && byId[parent] && parent!==sp.id) byId[parent].kids.push(node);
    else roots.push(node);
  });
  // a cycle would orphan its members from every root; surface them rather
  // than letting them vanish from the overview entirely
  const seen=new Set();
  (function walk(ns){ ns.forEach(n=>{ seen.add(n.i); walk(n.kids); }); })(roots);
  STATE.spaces.forEach((sp,i)=>{ if(!seen.has(i)) roots.push(byId[sp.id]); });
  return roots;
}

// ---------------- layout (focus / overview zoom) ----------------
function layout(){
  const vw=innerWidth, vh=innerHeight, top=124;
  // before anything is placed: the strip is a row of the page, not something
  // floating over it. Rendered first so the cards can be pushed below it —
  // at a fixed 150px it landed across the top of the middle column's card.
  renderTagStrip();
  const fw=Math.min(940,vw-48), fh=vh-top-28, fx=(vw-fw)/2;
  panels.forEach(p=>{p.style.width=fw+'px';p.style.height=fh+'px';});
  if(mode==='focus'){
    world.classList.remove('overview'); world.classList.remove('cards');
    // focus is one panel: nothing to scroll, nothing below the fold
    world.scrollTop=0;
    const endEl=document.getElementById('canvasEnd'); if(endEl) endEl.style.top='0px';
    document.getElementById('edges').style.height='';
    panels.forEach((p,k)=>{
      if(k===focusIdx){p.style.transform='translate('+fx+'px,'+top+'px) scale(1)';p.style.opacity='1';p.style.zIndex=3;p.style.pointerEvents='auto';}
      else{const off=k<focusIdx?-fw*1.12:fw*1.12;p.style.transform='translate('+(fx+off)+'px,'+top+'px) scale(.86)';p.style.opacity='0';p.style.zIndex=1;p.style.pointerEvents='none';}
    });
  } else {
    world.classList.add('overview'); world.classList.add('cards');
    const PW=380, KW=302, KGAP=8, GROUPGAP=26, COLGAP=34, INDENT=26;
    const strip=document.getElementById('tagstrip');
    const padX=vw*0.045, padTop=top+16+(strip?strip.offsetHeight+12:0);
    const colW=(vw-2*padX-COLGAP*2)/3;
    const s=Math.min(colW/PW,1);
    const roots=clusterTree();
    // a card's head is title + two-line intent, and a title that wraps needs a
    // taller card. Measure the tallest head rather than guess a number: too
    // short and an intent is sliced mid-sentence — and that one line saying
    // what the notebook is FOR is the whole reason the overview is readable.
    let PH=150;
    roots.forEach(r=>{ const p=panels[r.i];
      p.style.width=PW+'px'; p.classList.remove('kid');
      PH=Math.max(PH, p.querySelector('.p-head').scrollHeight+3); });
    // a nested card is head-only too — so measure ITS head instead of padding
    // every one out to a fixed 96px. A one-line title left 29px of empty card
    // below it, which reads as a mistake rather than as breathing room; the
    // card that needs two lines still gets them.
    const kidH=n=>{ const p=panels[n.i];
      p.style.width=KW+'px'; p.classList.add('kid');
      return Math.max(66, p.querySelector('.p-head').scrollHeight+3); };
    // pack each cluster into whichever column is currently shortest — measured
    // as it is placed, so no height needs predicting
    const colY=[padTop,padTop,padTop], spines=[];
    const place=(n,x,y,w,h)=>{
      const p=panels[n.i];
      p.style.width=w+'px'; p.style.height=h+'px';
      p.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';
      p.style.opacity='1'; p.style.zIndex=2; p.style.pointerEvents='auto';
      p.classList.toggle('kid', w!==PW);
      return y+h*s;
    };
    roots.forEach(r=>{
      const c=colY.indexOf(Math.min(...colY));
      const x=padX+c*(colW+COLGAP);
      const top0=colY[c];
      let y=place(r,x,top0,PW,PH)+KGAP;
      // every notebook that spawned something carries its own rail, so a
      // grandchild hangs off the deep-dive that spawned it and not off the
      // root — otherwise three levels read as one flat list of siblings
      (function walk(n,depth,railX,railTop){
        let lastTick=null;
        n.kids.forEach(k=>{
          const kx=x+INDENT*depth+10, y0=y, kh=kidH(k);
          y=place(k,kx,y,KW,kh)+KGAP;
          lastTick=y0+kh*s/2;
          spines.push(['tick',railX,lastTick,kx]);   // the elbow into each child
          walk(k,depth+1,kx+9,y0+kh*s);
        });
        if(lastTick!==null) spines.push(['spine',railX,railTop,lastTick]);
      })(r,1,x+9,top0+PH*s);
      colY[c]=y+GROUPGAP;
    });
    // .world is fixed at viewport size; scrolling comes from content extending
    // past it. Absolutely-positioned panels do create scrollable overflow, but a
    // spacer makes the bottom margin explicit — and the edges SVG must grow too,
    // or every spine below the fold is clipped.
    const contentH=Math.max(vh,Math.max(...colY)+40);
    let end=document.getElementById('canvasEnd');
    if(!end){ end=document.createElement('div'); end.id='canvasEnd'; world.appendChild(end); }
    end.style.cssText='position:absolute;left:0;width:1px;height:1px;top:'+contentH+'px';
    const edges=document.getElementById('edges');
    edges.style.height=contentH+'px';
    edges.innerHTML=spines.map(sp=>
      sp[0]==='spine'
        ? '<line class="spine" x1="'+sp[1]+'" y1="'+sp[2]+'" x2="'+sp[1]+'" y2="'+sp[3]+'"/>'
        : '<line class="spine" x1="'+sp[1]+'" y1="'+sp[2]+'" x2="'+sp[3]+'" y2="'+sp[2]+'"/>'
    ).join('');
  }
  crumbHint.style.display=mode==='overview'?'none':'inline';
  crumbName.textContent=mode==='overview'?'all notebooks':(STATE.spaces[focusIdx]||{}).title||'—';
  applyOverviewFilter();   // survives resize and re-render
}
function enter(i){ mode='focus'; focusIdx=i; openId=null; closeLeap();
                   overviewFilter=null; tagState={};   // both belong to the overview
                   renderBody(i); layout(); }
function overview(){ mode='overview'; openId=null; closeLeap(); layout(); }
crumb.addEventListener('click',()=>mode==='focus'?overview():enter(focusIdx));
addEventListener('resize',layout);

// ---------------- time scrubber (the record, never the recall) ----------------
const timebar=document.getElementById('timebar'), timeRange=document.getElementById('timeRange'),
      timeLabel=document.getElementById('timeLabel');
let timeDeb;
async function enterTime(){
  let ev; try{ ev=await API.events(); }catch(e){ showToast('time: network error'); return; }
  TIME={n:ev.total,total:ev.total,events:ev.events};

function timeCaption(){

async function scrubTo(n){

async function exitTime(){
