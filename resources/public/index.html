    const ents=factEntities(f);
    // TRUTHY, not `===true`, because `weight` on the server is `(if (:durable? f)
    // …)` and reads the value the same way: a hand-edited `"false"` ranks as
    // timeless there, and a pane that called it decaying would disagree with the
    // ranker about the one thing this row exists to say — and would offer the
    // wrong repair, since the button below sends the opposite of what is drawn.
    // and absent is not a third state to draw: nothing has judged an unjudged
    // fact, and an unjudged fact decays — exactly what a `durable? false` one
    // does. The distinction between them changes only whether loci.classify will
    // judge it later, which is not something this row can act on.
    const durable=!!f['durable?'];
    // "you" or "agent", or nothing at all on a fact judged before the field
    // existed — which is why the hover below is conditional
    const by=f['durable-by'];
    h+='<div class="memfact"><div style="font-size:13px">'+esc(f.fact)+'</div>'+
      (ents.length?'<div class="ents">'+ents.map(e=>
        '<span class="ghostchip" data-entity="'+esc(e)+'">'+esc(e)+'</span>').join(' ')+'</div>':'')+
      '<div class="src"><span class="dots">'+'●'.repeat(Math.min(5,f.strength||1))+'</span>'+
      (absorbed.length?' <span class="mergedtoggle" data-merged="'+i+'">+'+absorbed.length+' merged</span>':'')+' · '+
      (f.source&&f.source.obj?'<span class="ghostchip" data-open="'+esc(f.source.obj)+'">⌾ '+esc(f.source.obj)+'</span>'
                             :'⌾ '+esc((f.source&&f.source.space)||'workspace'))+
      ' · '+(age<1?'today':age+'d ago')+
      // beside the age and before everything else, because the age is the number
      // it corrects. Whose judgement it is rides on the hover: an agent's may be
      // revised by the next distill of the same sentence and yours may not, so
      // "who said this" is the difference between a call that will hold and one
      // that might not.
      (durable?' · <span class="timeless"'+
               (by?' title="judged by '+(by==='you'?'you':'the agent')+'"':'')+
               '>does not age</span>':'')+
      (f.score!==undefined?' · relevance '+(+f.score).toFixed(2):'')+
      (via?' · '+via:'')+'</div>'+
      // …and undoable per entry, which is what makes reading it worth doing: a
      // merge you can see but not undo is a report, not a control. The survivor
      // and the absorbed id both travel on the button, because the endpoint
      // needs the pair and refuses anything else.
      (absorbed.length?'<div class="mergedlist" id="merged-'+i+'" hidden>'+
        absorbed.map(a=>'<div>'+esc(a.fact)+' <span class="mid">'+esc(a.id)+'</span> '+
          '<button type="button" class="unmerge" data-survivor="'+esc(f.id)+'" data-absorbed="'+esc(a.id)+'">unmerge</button></div>').join('')+'</div>':'')+
      // the act, under the run rather than in it. It says what clicking WILL do,
      // not what the fact currently is — the marker above already says that, and
      // a control repeating it would leave the reader guessing which of the two
      // is the verb. Last, so revealing the merged list does not push it away
      // from the `.mergedtoggle` in .src that opened it — with the list hidden,
      // which is every fact's resting state, it sits directly under the run.
      '<div class="factact"><button type="button" class="agetoggle" data-fact="'+esc(f.id)+
        '" data-durable="'+(durable?'0':'1')+'">'+
        (durable?'let it age':'stop ageing')+'</button>'+
        // No confirm dialog. Forget means forget, and a modal asking twice would
        // imply the second click is the real one. The footer states the terms
        // once, for the whole pane; the toast afterwards names what went, which
        // is the only recovery there is — you can read it and type it back in.
        '<button type="button" class="forget" data-forget="'+esc(f.id)+'"'+
          (absorbed.length?' title="also forgets the '+absorbed.length+
                           ' fact'+(absorbed.length===1?'':'s')+' merged into this one"':'')+
        '>forget</button></div>'+
      '</div>';
  });
  h+='</div><div class="modal-f"><button class="btn ghost sm" id="closeModal">Close</button>'+
    // Was "revisable, never undone", which stopped being true when forget
    // landed. The sentence now says which half is which, once, here — rather
    // than on every row.
    '<span style="font-size:11.5px;color:var(--muted)">the agent’s recall — revisable; forget is permanent</span></div></div>';
  modal.innerHTML=h; modal.classList.add('on');
  modal.querySelector('#closeModal').addEventListener('click',closeModal);
  const mq=modal.querySelector('#memq');
  mq.focus();
  mq.addEventListener('keydown',e=>{ if(e.key==='Enter') openMemory(mq.value.trim()); });
  modal.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{ closeModal(); openObject(el.dataset.open); }));
  // A subject, not an object — `data-entity` and never `data-open`, because
  // openEntity's own modal runs a [data-open] delegation of its own and a chip
  // carrying both would be fetched as /api/object/tsmc, an id nothing has.
  //
  // closeModal() here rather than inside openEntity: a payload carrying `object`
  // short-circuits to openObject and never touches the modal, so without this the
  // pane would sit on top of the object the chip just sent the reader to.
  modal.querySelectorAll('[data-entity]').forEach(el=>el.addEventListener('click',()=>{
    closeModal(); openEntity(el.dataset.entity); }));
  modal.querySelectorAll('[data-merged]').forEach(el=>el.addEventListener('click',()=>{
    const list=modal.querySelector('#merged-'+el.dataset.merged);
    if(list) list.hidden=!list.hidden;
  }));
  // The response is the two records and nothing else — no facts, no q, no scope
  // — so it cannot be rendered as a pane and must not be patched into one. The
  // pane refetches with the query it was already showing, and `awaiting` goes UP
  // by one there, because the restored fact has no vector until the next sweep.
  modal.querySelectorAll('.unmerge').forEach(el=>el.addEventListener('click',async ()=>{
    el.disabled=true;                       // one merge cannot be undone twice
    let res;
    try{ res=await API.memoryUnmerge(el.dataset.survivor, el.dataset.absorbed); }
    catch(e){ el.disabled=false; showToast('unmerge: network error'); return; }
    // a refusal is 200 with {error}: the pane keeps what it is showing and says
    // the server's own sentence, rather than re-rendering as if it had worked
    if(res.error){ el.disabled=false; showToast('unmerge: '+res.error); return; }
    await openMemory(qstr||'');
    showToast(((res.restored&&res.restored.id)||el.dataset.absorbed)+
              ' is a fact again — awaiting an embedding');
  }));
  // The same shape as the handler above it, for the same reason: the answer is
  // the ONE updated record — no facts, no q, no scope — so it cannot be rendered
  // as a pane and must not be patched into one. The pane refetches with the query
  // it was already showing, which under a query is also how the row picks up the
  // ranking the judgement just changed.
  modal.querySelectorAll('.agetoggle').forEach(el=>el.addEventListener('click',async ()=>{
    el.disabled=true;                       // one judgement, not a double-click's two
    // read off the button rather than recomputed from the row: `want` is what
    // THIS control was drawn to ask for, so a stale render sends a stale value
    // and gets the server's refusal, instead of sending whatever the DOM now
    // happens to look like
    const want=el.dataset.durable==='1', fid=el.dataset.fact;
    let res;
    try{ res=await API.memoryDurable(fid, want); }
    catch(e){ el.disabled=false; showToast('could not reach the server — nothing was judged'); return; }
    // a refusal is 200 with {error}: the pane keeps what it is showing and says
    // the server's own sentence, rather than re-rendering as if it had worked
    if(res.error){ el.disabled=false; showToast(res.error); return; }
    await openMemory(qstr||'');
    showToast((res.id||fid)+(want?' no longer ages — a year from now it ranks as it does today'
                                 :' ages again — recall halves it about every 30 days'));
  }));
  // The one control here with no inverse. Same shape as the two above — the
  // answer is not a pane payload, so the pane refetches with the query it was
  // showing — but the toast carries the TEXT rather than the id, because after
  // this call that text exists nowhere else a reader can reach. Typing it back
  // in is the whole of the recovery, and it cannot be typed back from an id.
  modal.querySelectorAll('.forget').forEach(el=>el.addEventListener('click',async ()=>{
    el.disabled=true;                       // one fact cannot be forgotten twice
    const fid=el.dataset.forget;
    let res;
    try{ res=await API.memoryForget(fid); }
    catch(e){ el.disabled=false; showToast('could not reach the server — nothing was forgotten'); return; }
    if(res.error){ el.disabled=false; showToast(res.error); return; }
    await openMemory(qstr||'');
    const also=(res.also||[]).length;
    showToast('forgotten: “'+(res.fact||fid)+'”'+
              (also?' — and the '+also+' fact'+(also===1?'':'s')+' merged into it':''));
  }));
}
// ---------------- flows: where they are, and which one is waiting ----------------
//
// A flow used to exist only as a cell inside the notebook it was started in, so
// one waiting at a gate in a notebook you are not standing in was invisible
// until you wandered into it. This is the home for that, alongside memory,
// functions and time — and the badge on the button is the notification, because
// a toast is gone by the time you come back to the desk.
async function openFlows(){
  const res=await API.flows();
  const flows=res.flows||[];
  const waiting=flows.filter(f=>f.status==='needs-you').length;
  let h='<div class="modalcard" style="max-width:720px"><div class="modal-h">'+
    '<span class="modalbadge">FLOWS</span>'+
    '<span class="q">'+flows.length+' flow'+(flows.length===1?'':'s')+
      (waiting?' · <b>'+waiting+' waiting on you</b>':'')+'</span></div><div class="modal-b">';
  if(!flows.length) h+='<div style="color:var(--muted);font-size:13px">No flows yet — ⑂ Flow on a notebook plans one and runs it step by step.</div>';
  flows.forEach(f=>{
    const el=fmtElapsed(f.started,f.ended);
    const needs=f.status==='needs-you';
    const meta=[String(f.status).toUpperCase(), f.done+' OF '+f.steps+' DONE']
      .concat(f.step&&!needs?['AT '+String(f.step).toUpperCase()]:[])
      .concat(el?[el]:[]);
    h+='<div class="flowrow'+(needs?' needs':'')+'" data-flow-open="'+esc(f.id)+'" data-space="'+esc(f.space||'')+'">'+
      '<div class="frgoal">'+esc(f.goal||f.title||f.id)+'</div>'+
      '<div class="frmeta">'+(needs?'<span class="fp-attn">'+esc(meta[0])+'</span>':esc(meta[0]))+
        (meta.length>1?' · '+meta.slice(1).map(esc).join(' · '):'')+'</div>'+
      (needs&&f.question?'<div class="frq">⚑ '+esc(f.question)+'</div>':'')+'</div>';
  });
  h+='</div><div class="modal-f"><button class="btn ghost sm" id="closeModal">Close</button>'+
    '<span style="font-size:11.5px;color:var(--muted)">the agent plans, runs, and stops to ask</span></div></div>';
  modal.innerHTML=h; modal.classList.add('on');
  modal.querySelector('#closeModal').addEventListener('click',closeModal);
  // opening a row takes you to the notebook the flow lives in — the gate's
  // buttons are on the flow cell there, which is also where its outputs landed
  modal.querySelectorAll('[data-flow-open]').forEach(el=>el.addEventListener('click',()=>{
    const sp=el.dataset.space;
    closeModal();
    const j=STATE.spaces.findIndex(s=>s.id===sp);
    if(j>=0) enter(j); else openObject(el.dataset.flowOpen);
  }));
}
// The badge rides on state, which every write refreshes, so a flow that reaches
// a gate while you are elsewhere shows up without polling.
function renderFlowBadge(){
  const n=(STATE&&STATE['flows-need-you'])||0;
  const b=document.getElementById('flowBadge');
  if(!b) return;
  b.hidden=!n; b.textContent=n;
  document.getElementById('flowBtn').classList.toggle('needs', !!n);
}
// ---------------- storage: what the lake costs, and what it will go on costing ----------------
//
// Table rows do not live in the substrate log — the log holds a HANDLE, and the
// rows live in a DuckLake catalog. Writes never overwrite: every save mints a
// new lake table, so a table refreshed ten times leaves ten behind. This is
// where you see that and act on it.
//
// THREE figures and never one. The number a reader reaches for is "how much
// would this free", and on its own it is close to meaningless: measured on the
// real store, reclaiming EVERY object's history moves the lake directory by
// 1.8%, because `catalog.duckdb` is 98% of it and never shrinks. A panel showing
// only the reclaimable bytes would make a correct reclaim look like it did
// nothing, and the reader would go looking for a bug that is not there.
//
// `/api/storage` IS the dry run. There is no preview endpoint because the report
// names exactly the versions a reclaim will delete and the bytes it will free,
// and `lakegc/reclaim!` asserts the same numbers back.
function fmtBytes(n){
  n=+n||0;
  if(n<1024) return n+' B';
  const u=['KB','MB','GB','TB']; let v=n/1024, i=0;
  while(v>=1024&&i<u.length-1){ v/=1024; i++; }
  return (v<10?v.toFixed(1):Math.round(v))+' '+u[i];
}
async function openStorage(){
  const p=await API.storage();
  const tables=p.tables||[], lake=p.lake||{}, win=p.window||{};
  const files=+lake.files||0, catalog=+lake.catalog||0;
  const recl=tables.reduce((a,t)=>a+(+t.reclaimable||0),0);
  const orph=p.orphaned||{};
  let h='<div class="modalcard storage-panel" style="max-width:720px"><div class="modal-h">'+
    '<span class="modalbadge">STORAGE</span>'+
    '<span class="q">'+tables.length+' object'+(tables.length===1?'':'s')+' with rows in the lake</span>'+
    '</div><div class="modal-b">'+
    '<div class="stfigs">'+
      '<div class="stfig storage-total"><b class="stnum">'+fmtBytes(files+catalog)+'</b>'+
        '<span class="stlab">the lake on disk — Parquet and catalog together</span></div>'+
      '<div class="stfig storage-reclaimable"><b class="stnum">'+fmtBytes(recl)+'</b>'+
        '<span class="stlab">older versions, reclaimable below</span></div>'+
      // the point of this panel. It is the bulk of the total, and it is the part
      // that does not move — say so here, not in a footnote nobody reads.
      '<div class="stfig storage-catalog"><b class="stnum">'+fmtBytes(catalog)+'</b>'+
        '<span class="stlab">catalog — never reclaimed, and it never shrinks</span></div>'+
    '</div>'+
    '<div class="stnote">catalog.duckdb holds every table’s metadata, and DuckLake keeps small '+
      'tables inside it rather than as Parquet. Nothing here shrinks it — a reclaim can only '+
      'ever move the middle figure.</div>';
  // Shown only when there are any: a line reading "0 orphaned tables" every day
  // is noise, and on the real store that is what it would read. Named rather
  // than actionable — `POST /api/storage/reclaim` refuses a request with no
  // `:id` on purpose, because a bodyless POST is also how you would sweep every
  // orphan by accident. Without this line the bytes are simply missing from the
  // reader's arithmetic: they are inside the total, in no row, and unexplained.
  if(+orph.tables>0)
    h+='<div class="storphan"><b>'+orph.tables+' orphaned table'+(+orph.tables===1?'':'s')+
       ' · '+fmtBytes(orph.bytes)+'</b> — lake rows no handle in the log names any more, which is '+
       'what undoing a table write leaves behind. Not reclaimable from this panel: they belong to '+
       'no object, so there is nothing here to name. From a REPL attached to this server, '+
       '<code>(loci.lakegc/reclaim! store lake nil window)</code>.</div>';
  if(!tables.length) h+='<div style="color:var(--muted);font-size:13px">No object stores rows in the lake yet.</div>';
  tables.forEach(t=>{
    const vs=+t.versions||0, kept=+t['in-window']||0, rv=+t['reclaimable-versions']||0, rb=+t.reclaimable||0;
    // `inlined?` keeps its question mark over the wire — clojure.data.json drops
    // key NAMESPACES, not punctuation — so it is read with a bracket, like
    // `merged-from` and `durable?` in the memory pane.
    //
    // An inlined table's rows are not missing and its size is not zero: DuckLake
    // keeps a table under ~10–20 rows inside catalog.duckdb, so it owns no
    // Parquet. Drawing that as "0 B" is true and reads as a table that failed to
    // write. The phrase points at the figure above that does hold it.
    const cur=t['inlined?']
      ? '<span class="stinlined" title="DuckLake keeps a table this small inside catalog.duckdb rather than as Parquet — its bytes are in the catalog figure above, and dropping it would free none of them">in the catalog</span>'
      : fmtBytes(t.current);
    h+='<div class="strow"><div class="stmain">'+
      '<span class="stid">'+esc(t.id)+'</span>'+(t.title?'<span class="sttitle">'+esc(t.title)+'</span>':'')+
      '<div class="stmeta">'+cur+' · '+vs+' version'+(vs===1?'':'s')+
        (rv?', '+kept+' kept · '+rv+' older, '+fmtBytes(rb):'')+'</div></div>'+
      // The control exists only where there is something for it to do. A live
      // button on a row with nothing older would fire an irreversible-sounding
      // confirm for a no-op, which is exactly how a reader learns to click
      // through the dialog that matters.
      (rv?'<button type="button" class="st-reclaim" data-reclaim="'+esc(t.id)+
          '" data-versions="'+rv+'" data-bytes="'+rb+'">reclaim '+rv+' older</button>'
         :'<span class="stnone">nothing older</span>')+
      '</div>';
  });
  // ---- the other directory on disk, and the only other thing here that deletes
  //
  // The button exists ONLY where there is something for it to delete, and the
  // zero state is a greyed phrase rather than a disabled button — the lake rows
  // above answer "nothing older" the same way, because a disabled control
  // invites a click that can never work. The phrase says WHY rather than "0 B":
  // every file in there is either one a person put by hand, which loci never
  // deletes, or one a live object still names.
  //
  // The total is `File.length` summed, so a symlinked file counts its TARGET's
  // length — bytes a reclaim could never free. Left alone rather than engineered
  // around: a hand-placed symlink has no manifest entry, so it is `:foreign` and
  // never reclaimable, and the figure the button acts on is the other one.
  //
  // `reclaimable-count`, an integer, and NOT the rows. The rows carry
  // file/uri/bytes/name/connectedAs/class/object/ts/at each, and `.length` was
  // the only thing ever read off them — 2 MB of JSON on every panel open to
  // draw one number, which is the shape the payload's own docstring rejects for
  // the `:files` key one line above. The count is over BOTH classes a reclaim
  // deletes, `:reclaimable` and `:orphaned`; `reclaimable-bytes` keeps its name
  // because it is the right word for the BYTES, over that same widened set.
  const fd=p.files||{}, fCount=+fd.count||0, fTotal=+fd['total-bytes']||0,
        fRecl=+fd['reclaimable-bytes']||0, fN=+fd['reclaimable-count']||0,
        fCls=fd.classes||{};
  // The zero state names the REASON, from the classifier's own counts. The one
  // sentence this used to have — "nothing loci wrote is unreferenced" — is
  // false in the case this whole section exists for: an uploaded file nobody
  // connected IS loci-written and IS unreferenced, and is held back only by the
  // window the orphan grace gives it, so the person who just uploaded 200 MiB
  // was told the opposite of why it cannot go. It was also vacuously true over
  // a directory of rsync'd files, which loci wrote none of.
  const fWhy = !fCount ? 'nothing in it yet'
    : fCls['in-window'] ? 'nothing old enough yet — a file loci wrote is kept while the window still reaches it'
    : fCls.current      ? 'every file loci wrote is still in use'
    : 'nothing in here was written by loci';
  h+='<div class="stfiles"><div class="stfh">loci’s files directory</div><div class="strow">'+
    '<div class="stmain"><div class="stmeta">'+fCount+' file'+(fCount===1?'':'s')+' · '+fmtBytes(fTotal)+
      ' — what an upload or a pasted CSV lands in</div>'+
      (fN?'<div class="stmeta">'+fN+' of them, '+fmtBytes(fRecl)+', loci wrote and '+
          'nothing names any more</div>':'')+
    '</div>'+
    // Gated on the COUNT and not on the bytes, as the lake rows above are
    // (`rv`, a count of versions). Nothing refuses an empty upload, so a
    // zero-length reclaimable file makes the bytes 0 while there is plainly
    // something to delete — and the section would say "nothing loci wrote is
    // unreferenced" over files that are, with no way to remove them.
    (fN?'<button type="button" class="st-reclaim" id="stReclaimFiles" data-bytes="'+fRecl+
        '" data-files="'+fN+'">reclaim '+fN+' file'+(fN===1?'':'s')+'</button>'
       :'<span class="stnone">'+fWhy+'</span>')+
    '</div></div>';
  h+='</div><div class="modal-f"><button class="btn ghost sm" id="closeModal">Close</button>'+
    '<span style="font-size:11.5px;color:var(--muted)">keeps the last '+(win.versions||0)+
    ' versions or '+(win.days||0)+' days, whichever keeps more — reclaiming is permanent</span></div></div>';
  modal.innerHTML=h; modal.classList.add('on');
  modal.querySelector('#closeModal').addEventListener('click',closeModal);
  // `[data-reclaim]` and not every `.st-reclaim`: the files button below wears
  // the same class because it is the same control, and it names no object — this
  // handler would hand `undefined` to a route whose whole guard is a missing id.
  modal.querySelectorAll('.st-reclaim[data-reclaim]').forEach(el=>el.addEventListener('click',async ()=>{
    const id=el.dataset.reclaim, n=+el.dataset.versions, b=+el.dataset.bytes;
    // The sentence before the act, and the only one there is. The memory pane's
    // `forget` deliberately has no dialog, because its toast carries the text
    // back and typing it in again IS the recovery. Nothing carries a deleted
    // Parquet file back — undo reverts an event, not a file — so this one asks.
    if(!confirm('Reclaim '+n+' older version'+(n===1?'':'s')+' of '+id+'?\n\n'+
                'This deletes '+fmtBytes(b)+' of Parquet from the lake, permanently. '+
                'It cannot be undone: undo reverts an event, not a file, and reading this '+
                'table at a moment before the kept window will stop working.\n\n'+
                'The current rows are not touched.')) return;
    el.disabled=true;                        // one reclaim, not a double-click's two
    let res;
    try{ res=await API.storageReclaim(id); }
    catch(e){ el.disabled=false; showToast('could not reach the server — nothing was reclaimed'); return; }
    // a refusal is a 200 with {error, why} — the server's own sentence, and the
    // panel keeps what it is showing rather than re-rendering as if it worked
    if(res.error){ el.disabled=false; showToast(res.why||('reclaim: '+res.error)); return; }
    await openStorage();
    showToast('reclaimed '+res.versions+' version'+(res.versions===1?'':'s')+' of '+id+
              ' — '+fmtBytes(res.freed)+' freed, '+res.files+' file'+(res.files===1?'':'s')+' deleted');
  }));
  // The files half. One button for the whole directory, because a files reclaim
  // names no object — the route takes no id and there is nothing here to pick.
  const fbtn=modal.querySelector('#stReclaimFiles');
  if(fbtn) fbtn.addEventListener('click',async ()=>{
    const n=+fbtn.dataset.files, b=+fbtn.dataset.bytes;
    if(!confirm('Delete '+n+' file'+(n===1?'':'s')+' from loci’s files directory?\n\n'+
                'This frees '+fmtBytes(b)+' permanently. It cannot be undone: undo reverts an '+
                'event, not a file, so scrubbing back to a moment when one of these was a live '+
                'source will find it gone.\n\n'+
                'Files you put in that directory yourself are never touched, and neither is any '+
                'file a table still reads.')) return;
    fbtn.disabled=true;                      // one sweep, not a double-click's two
    let res;
    try{ res=await API.reclaimFiles(); }
    catch(e){
      // Two different failures, and only one of them deleted nothing. A request
      // that never got an answer deleted nothing. A request the SERVER failed
      // may have deleted every file before the one it threw on — `reclaim!`
      // deletes in a loop and a manifest write that throws aborts it — so the
      // panel is redrawn from what is actually on disk rather than told it is
      // unchanged. Everything else in this control refuses to overstate a
      // success; this is the path that used to understate a deletion.
      if(e&&e.reached){ await openStorage(); showToast('the sweep stopped partway — the panel is redrawn from what is actually there'); }
      else { fbtn.disabled=false; showToast('could not reach the server — nothing was deleted'); }
      return;
    }
    const rows=res.reclaimed||[], bad=rows.filter(r=>r.error);
    await openStorage();
    // `res.freed`, NEVER a sum over `rows`. Every candidate gets a row and a
    // failed delete is shape-identical to a done one apart from `:error` — the
    // bytes are on both, because the row describes the file and not the outcome
    // — so the obvious arithmetic here reports files that are still on disk as
    // freed. The server sums the rows with no error.
    //
    // And a failure is SAID rather than subtracted. A sweep that deleted nothing
    // because the directory is not writable would otherwise read as a quiet
    // success with a small number in it, which is the one outcome this control
    // must not produce.
    showToast(bad.length
      ? bad.length+' of '+rows.length+' could not be deleted — '+bad[0].error+
        (rows.length>bad.length?' ('+fmtBytes(res.freed)+' freed)':'')
      : 'reclaimed '+rows.length+' file'+(rows.length===1?'':'s')+' — '+fmtBytes(res.freed)+' freed');
  });
}
document.getElementById('flowBtn').addEventListener('click',openFlows);
document.getElementById('memBtn').addEventListener('click',()=>openMemory(''));
document.getElementById('storageBtn').addEventListener('click',openStorage);
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });

// ---------------- a subject, and the place it has ----------------
//
// The entity page. Drawn from `/api/entity?name=` into the modal before the
// subject is a citizen of the substrate, and from `renderMold` once it is one —
// which is TWO more surfaces, not one: the molder, and a notebook cell, because
// `materialize-entity!` mints a notebook whose only cell is the entity and that
// is where the reader lands the instant they act. ONE payload shape and ONE
// renderer across all three, or the page quietly becomes three pages and the
// drift is invisible until somebody materializes something and the page they had
// been reading changes under them.
//
// `framedBy` is what the caller's own chrome already draws above this: the
// molder's `.molder-h .t`, a cell's `.cellmold .hd .t`, nothing at all in the
// modal. The name is the identity the facts hang on and it belongs on the page —
// but `materialize-entity!` titles both the object and the notebook with it, so
// after acting the reader met five lowercase `tsmc` in seven lines (crumb, panel
// title, intent, cell header, and this), measured, in a strip whose other
// notebooks read "The Solar System". So it is drawn when it adds something:
// always in the modal, and in the other two exactly when the stored title has
// diverged from the identity — which is the case the argument for drawing it was
// always about. `entity-objects` matches `[:value :name]` alone and never the
// title, so those two really can part company, and when they do, two strings on
// screen beat one.
function renderEntityPage(p,framedBy){
  p=p||{};
  // Both surfaces can be handed `{error}`: `/api/entity?name=` with a blank name,
  // and `mold-payload` for an :entity object whose stored name normalizes to
  // nothing. Handled once, here, for this function's whole reason for existing.
  // Falling through would draw an unnamed subject reading "0 facts · Nothing is
  // remembered about this yet" — a confident statement about a subject nobody
  // named, which is an answer where a refusal belongs.
  if(p.error) return '<div class="entmeta warn">'+esc(p.error)+'</div>';
  const facts=p.facts||[], srcs=p.sources||[], n=facts.length;
  // `count` is every live fact carrying the name; `facts` is the ranked page of
  // at most fifty of them. The server keeps the two apart precisely so this line
  // can say "50 of 137" instead of truncating in silence — the same rule the
  // memory pane's status line follows for `total`, and for the same reason: a
  // number derived from the page is a claim about the page wearing the clothes
  // of a claim about the world.
  //
  // The "of" appears only when it is true. `count` can come back one SHORT of the
  // page — `mem/all-facts` and `mold/recall` deref the fact map independently, so
  // a `remember` landing between them is counted by one and not the other — and
  // "49 of 48" is worse than saying nothing.
  const tot=(typeof p.count==='number'&&p.count>n)?p.count:null;
  let h=(framedBy===p.name?'':'<div class="entname">◈ '+esc(p.name)+'</div>')+
    '<div class="entmeta">'+(tot?n+' of '+tot+' facts':n+' fact'+(n===1?'':'s'))+
    // `absorb` unions the absorbed fact's entities onto the survivor, so two facts
    // naming a subject become one and the evidence really does collapse back below
    // the threshold. Say so, rather than let the page vanish under a reader.
    //
    // The threshold is NOT spelled out here. `promotion-threshold` is two because
    // 68 of 104 measured names appear exactly once, and its own docstring says the
    // number is measured — a page that hard-codes it is a second place that has to
    // be remembered when it moves. And the merge half is left unsaid when there is
    // nothing to have merged: "0 facts · a merge can collapse them back" describes
    // a history this subject cannot have had.
    (p.promoted?'':' · not yet a subject of its own'+
      (n?' — too few facts name it, and a merge can take a promoted name back below the line':''))+
    '</div>';
  h+=n
    ? facts.map(f=>'<div class="memfact"><div style="font-size:13px">'+esc(f.fact)+'</div></div>').join('')
    : '<div style="color:var(--muted);font-size:13px">Nothing is remembered about this yet.</div>';
  // `:kind` is on every source and it decides the GESTURE — the same rule act()'s
  // semantic branch states: "openObject on a notebook would open a notebook as a
  // document". Measured before this line existed: clicking a notebook chip drew its
  // {intent, cells} map as raw JSON, under a crumb still naming somewhere else. And
  // it is one click from any entity page with facts, because `memory-payload`'s
  // `:source` names an object AND the space it sat in.
  if(srcs.length) h+='<div class="entsrc">from '+srcs.map(s=>
    '<span class="ghostchip" '+(s.kind==='space'?'data-space':'data-open')+'="'+esc(s.id)+'">'+
    esc(s.title||s.id)+'</span>').join(' ')+'</div>';
  return h;
}
// A subject, opened. ONE decision and the SERVER takes it: a payload carrying
// `object` is a subject that is already a citizen, so we open the object and the
// modal — which exists to offer materialization — never appears. The shell
// working it out for itself would need the objects map, and would be wrong the
// moment anything else materialized the name.
//
// A LEAP subject row carries `:object` too, and this deliberately does not take
// it as an argument to shortcut with: that key is a snapshot from when the query
// ran, and `undo!` can remove the object between the keystroke and the Enter.
// One round trip on a click buys an answer that is true now, and leaves exactly
// one path through this function instead of two with one of them untested.
//
// `at` goes with the name, because the short-circuit hands the answer to
// openObject and openObject sends `?at=` whether we do or not. Scrub back past a
// materialization without it and the live store says "citizen", the frozen one has
// no such object, and the reader gets an empty molder — or, far enough back, a
// blank world. Reading a subject in the past is fine; reading it out of two
// different worlds at once is the defect.
let entSeq=0;   // in-flight requests can resolve out of order — only the latest may draw
async function openEntity(name){
  const tok=++entSeq;
  let p; try{ p=await API.entity(name,tat()); }
  catch(e){ if(tok!==entSeq) return; showToast('subject: network error'); return; }
  if(tok!==entSeq) return;   // a later subject was asked for while this one was in flight
  if(p.object) return openObject(p.object);
  modal.innerHTML='<div class="modalcard" style="max-width:720px"><div class="modal-h">'+
    '<span class="modalbadge">SUBJECT</span>'+
    (p.error?'':'<span class="q">derived from the agent’s memory — not an object yet</span>')+'</div>'+
    '<div class="modal-b">'+renderEntityPage(p)+'</div>'+
    '<div class="modal-f">'+(p.error?'':'<button class="btn sm" id="entNb">✦ New notebook about this</button>')+
    '<button class="btn ghost sm" id="closeModal">Close</button>'+
    '<span style="font-size:11.5px;color:var(--muted)">acting on a subject is what makes it real — reversibly</span></div></div>';
  modal.classList.add('on');
  modal.querySelector('#closeModal').addEventListener('click',closeModal);
  // the modal has no renderDetail around it, so its source chips need the same
  // delegations openMemory's do; the molder's are wired by renderDetail already.
  // Two of them, because a source is a document or a NOTEBOOK and those are two
  // different gestures — see the chip's own note in renderEntityPage.
  modal.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{
    closeModal(); openObject(el.dataset.open); }));
  modal.querySelectorAll('[data-space]').forEach(el=>el.addEventListener('click',()=>{
    const j=STATE.spaces.findIndex(s=>s.id===el.dataset.space);
    if(j>=0){ closeModal(); enter(j); }
  }));
  const nb=modal.querySelector('#entNb');
  if(nb) nb.addEventListener('click',async()=>{
    // never act into the past — refused BEFORE the POST, the way keepNote is,
    // rather than reported after a commit has already landed
    if(TIME){ showToast('time mode — ↩ now to make a notebook'); return; }
    nb.disabled=true;                       // one subject cannot be minted twice
    let r; try{ r=await API.entityNotebook(p.name); }
    catch(e){ nb.disabled=false; showToast('subject: network error'); return; }
    if(r.error){ nb.disabled=false; showToast(r.error); return; }
    // …and scrubbing into the past while the POST was in flight must not yank the
    // reader back into the present, which applyState would
    if(TIME){ showToast('made — ↩ now to see it'); return; }
    applyState(r.state); closeModal(); rebuild();
    // `spaceId` is always a KEY and null is a real answer: the notebook about this
    // subject may have been renamed or had its cell removed, and
    // materialize-entity! answers nil rather than minting a second one on a stale
    // click. The entity itself is always there, so land on that — a gesture that
    // commits and then shows you nothing is worse than one that shows you less.
    const i=r.spaceId?STATE.spaces.findIndex(s=>s.id===r.spaceId):-1;
    if(i>=0) enter(i); else openObject(r.entity);
    showToast('“'+p.name+'” is a subject in the world now — reversible', undo);
  });
}
async function askAgent(prompt, space){
  closeLeap();
  const scope = space ? ((STATE.spaces.find(s=>s.id===space)||{}).title) : 'your whole workspace';
  openModal('<span style="color:var(--muted)">asking DeepSeek, grounded in '+esc(scope||'')+'…</span>', prompt, false, scope);
  const res=await API.ask(prompt, space);
  if(res.error){ closeModal(); showToast('agent: '+res.error); return; }
  lastAnswer={prompt, text:res.answer};
  if(TIME){ showToast('answer ready — ↩ now to see it'); return; }   // never re-open the modal in the past
  openModal(mdToHtml(res.answer), prompt, mode==='focus', scope);
}
async function keepNote(){
  if(TIME){ showToast('time mode — ↩ now to keep notes'); return; }
  if(!lastAnswer || mode!=='focus') return;
  const sp=STATE.spaces[focusIdx];
  const res=await API.keepNote(sp.id, 'Note: '+lastAnswer.prompt.slice(0,48), lastAnswer.text);
  applyState(res.state); closeModal(); rebuild();
  showToast('Kept as a note in '+sp.title+' — reversible', undo);
}
function openLeap(){ cmd.classList.add('live'); renderLeap(); }
// a closed palette is owed nothing: cancel the pending deep query and forget
// the rows it fetched, so re-opening starts from the lexical list again
function closeLeap(){ cmd.classList.remove('live'); q.value=''; q.blur();
  clearTimeout(deepTimer); leapDeep=null; }
q.addEventListener('focus',()=>{ if(TIME){ q.blur(); showToast('time mode — ↩ now to search'); return; } openLeap(); });
// the lexical request goes out on the key; the deep one only if the keys stop
q.addEventListener('input',()=>{sel=0;renderLeap();scheduleDeep();});
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,filtered.length-1);paintSel();}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);paintSel();}
  // Enter does exactly ONE of two things, and which one depends on the row it
  // lands on.
  //
  // On a `by meaning` NOTE — "the embedder is not answering", "n chunks awaiting
  // embedding" — it re-asks the deep query. That is the one row act() refuses
  // (`if(e.note) return`), so nothing closes the palette, the box still holds the
  // query the answer is for, and the answer lands: the note is replaced by
  // whatever the second ask found. Enter on a note is "ask again".
  //
  // On every other row it activates the row and asks NOTHING. Acting closes the
  // palette, which empties the box, and the staleness check in deepen() then
  // drops the answer — so asking here bought an embedding round trip and a full
  // re-chunk of the substrate (`ch/pending`) per Enter for a response that was
  // thrown away. Measured: the request went out, the list did not change.
  //
  // The 250 ms pause still covers the ordinary case; this is only about Enter.
  else if(e.key==='Enter'){e.preventDefault();
    const r=filtered[sel];
    if(r&&r.note) deepen(q.value.trim()); else act();}
  else if(e.key==='Escape'){ if(q.value){q.value='';renderLeap();} else {closeLeap(); if(mode==='focus') overview();} }
});
addEventListener('keydown',e=>{
  if(modal.classList.contains('on')){ if(e.key==='Escape') closeModal(); return; }
  if(document.activeElement===q) return;
  // don't steal typing from any focused field (code-a-view, describe, edit, …)
  { const a=document.activeElement, t=a&&a.tagName; if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||(a&&a.isContentEditable)){ if(e.key==='Escape')a.blur(); return; } }
  if(e.key==='Escape'){ if(TIME){ exitTime(); return; }
    if(openId){openId=null;renderBody(focusIdx);}
    else if(overviewFilter||Object.keys(tagState).length){ clearAllFilters(); }
    else if(mode==='focus') overview(); return; }
  if(TIME) return;   // LEAP is disabled while viewing the past
  if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !e.altKey) q.focus();
});

boot();
