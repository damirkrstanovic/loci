<script>
// The ClojureScript grid, opt-in until it reaches parity with tableHTML — at
// which point both this flag and tableHTML go. `?cljs` on the URL, so a
// reviewer can put the two renderers side by side in two tabs.
const CLJS_GRID = new URLSearchParams(location.search).has('cljs');
const POST = (url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
const API = {
  state: at => fetch('/api/state'+(at!=null?'?at='+at:'')).then(r=>r.json()),
  object: (id,at) => fetch('/api/object/'+encodeURIComponent(id)+(at!=null?'?at='+at:'')).then(r=>r.json()),
  mold: (id,view,at) => fetch('/api/mold?id='+encodeURIComponent(id)+'&view='+encodeURIComponent(view)+(at!=null?'&at='+at:'')).then(r=>r.json()),
  leap: q => fetch('/api/leap?q='+encodeURIComponent(q)).then(r=>r.json()),
  // the keystroke path is `leap`; `leapDeep` is the same endpoint asked to also
  // search by meaning, which costs an embedding round trip and so is fired on a
  // pause, never on a key. Same flat array back, with `by meaning` rows added.
  leapDeep: q => fetch('/api/leap?q='+encodeURIComponent(q)+'&deep=1').then(r=>r.json()),
  undo: () => fetch('/api/undo').then(r=>r.json()),
  edit: (id,value) => POST('/api/edit',{id,value}),
  delegate: space => POST('/api/delegate',{space}),
  do: (id,prompt,space) => POST('/api/do',{id,prompt,space}),
  functions: () => fetch('/api/functions').then(r=>r.json()),
  newSpace: prompt => POST('/api/new-space',{prompt}),
  ask: (prompt,space) => POST('/api/ask',{prompt,space}),
  keepNote: (space,title,text) => POST('/api/keep-note',{space,title,text}),
  importCsv: (title,csv,space) => POST('/api/import-csv',{title,csv,space}),
  // an external file source. `describe` IS the dry run — it commits nothing and
  // answers with the columns the file has right now, which is why the shell asks
  // it rather than reading a drifted table's current columns out of the sentence
  // the server sent. `connect` and `refresh` both write, and both answer with
  // `{state, …}` the way importCsv does, so the caller's success path is the same.
  sourceDescribe: src => POST('/api/source/describe',src),
  sourceConnect: (src,space) => POST('/api/source/connect',Object.assign({space},src)),
  sourceRefresh: id => POST('/api/source/refresh',{id}),
  sourceFiles: () => fetch('/api/source/files').then(r=>r.json()),
  research: (space,prompt) => POST('/api/research',{space,prompt}),
  flow: (space,goal) => POST('/api/flow',{space,goal}),
  flowGate: (id,approve) => POST('/api/flow-gate',{id,approve}),
  notebook: (id,at) => fetch('/api/notebook?id='+encodeURIComponent(id)+(at!=null?'&at='+at:'')).then(r=>r.json()),
  events: () => fetch('/api/events').then(r=>r.json()),
  notebookOp: body => POST('/api/notebook', body),
  flows: () => fetch('/api/flows').then(r=>r.json()),
  memory: q => fetch('/api/memory'+(q?'?q='+encodeURIComponent(q):'')).then(r=>r.json()),
  // answers with the two records, NOT a pane payload — it carries no q and no
  // space, so the caller refetches /api/memory with whatever it was showing
  memoryUnmerge: (survivor,absorbed) => POST('/api/memory-unmerge',{survivor,absorbed}),
  // your judgement about whether a fact goes out of date — the one writer of
  // `durable?` the agent may not revise. Answers with the ONE updated record and
  // no pane payload, for memoryUnmerge's reason: this request carries no q and
  // no space, so the caller refetches with whatever it was showing.
  //
  // `durable` travels as a boolean and never as a string: the server refuses
  // anything else, because `weight` reads the value and "false" is truthy on the
  // Clojure side — a fact stamped as YOURS and ranked as timeless when you said
  // the opposite.
  memoryDurable: (id,durable) => POST('/api/memory-durable',{id,durable}),
  // The only irreversible call in this file. The server answers with the text it
  // removed, which is the last reachable copy of it — the toast below is what
  // makes that worth returning.
  memoryForget: id => POST('/api/memory-forget',{id}),
  // the subject page, in ONE payload the modal, the molder and a notebook cell all
  // draw. The raw string goes over the wire: `ent/normalize` is the server's, and a
  // second implementation of it in the page would be the thing that disagrees with it.
  //
  // `at` travels because the SHORT-CIRCUIT in openEntity does: a payload carrying
  // `object` is handed to openObject, which sends `?at=` of its own. Without it the
  // two halves of one gesture read two different worlds — a subject materialized
  // after the point you scrubbed to answers with an object id that does not exist
  // there. Measured: a molder with an empty header and the word `null`, and further
  // back an uncaught TypeError and a blank world.
  //
  // `at!=null`, not `at?`: 0 is the beginning of the log and a real place to stand.
  // Every other `at`-taking entry here spells it the same way for the same reason.
  entity: (name,at) => fetch('/api/entity?name='+encodeURIComponent(name)+(at!=null?'&at='+at:'')).then(r=>r.json()),
  // one reversible commit — the :entity object AND the notebook about it. Answers
  // {state, entity, spaceId}; `spaceId` is always a key and null is a real answer.
  entityNotebook: name => POST('/api/entity-notebook',{name}),
  // What the lake costs. THIS IS THE DRY RUN — there is no preview endpoint,
  // because the report names exactly the versions a reclaim will delete and the
  // bytes it will free, and `reclaim!` asserts the same numbers back.
  storage: () => fetch('/api/storage').then(r=>r.json()),
  // …and the irreversible half. POST, never GET: a bodyless GET carries no
  // `:id`, and `nil` means THE ORPHANS to lakegc/reclaim! — the server guards
  // that twice (method, then a missing id) and this spelling is the third.
  // Answers {object, tables, versions, files, freed} or a 200 with {error}.
  storageReclaim: id => POST('/api/storage/reclaim',{id}),
  // The files directory's half of the same panel, and the same POST-never-GET
  // rule for the same reason: it deletes bytes and undo reverts an event, not a
  // file. It names no object because a file belongs to none — two tables may
  // share one, an upload nobody picked belongs to nothing — so a files reclaim
  // is the whole directory or it is nothing, and the empty body is the honest
  // shape rather than a missing argument.
  //
  // Answers {reclaimed:[{file,bytes,error?}], freed}. One row per CANDIDATE,
  // including the ones it could not delete — and `freed` is computed beside the
  // deletes in `files/reclaim!`, because a failed row carries the same `bytes`
  // as a done one and adding them up here would report files still on disk.
  //
  // **Its own fetch, because this is the one call where a 500 is not "nothing
  // happened".** `POST` above is `.then(r=>r.json())` with no status check, and
  // `handler` has no top-level catch — so a throw partway through a sweep
  // (a read-only manifest, a full disk) answers a non-JSON 500, `r.json()`
  // rejects, and the caller's catch says *could not reach the server — nothing
  // was deleted* over four files that are gone. `reached` is what lets the
  // caller tell a server that failed from a server that was never there.
  reclaimFiles: async () => {
    const r = await fetch('/api/storage/reclaim-files',
                          {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!r.ok){ const e=new Error('the server answered '+r.status); e.reached=true; throw e; }
    return r.json();
  },
  suggest: space => POST('/api/suggest',{space}),
  suggestRun: (space,items,destination) => POST('/api/suggest-run',{space,items,destination}),
  job: id => fetch('/api/job?id='+encodeURIComponent(id)).then(r=>r.json()),
  fns: id => fetch('/api/fns?id='+encodeURIComponent(id)).then(r=>r.json()),
  fnPreview: (id,fnid,params) => POST('/api/fn-preview',{id,fnid,params}),
  fnApply: (id,fnid,params,space) => POST('/api/fn-apply',{id,fnid,params,space}),
  rerun: id => POST('/api/rerun',{id}),
  connect: (a,b) => POST('/api/connect',{a,b}),
  tags: (space,tags) => POST('/api/tags',{space,tags}),
  tagSuggest: (space) => POST('/api/tag-suggest',{space}),
  tagColor: (tag,color) => POST('/api/tag-color',{tag,color}),
};

let STATE={spaces:[],objects:{}};
let panels=[], mode='focus', focusIdx=0, openId=null;
let filtered=[], sel=0;
let TIME=null;   // {n,total,events} while scrubbing, else null
const tat=()=>TIME?TIME.n:undefined;

const world=document.getElementById('world');
const cmd=document.getElementById('cmd'), q=document.getElementById('q'), results=document.getElementById('results');
const crumb=document.getElementById('crumb'), crumbName=document.getElementById('crumbName'), crumbHint=document.getElementById('crumbHint');
const ambient=document.getElementById('ambient');

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ---------------- boot / state ----------------
async function boot(){ applyState(await API.state()); rebuild(); }
function applyState(s){
  const fid=(STATE.spaces[focusIdx]||{}).id;
  // cluster spawned/connected notebooks right after their hub (first parent) so the overview groups them
  const byHub={}; s.spaces.forEach(sp=>{ const h=sp['spawned-by']||((sp['merged-from']||[])[0]); if(h) (byHub[h]=byHub[h]||[]).push(sp); });
  const ordered=[], seen=new Set();
  const emit=sp=>{ if(seen.has(sp.id)) return; seen.add(sp.id); ordered.push(sp); (byHub[sp.id]||[]).forEach(emit); };
  s.spaces.forEach(sp=>{ const h=sp['spawned-by']||((sp['merged-from']||[])[0]); if(!h||!s.spaces.some(x=>x.id===h)) emit(sp); });
  s.spaces.forEach(sp=>{ if(!seen.has(sp.id)) emit(sp); });   // paranoia: never drop a panel
  STATE.spaces=ordered;
  STATE.objects={}; s.objects.forEach(o=>STATE.objects[o.id]=o); STATE.events=s.events;
  STATE.tagColors = s['tag-colors'] || {};   // kebab-case over the wire, like sp['spawned-by']
  STATE['flows-need-you'] = s['flows-need-you'] || 0;
  renderFlowBadge();
  const ni=STATE.spaces.findIndex(sp=>sp.id===fid); if(ni>=0) focusIdx=ni;
  else focusIdx=Math.min(focusIdx,Math.max(0,STATE.spaces.length-1));   // focused space vanished — stay in range
  renderStrip();
}
function renderStrip(){ ambient.textContent = STATE.spaces.length+' notebooks · '+Object.keys(STATE.objects).length+' objects · '+STATE.events+' events'; }
function rebuild(){
  world.querySelectorAll('.panel').forEach(p=>p.remove()); panels=[];
  STATE.spaces.forEach((sp,i)=>buildPanel(sp,i));
  panels.forEach((p,i)=>renderBody(i));
  layout();
}

// ---------------- undo + toast (reversibility, made visible) ----------------
let toastTimer;
function showToast(msg,undoFn){
  const t=document.getElementById('toast'); clearTimeout(toastTimer);
  t.innerHTML=esc(msg)+(undoFn?' <span class="u">Undo</span>':'');
  t.classList.add('on');
  if(undoFn) t.querySelector('.u').addEventListener('click',()=>{undoFn();t.classList.remove('on');});
  toastTimer=setTimeout(()=>t.classList.remove('on'), undoFn?5000:2500);
}
async function undo(){
  if(TIME){ showToast('time mode — ↩ now to edit'); return; }
  const s=await API.undo();
  const gone = openId && !s.objects.find(o=>o.id===openId);
  applyState(s); if(gone) openId=null;
  rebuild(); if(openId) openObject(openId);
}
document.getElementById('undoBtn').addEventListener('click',()=>{ undo(); if(!TIME) showToast('Reverted last event'); });

// long agent flows run server-side as jobs; we poll instead of holding a fetch
// open for minutes (browsers kill those — the old "refresh to see it" bug).
function pollJob(id,onDone){
  const tick=async()=>{
    let s; try{ s=await API.job(id); }catch(e){ setTimeout(tick,4000); return; }  // network blip — keep waiting
    if(!s.done){ setTimeout(tick,3000); return; }
    onDone(s.result||{error:s.error||'job lost'});
  };
  setTimeout(tick,2000);
}
// a job can finish while the user is typing somewhere — don't yank the DOM out
// from under them; wait until no input is focused (LEAP box excepted).
function safeRebuild(){
  if(TIME){ setTimeout(safeRebuild,4000); return; }   // never yank the user out of the past
  const ae=document.activeElement;
  if(ae&&ae!==q&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){ setTimeout(safeRebuild,4000); return; }
  rebuild(); if(openId) openObject(openId);
}

// One line telling a focused notebook where it sits: its parent, how many
// notebooks share that parent, and what it spawned. The tree-view on
// selection, at the cost of a line rather than a permanent rail.
function structureLine(i){
  const sp=STATE.spaces[i]; if(!sp) return '';
  const pid=sp['spawned-by']||(sp['merged-from']||[])[0];
  const parent=pid?STATE.spaces.find(x=>x.id===pid):null;
  const kids=STATE.spaces.filter(x=>(x['spawned-by']||(x['merged-from']||[])[0])===sp.id);
  const sibs=parent?STATE.spaces.filter(x=>(x['spawned-by']||(x['merged-from']||[])[0])===parent.id&&x.id!==sp.id):[];
  const bits=[];
  if(parent) bits.push('<span class="slink" data-space="'+esc(parent.id)+'">↰ '+esc(parent.title)+'</span>');
  if(sibs.length) bits.push(sibs.length+(sibs.length===1?' sibling':' siblings'));
  if(kids.length) bits.push('<span class="slink" data-kids="1">'+kids.length+
                            (kids.length===1?' deep-dive':' deep-dives')+'</span>');
  return bits.length?'<div class="p-structure">'+bits.join(' · ')+'</div>':'';
}

function buildPanel(sp,i){
  const hubId = sp['spawned-by']||((sp['merged-from']||[])[0]);
  const hub = hubId ? STATE.spaces.find(h=>h.id===hubId) : null;
  const merged = sp['merged-from'];
  const mtitles = merged ? merged.map(id=>((STATE.spaces.find(s=>s.id===id)||{}).title)||id).join(' × ') : '';
  const p=document.createElement('div'); p.className='panel'+(hub?' child':''); p.dataset.i=i;
  // In the overview a child sits UNDER its parent, so naming the parent in the
  // eyebrow is redundant — and it was truncated at card width anyway. Focus
  // mode has no such context, so the full form survives there via .p-structure.
  p.innerHTML='<div class="p-status"><span class="adot"></span>'+(merged?'connected':hub?'spawned':'notebook')+'</div>'+
    '<div class="p-head"><div class="p-eyebrow">'+
      (merged?'connected · '+esc(mtitles):hub?'deep-dive':'notebook · intention')+'</div>'+
    '<h2 class="p-title">'+esc(sp.title)+'</h2><p class="p-intent">'+richInline(sp.intent)+'</p>'+
    structureLine(i)+'</div>'+
    '<div class="p-body" id="body'+i+'"></div>';
  p.addEventListener('click',e=>{
    // a cited id in the intent — checked FIRST, because the fallthrough below
    // enters the notebook on any click in overview mode and would swallow it
    const ref=e.target.closest('.objref');
    if(ref){ e.stopPropagation();
      if(ref.dataset.open){ openObject(ref.dataset.open); return; }
      const k=STATE.spaces.findIndex(x=>x.id===ref.dataset.space);
      if(k>=0) enter(k);
      return; }
    const link=e.target.closest('.slink[data-space]');
    if(link){ e.stopPropagation();
      const j=STATE.spaces.findIndex(x=>x.id===link.dataset.space);
      if(j>=0) enter(j);
      return; }
    if(e.target.closest('.slink[data-kids]')){ e.stopPropagation(); overview(); return; }
    if(mode==='overview'){ e.stopPropagation(); enter(i);}
  });
  world.appendChild(p); panels.push(p);
}

function renderBody(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  if(i===focusIdx && openId){ renderDetail(i); return; }
  if(mode==='focus' && i===focusIdx){ renderNotebook(i); return; }
  // overview card: cheap title list only — the full notebook loads on focus
  let h='<div class="sec-h">in this notebook</div>';
  if(!sp.members.length) h+='<div style="color:var(--muted);font-size:13px;padding:4px 0 8px">Empty — Research or Import to fill it.</div>';
  sp.members.forEach(id=>{ const o=STATE.objects[id]||{id,title:id,kind:'?'};
    h+='<div class="obj" data-open="'+id+'"><div class="ttl">'+esc(o.title)+' <span class="chip">'+id+'</span></div></div>'; });
  b.innerHTML=h;
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openObject(el.dataset.open)));
}

async function cellOp(i,body){
  if(TIME){ showToast('time mode — ↩ now to edit'); return; }
  const sp=STATE.spaces[i], before=STATE.events;
  const res=await API.notebookOp(Object.assign({space:sp.id},body));
  if(res.error){ showToast(res.error); return; }
  applyState(res.state); renderBody(i);
  if(res.state.events>before) showToast('Notebook updated — reversible', undo);
}

function editProse(i,idx,text){
  const b=document.getElementById('body'+i);
  const target = idx===null ? b.querySelector('.addrow') : b.querySelector('[data-cell="'+idx+'"]');
  if(!target) return;
  const ed=document.createElement('div');
  ed.innerHTML='<textarea class="prosed" style="width:100%;min-height:90px;font:13px/1.6 var(--sans);border:1px solid var(--accent-line);border-radius:8px;padding:9px;box-sizing:border-box">'+esc(text||'')+'</textarea>'+
    '<div class="actions" style="margin:6px 0 10px"><button class="btn sm" data-a="save">Save</button><button class="btn ghost sm" data-a="cancel">Cancel</button></div>';
  target.replaceWith(ed);
  ed.querySelector('[data-a="save"]').addEventListener('click',()=>{
    const t=ed.querySelector('.prosed').value;
    cellOp(i, idx===null?{op:'add-text',text:t}:{op:'edit-text',idx,text:t});
  });
  ed.querySelector('[data-a="cancel"]').addEventListener('click',()=>renderBody(i));
  ed.querySelector('.prosed').focus();
}

// The inline forms a repaint would destroy — research, flow, ask, ＋ Data, the
// prose editor and the ƒ palette. ONE definition, used by both guards below, so
// the next panel someone adds is covered by both of them or by neither, rather
// than by whichever one they remembered.
//
// Returns the ELEMENT and not a boolean, because `renderNotebook` needs its
// identity: a form that was already there when a render started is one that
// render is dismissing, while a DIFFERENT one appeared while it was in flight.
const FORMSEL='#fq,#rq,#aq,.datapanel,.prosed,.fnpal';
function formOpenIn(b){ return b?b.querySelector(FORMSEL):null; }

async function renderNotebook(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  // don't flash "loading…" (and reset scroll) when this notebook is already
  // painted — watchFlow re-renders every 2.5s; the fetch repaints fully below
  if(!b.querySelector('.cellwrap')) b.innerHTML='<div class="sec-h">loading notebook…</div>';
  // What is open in this panel BEFORE the fetch. A form still standing when the
  // answer lands is the one this render was called to dismiss — every Cancel
  // (`#cancelImp`, `#cancelRes`, `#cancelFlow`, `#cancelAsk`, the prose
  // editor's) calls renderBody while its own markup is still on screen, so
  // skipping on presence alone would make Cancel a button that does nothing.
  const wasOpen=formOpenIn(b);
  const nb=await API.notebook(sp.id,tat());
  if(mode!=='focus'||i!==focusIdx||openId) return;   // panel moved on while we fetched
  // A DIFFERENT form is one somebody opened while we were fetching, and the
  // wholesale `b.innerHTML=` below would throw it away along with whatever they
  // had typed. Measured: the window is one fetch — 26 ms idle — which is why
  // this raced three full-suite runs in five and never once in isolation.
  //
  // The cost, which is the right way round but should be written down rather
  // than discovered: a notebook that finishes loading while a form is open does
  // NOT repaint, so the cells behind that form can be one fetch stale until it
  // closes. Losing what someone typed is worse than showing slightly old cells
  // behind a panel they are looking at.
  const nowOpen=formOpenIn(b);
  if(nowOpen && nowOpen!==wasOpen) return;
  if(nb.error){ b.innerHTML='<div style="color:var(--attn);font-size:13px">'+esc(nb.error)+'</div>'; return; }
  let cellsH='';
  nb.cells.forEach(c=>{
    const bar='<div class="cellbar">'+(c.i>0?'<button data-act="up" data-i="'+c.i+'">↑</button>':'')+
      (c.i<nb.cells.length-1?'<button data-act="down" data-i="'+c.i+'">↓</button>':'')+
      (c.type==='text'?'<button data-act="edit" data-i="'+c.i+'">✎</button>':'')+
      '<button data-act="rm" data-i="'+c.i+'">✕</button></div>';
    if(c.type==='text'){
      cellsH+='<div class="cellwrap" data-cell="'+c.i+'">'+bar+'<p class="prose">'+richInline(c.text)+'</p></div>';
    } else if(c.type==='missing'){
      cellsH+='<div class="cellwrap" data-cell="'+c.i+'">'+bar+'<div style="color:var(--attn);font-size:12px">missing object '+esc(c.ref)+'</div></div>';
    } else {
      let opts=''; (c.alternatives||[]).forEach(([vid,label])=>{ opts+='<option value="'+vid+'"'+(vid===c.view?' selected':'')+'>'+esc(label)+'</option>'; });
      let chips='';
      if(c.from) chips+='↳ derived from <span class="ghostchip" data-open="'+esc(c.from)+'">'+esc(c.from)+'</span>'+(c.via?' via '+esc(c.via):'');
      if(c.from) chips+=' <button class="mkcell" data-rerun="'+esc(c.id)+'" title="↻ re-run lineage — recompute this table from its source (and everything derived from it)">↻</button>';
      if(c['also-in']&&c['also-in'].length) chips+=(chips?' · ':'')+'↳ also in '+
        c['also-in'].map(s=>'<span class="ghostchip" data-space="'+esc(s.id)+'">'+esc(s.title)+'</span>').join(' ');
      const mkable=(c.alternatives||[]).some(a=>a[1]==='Rows');   // table-shaped → ✦ make lives here too
      cellsH+='<div class="cellwrap" data-cell="'+c.i+'">'+bar+
        '<div class="cellmold"><div class="hd"><span class="t" data-open="'+esc(c.id)+'">'+esc(c.title)+'</span>'+
        '<span class="chip">'+esc(c.id)+'</span>'+
        ((c.alternatives||[]).length?'<select data-remold="'+c.i+'">'+opts+'</select>':'')+   // a flow has no molds — no empty control
        (mkable?'<button class="mkcell" data-make="'+esc(c.id)+'" title="✦ make… — ask for a view, a computed table, or a visualization of this data">✦</button>'+
                '<button class="mkcell" data-fnp="'+esc(c.id)+'" title="ƒ apply a function — filter, group, pivot, top-N…">ƒ</button>':'')+'</div>'+
        '<div class="bd">'+renderMold(c)+'</div>'+(chips?'<div class="chips">'+chips+'</div>':'')+'</div></div>';
    }
  });
  const dl='<datalist id="objlist">'+Object.values(STATE.objects).map(o=>'<option value="'+esc(o.id)+'">'+esc(o.title)+'</option>').join('')+'</datalist>';
  const add='<div class="addrow"><button class="btn ghost sm" id="addProse">＋ prose</button>'+
    '<input id="addRef" list="objlist" placeholder="＋ object by id…">'+dl+'</div>';
  const rail = nb.connected.length
    ? '<div class="rail"><div class="sec-h">connected · '+nb.connected.length+'</div>'+
      nb.connected.map(cn=>'<div class="raillink" data-space="'+esc(cn.id)+'"><b>'+esc(cn.title)+'</b><br><span class="why">'+
        cn.reasons.map(r=>r.type==='spawned'?'deep-dive · spawned from here':r.type==='spawned-by'?'spawned this notebook':r.type==='shares'?'shares '+esc(r.obj):r.type==='merged-from'?'connected · made from this notebook':r.type==='merged'?'part of this connection':'lineage · '+esc(r.obj)).join('<br>')+
        '</span></div>').join('')+'</div>'
    : '';
  const actions='<div class="actions" style="margin-bottom:6px">'+
    '<button class="btn sm" id="askBtn">✦ Ask</button>'+
    '<button class="btn ghost sm" id="researchBtn">🔍 Research</button>'+
    '<button class="btn ghost sm" id="sgBtn">✧ Suggest</button>'+
    '<button class="btn ghost sm" id="flowBtn">⚑ Flow</button>'+
    '<button class="btn ghost sm" id="draftBtn">✎ Draft</button>'+
    '<button class="btn ghost sm" id="dataBtn">＋ Data</button>'+
    '<button class="btn ghost sm" id="tagBtn">⌗ tags</button></div>'+
    (nb['spawned-by']?'<div style="font-size:11px;font-family:var(--mono);color:var(--faint);margin-bottom:8px">spawned from <span class="ghostchip" data-space="'+esc(nb['spawned-by'].space)+'">'+esc(nb['spawned-by'].space)+'</span> · “'+esc(nb['spawned-by'].prompt||'')+'”</div>':'');
  // The outline. Only from two cells up: a one-cell notebook has nothing to
  // navigate, and a rail that says "you are here" about the only thing there is
  // is furniture.
  const outline = nb.cells.length>1
    ? '<div class="nbrail"><div class="nr-h">OUTLINE</div>'+
      nb.cells.map(c=>{
        const kind = c.type==='text' ? 'text' : (c.type==='missing' ? 'missing' : (c.kind||'doc'));
        const label = c.type==='text'    ? (c.text||'').trim().replace(/\s+/g,' ').slice(0,44)
                    : c.type==='missing' ? c.ref
                    : (c.title||c.id||'');
        return '<button type="button" data-jump="'+c.i+'" title="'+esc(label)+'">'+
          '<span class="nr-ic">'+(CELLICON[kind]||'·')+'</span>'+
          '<span class="nr-t">'+esc(label||'—')+'</span></button>';
      }).join('')+'</div>'
    : '';
  b.innerHTML=actions+'<div class="nbrow">'+outline+'<div style="flex:1;min-width:0">'+cellsH+add+'</div>'+rail+'</div>';
  b.querySelectorAll('[data-jump]').forEach(el=>el.addEventListener('click',()=>{
    const w=b.querySelector('.cellwrap[data-cell="'+el.dataset.jump+'"]');
    if(!w) return;
    w.scrollIntoView({behavior:'smooth',block:'start'});
    // one beat of highlight, so a jump is legible as an arrival rather than
    // leaving the reader to work out whether anything moved
    w.classList.add('flash'); setTimeout(()=>w.classList.remove('flash'),900);
  }));
  // which cell you are reading. `b` IS the scroll container (.p-body), so the
  // listener goes on it — and is REPLACED rather than added, because
  // renderNotebook re-runs every 2.5s while a flow is watched and the element
  // survives innerHTML, so adding would stack a listener per re-render.
  const spy=()=>{
    const cells=[...b.querySelectorAll('.cellwrap')];
    if(!cells.length) return;
    const top=b.getBoundingClientRect().top;
    let cur=cells[0];
    for(const c of cells){ if(c.getBoundingClientRect().top-top<=12) cur=c; else break; }
    b.querySelectorAll('[data-jump]').forEach(x=>
      x.classList.toggle('on', x.dataset.jump===cur.dataset.cell));
  };
  if(b._spy) b.removeEventListener('scroll',b._spy);
  b._spy=spy; b.addEventListener('scroll',spy,{passive:true}); spy();
  b.querySelector('#askBtn').addEventListener('click',()=>startAsk(i));
  b.querySelector('#researchBtn').addEventListener('click',()=>startResearch(i));
  b.querySelector('#draftBtn').addEventListener('click',async()=>{
    let res; try{ res=await API.delegate(sp.id); }catch(e){ showToast('draft: network error'); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    if(res.error){ showToast('draft: '+res.error); return; }
    applyState(res.state); openId=res.openId; rebuild(); openObject(res.openId);
    showToast('Draft written by the agent (reversible)', undo);
  });
  b.querySelector('#dataBtn').addEventListener('click',()=>startData(i));
  b.querySelector('#tagBtn').addEventListener('click',()=>startTags(i));
  // Proposing writes nothing, so this changes the button and nothing else: the
  // notebook stays readable while the agent thinks, and putting it back needs no
  // repaint — so an object opened while waiting is never yanked out from under you.
  b.querySelector('#sgBtn').addEventListener('click',async()=>{
    const btn=b.querySelector('#sgBtn');
    const restore=()=>{ btn.textContent='✧ Suggest'; btn.disabled=false; };
    btn.textContent='reading…'; btn.disabled=true;
    let res; try{ res=await API.suggest(sp.id); }catch(e){ restore(); showToast('suggest: network error'); return; }
    if(res.error){ restore(); showToast('suggest: '+res.error); return; }
    pollJob(res.job, r=>{
      restore();
      if(TIME){ showToast('suggestions ready — ↩ now to choose'); return; }
      if(r.error){ showToast('suggest: '+r.error); return; }
      if(!r.proposals||!r.proposals.length){ showToast('suggest: nothing proposed'); return; }
      openSuggest(i,sp,r.proposals);
    });
  });
  b.querySelector('#flowBtn').addEventListener('click',()=>startFlow(i));
  wireSourceButtons(b,i);   // a cell draws the same block the molder does
  b.querySelectorAll('[data-remold]').forEach(sel=>sel.addEventListener('change',()=>cellOp(i,{op:'set-view',idx:+sel.dataset.remold,view:sel.value})));
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openObject(el.dataset.open)));
  b.querySelectorAll('[data-make]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();makeOn(el.dataset.make);}));
  b.querySelectorAll('[data-fnp]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    openFnPalette(i, el.dataset.fnp, el.closest('.cellmold'));
  }));
  b.querySelectorAll('[data-rerun]').forEach(el=>el.addEventListener('click',async ev=>{
    ev.stopPropagation();
    if(TIME){ showToast('time mode — ↩ now to edit'); return; }
    let r; try{ r=await API.rerun(el.dataset.rerun); }catch(e){ showToast('rerun: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    applyState(r.state); renderBody(i);
    const skips=(r.skipped||[]).length, n=r.refreshed.length;
    showToast('Recomputed '+n+' table'+(n===1?'':'s')+
      (skips?' · '+skips+' skipped':'')+(n?' — reversible':''), n?undo:null);
    if(skips) console.log('rerun skipped:', r.skipped);
  }));
  b.querySelectorAll('[data-space]').forEach(el=>el.addEventListener('click',()=>{
    const j=STATE.spaces.findIndex(s=>s.id===el.dataset.space); if(j>=0) enter(j);
  }));
  b.querySelectorAll('[data-gate]').forEach(el=>el.addEventListener('click',async ev=>{
    ev.stopPropagation();
    if(TIME){ showToast('time mode — ↩ now to decide'); return; }
    const ok=el.dataset.gate==='yes';
    let r; try{ r=await API.flowGate(el.dataset.flow, ok); }catch(e){ showToast('gate: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    if(ok){ showToast('Approved — the flow continues'); watchFlow(i, r.job); renderBody(i); }
    else  { applyState(r.state); renderBody(i); showToast('Rejected — the flow stopped (reversible)', undo); }
  }));
  b.querySelectorAll('.cellbar button').forEach(btn=>btn.addEventListener('click',ev=>{
    ev.stopPropagation();
    const idx=+btn.dataset.i, act=btn.dataset.act;
    if(act==='rm') cellOp(i,{op:'remove',idx});
    else if(act==='up') cellOp(i,{op:'move',idx,to:idx-1});
    else if(act==='down') cellOp(i,{op:'move',idx,to:idx+1});
    else if(act==='edit') editProse(i,idx,(nb.cells[idx]||{}).text||'');
  }));
  b.querySelector('#addProse').addEventListener('click',()=>editProse(i,null,''));
  const ar=b.querySelector('#addRef');
  ar.addEventListener('change',()=>{ const id=ar.value.trim(); if(!id) return;
    if(STATE.objects[id]) cellOp(i,{op:'add-ref',ref:id});
    else showToast('no object “'+id+'” — pick one from the list'); });
  // agent-written applet cells run scoped to their own cell
  nb.cells.forEach(c=>{
    if(c.type==='ref'&&c.kind==='applet'){
      const w=b.querySelector('[data-cell="'+c.i+'"]'), host=w&&w.querySelector('#appletHost');
      if(host){ try{(new Function('data','el',c.code))(c.rendered,host);}catch(e){host.textContent='applet error: '+e.message;} }
    }
  });
}
// tags are asserted, never computed — so they are shown and approved, never
// applied behind your back. Existing tags are editable; the agent's proposal
// arrives as more chips you can drop.
function startTags(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  let tags=(sp.tags||[]).map(t=>({...t}));
  const draw=()=>{
    b.innerHTML='<div class="sec-h">tags</div>'+
      '<div class="tagedit">'+(tags.length?tags.map((t,k)=>
        '<span class="tagchip '+(t.by==='agent'?'byagent':'')+'" data-k="'+k+'" '+
        'style="--tag-ink:'+tagInk(t.tag)+'">'+
        '<u class="ink" data-ink="'+esc(t.tag)+'" title="choose a colour"></u>'+esc(t.tag)+
        ' <span class="x">✕</span></span>').join(''):'<i style="color:var(--muted)">no tags yet</i>')+
      '</div><div id="inkpickhost"></div>'+
      '<div class="actions" style="margin-top:10px">'+
        '<input id="tagIn" placeholder="add a tag…" style="min-width:180px;border:1px solid var(--line);'+
        'border-radius:3px;padding:6px 9px;font:inherit;font-size:12.5px">'+
        '<button class="btn ghost sm" id="tagAsk">✦ suggest</button>'+
        '<button class="btn sm" id="tagSave">Save</button>'+
        '<button class="btn ghost sm" id="tagCancel">Cancel</button></div>'+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">'+
        'tags group notebooks by subject — the one thing the substrate cannot work out for itself</div>';
    b.querySelectorAll('.tagedit .x').forEach(x=>x.addEventListener('click',e=>{
      tags.splice(+e.target.closest('[data-k]').dataset.k,1); draw(); }));
    // the tag name is read back off dataset, which un-escapes what esc() wrote
    // into the attribute — so a tag holding & or ' is compared and POSTed as
    // itself. `sw` rather than e.target: the <u> has no children today, but a
    // closure variable cannot become the wrong element if it ever gains one.
    b.querySelectorAll('.tagedit .ink').forEach(sw=>sw.addEventListener('click',()=>{
      const tag=sw.dataset.ink, host=b.querySelector('#inkpickhost');
      if(host.dataset.open===tag){ host.innerHTML=''; host.dataset.open=''; return; }   // same swatch again: close
      host.dataset.open=tag;
      host.innerHTML='<div class="inkpick">'+TAG_INKS.map(c=>
        '<b data-c="'+c+'" class="'+(tagInk(tag)===c?'on':'')+'" style="background:'+c+'"></b>'
      ).join('')+'</div>';
      host.querySelectorAll('.inkpick b').forEach(sq=>sq.addEventListener('click',async()=>{
        if(TIME){ showToast('time mode — ↩ now to edit'); return; }
        // a colour is global and standing: choosing one for a tag you have
        // typed but not saved still records it, because the colour is about
        // the name, not about this notebook
        let r; try{ r=await API.tagColor(tag,sq.dataset.c); }
        catch(e){ showToast('colour: network error'); return; }
        if(r.error){ showToast(r.error); return; }
        // draw() rewrites b.innerHTML wholesale, so it repaints the chips in the
        // new ink AND replaces #inkpickhost with an empty one — the picker is
        // gone without being closed, and cannot be left behind twice. It has to
        // run after applyState, which is what puts the new ink in STATE.tagColors.
        //
        // The strip needs no repaint here: this editor only exists in focus mode
        // (.world.cards .p-body is display:none), renderTagStrip() returns at its
        // first line unless mode==='overview', and every road back to the overview
        // runs layout(), whose first statement is renderTagStrip(). Same at #tagSave.
        applyState(r.state); draw();
      }));
    }));
    const add=()=>{ const v=b.querySelector('#tagIn').value.trim().toLowerCase();
      if(v && !tags.some(t=>t.tag===v)) tags.push({tag:v,by:'you'});
      b.querySelector('#tagIn').value=''; draw(); b.querySelector('#tagIn').focus(); };
    b.querySelector('#tagIn').addEventListener('keydown',e=>{ if(e.key==='Enter') add(); });
    b.querySelector('#tagCancel').addEventListener('click',()=>renderBody(i));
    b.querySelector('#tagSave').addEventListener('click',async()=>{
      if(TIME){ showToast('time mode — ↩ now to edit'); return; }
      let r; try{ r=await API.tags(sp.id,tags); }catch(e){ showToast('tags: network error'); return; }
      if(r.error){ showToast(r.error); return; }
      applyState(r.state); renderBody(i);
      showToast('Tags saved (reversible)', undo);
    });
    b.querySelector('#tagAsk').addEventListener('click',async()=>{
      const btn=b.querySelector('#tagAsk'); btn.textContent='thinking…'; btn.disabled=true;
      let r; try{ r=await API.tagSuggest(sp.id); }catch(e){ showToast('tags: network error'); draw(); return; }
      if(r.error){ showToast(r.error); draw(); return; }
      pollJob(r.job,res=>{
        if(res.error){ showToast('tags: '+res.error); draw(); return; }
        (res.tags||[]).forEach(t=>{ if(!tags.some(x=>x.tag===t)) tags.push({tag:t,by:'agent'}); });
        draw();
        showToast('Proposed — drop any you disagree with, then Save');
      });
    });
  };
  draw();
  b.querySelector('#tagIn').focus();
}
function startResearch(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  b.innerHTML='<div class="actions"><input id="rq" placeholder="what should the agent research? e.g. “competitor pricing for X”" '+
    'style="flex:1;min-width:280px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px">'+
    '<button class="btn sm" id="goRes">Research</button><button class="btn ghost sm" id="cancelRes">Cancel</button></div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">the agent searches the web &amp; your data, then saves a findings note into this space</div>';
  const go=async()=>{
    const p=b.querySelector('#rq').value.trim(); if(!p) return;
    b.innerHTML='<div class="sec-h">researching</div><div style="color:var(--muted);font-size:13px">searching the web &amp; your data — this can take a minute…</div>';
    let res; try{ res=await API.research(sp.id, p); }catch(e){ showToast('research: network error'); renderBody(i); return; }
    if(res.error){ showToast('research: '+res.error); renderBody(i); return; }
    pollJob(res.job, r=>{
      if(TIME){ showToast('agent finished — ↩ now to see it'); return; }
      if(r.error){ showToast('research: '+r.error); if(mode==='focus'&&focusIdx===i&&!openId) renderBody(i); return; }
      applyState(r.state);
      // only jump to the findings if the user is still waiting in this notebook
      if(mode==='focus'&&focusIdx===i&&!openId){ openId=r.openId; rebuild(); openObject(r.openId); }
      else safeRebuild();
      showToast('Findings saved to '+sp.title+' — reversible', undo);
    });
  };
  b.querySelector('#goRes').addEventListener('click',go);
  b.querySelector('#rq').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  b.querySelector('#cancelRes').addEventListener('click',()=>renderBody(i));
  b.querySelector('#rq').focus();
}
function startFlow(i){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  b.innerHTML='<div class="actions"><input id="fq" placeholder="what should the agent take on? e.g. “map the EV battery supply chain and brief me” " '+
    'style="flex:1;min-width:280px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px">'+

    '<div style="font-size:12px;color:var(--muted);margin-top:8px">the agent plans a short flow (research → gate → compute → draft), runs it step by step, and STOPS to ask you at gates — every step reversible</div>';
  const go=async()=>{
    const g=b.querySelector('#fq').value.trim(); if(!g) return;
    b.innerHTML='<div class="sec-h">planning</div><div style="color:var(--muted);font-size:13px">the agent is planning the flow…</div>';
    let res; try{ res=await API.flow(sp.id, g); }catch(e){ showToast('flow: network error'); renderBody(i); return; }
    if(res.error){ showToast('flow: '+res.error); renderBody(i); return; }
    watchFlow(i, res.job);
  };
  b.querySelector('#goFlow').addEventListener('click',go);
  b.querySelector('#fq').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  b.querySelector('#cancelFlow').addEventListener('click',()=>renderBody(i));
  b.querySelector('#fq').focus();
}
// watch a running flow: refresh the notebook every 2.5s so the checklist is
// live, and toast when the job ends (done / needs-you / failed).
function watchFlow(i, job){
  const tick=async()=>{
    let s; try{ s=await API.job(job); }catch(e){ setTimeout(tick,4000); return; }
    const ae=document.activeElement, typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
    // an open inline form would be destroyed by a repaint even when unfocused —
    // keep polling, skip the paint. `formOpenIn` and not an inline selector: it
    // is the same list `renderNotebook`'s post-await guard reads, and two copies
    // of it would drift the first time a panel is added.
    const b=document.getElementById('body'+i);
    const formOpen=formOpenIn(b);
    if(!TIME && !typing && !formOpen && mode==='focus' && focusIdx===i && !openId) renderBody(i);
    if(!s.done){ setTimeout(tick,2500); return; }
    const r=s.result||{error:s.error||'job lost'};
    if(r.error){ showToast('flow: '+r.error); return; }
    if(TIME){ showToast('flow '+(r.status==='needs-you'?'needs you':'finished')+' — ↩ now to see it'); return; }
    if(r.state){ applyState(r.state); safeRebuild(); }
    showToast(r.status==='needs-you' ? 'The flow needs you — open the notebook to approve'
             : r.status==='failed' ? 'Flow stopped — a step failed (see the flow cell)'
             : 'Flow complete — everything it made is in the notebook (reversible)');
  };
  setTimeout(tick,1500);
}
// ---------------- ＋ Data: two doors, one panel ----------------------------
//
// The action bar does not grow. It already carries seven buttons, and a second
// "get data in" door beside `＋ Import CSV` would make a reader choose between
// them before knowing the difference. So the button widened to `＋ Data` and
// paste became ONE TAB of its panel rather than the whole of it — which is what
// paste now is: one origin among several, and the most constrained.
//
// What earns the tabs rather than a file row bolted onto the paste panel is
// `describe`. It commits nothing, so a file can be read and its columns shown
// BEFORE anything lands — most of why connecting a file beats pasting one — and
// that answer needs somewhere to live.
function startData(i,tab){
  const sp=STATE.spaces[i], b=document.getElementById('body'+i);
  b.innerHTML='<div class="datapanel"><div class="actions dtabs">'+
    '<button class="btn sm" data-tab="file">From a file</button>'+
    '<button class="btn ghost sm" data-tab="paste">Paste</button></div>'+
    '<div class="dbody"></div></div>';
  const host=b.querySelector('.dbody');
  const pick=t=>{
    b.querySelectorAll('[data-tab]').forEach(el=>el.className='btn sm'+(el.dataset.tab===t?'':' ghost'));
    (t==='paste'?dataPasteTab:dataFileTab)(i,sp,host);
  };
  b.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>pick(el.dataset.tab)));
  pick(tab==='paste'?'paste':'file');
}
// ~4 MB per request, and a `let` rather than a `const` because it is the one
// number here a test needs to move: proving that a multi-byte character
// straddling a chunk boundary survives means putting a boundary inside one, and
// a 4 MB fixture in a browser test costs far more than that proof is worth.
//
// The size is http-kit's, not a guess. It buffers a whole request body in heap,
// so the REQUEST is the thing that has to stay small — and 4 MB sits comfortably
// under its default 8 MiB `:max-body`, which is why this phase adds no config
// knob and makes no deployment judgement about a byte limit.
let UPLOAD_CHUNK=4*1024*1024;
// The upload id names a file under `.partial` and the server refuses anything
// outside `[A-Za-z0-9_-]{1,64}`. randomUUID satisfies it and needs no thought —
// the fallback is for a loci served over plain http to something that is not
// localhost, where `crypto.randomUUID` is not defined at all.
const uploadId=()=>(self.crypto&&crypto.randomUUID?crypto.randomUUID()
  :'u'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));
// A header value is a BYTE string: a code point above U+00FF throws on the way
// into `Headers`, and one between U+0080 and U+00FF goes out as a single Latin-1
// byte the server would then read as UTF-8. The file's name is the one
// caller-supplied string in this header, so it is escaped to pure ASCII — which
// every JSON reader, `clojure.data.json` included, decodes back.
const headerJson=o=>JSON.stringify(o).replace(/[\u007f-\uffff]/g,
  c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
// Send one file to /api/source/upload, a slice per request, and answer with the
// last chunk's reply — `{file, uri, existed}`.
//
// **The body is the Blob and never a string.** Measured on the server side
// 2026-08-21: decoding a chunk to text turns a 24-byte CSV split one byte into
// the two bytes of `é` into 28 bytes, `c3 a9` coming back as
// `ef bf bd ef bf bd` — one replacement character per half. The stored file is
// content-addressed, so that corruption would land under a hash OF the corrupt
// bytes and be indistinguishable from a good file forever after. `File.slice`
// hands back bytes and `fetch` sends them; nothing on this path decodes, and
// nothing on it may start to — no FileReader, no TextDecoder, no base64.
//
// The metadata rides in `X-Loci-Upload` for the same reason the route takes it
// there: a JSON envelope with the chunk base64'd into a field would inflate
// every chunk by a third and re-buffer the whole of it to decode, on a route
// whose entire purpose is that the file never sits in memory.
//
// It does not connect. The caller hands the uri to `dataPreview`, which is the
// picker's own path — so an upload is a file ARRIVING in loci's directory and
// not a second way to connect one.
async function uploadChunks(f,onProgress){
  const id=uploadId(), total=Math.max(1,Math.ceil(f.size/UPLOAD_CHUNK));
  let last=null;
  for(let n=0;n<total;n++){
    onProgress(n+1,total);
    const r=await fetch('/api/source/upload',{method:'POST',
      headers:{'X-Loci-Upload':headerJson({id,seq:n,name:f.name,final:n===total-1})},
      body:f.slice(n*UPLOAD_CHUNK,Math.min(f.size,(n+1)*UPLOAD_CHUNK))});
    last=await r.json();
    if(last&&last.error) throw new Error(last.error);
  }
  return last;
}
// The file tab, in its two states — the listing, and one file's preview. Both
// draw into the same host, and the preview offers a way back: a preview of the
// wrong file is otherwise a dead end that costs you the whole panel.
//
// `/api/source/files` lists the DIRECTORY rather than anything loci recorded, so
// a file dropped in by hand is offered and a file whose table exists but whose
// bytes are gone is not.
//
// Both of them paint from a promise, and both are now reachable while the other
// one's promise is still in flight — which is new, and is the URL field's doing.
// A local describe is milliseconds, so until this phase the waiting state needed
// no way out and had none; a remote one is up to six seconds, so it grew one,
// and the moment ‹ another file exists during a fetch the late answer can land
// on a host somebody else has already repainted.
//
// `host.isConnected` cannot see that. It is the SAME element every time — the
// panel's `.dbody` — so it is true for a stale describe and the preview paints
// straight over the listing. Element identity is the TECHNIQUE 12af324 used one
// level up, and it is the technique that cannot discriminate here, not that
// guard: 12af324's is about a notebook render landing on a body somebody opened
// a form in, and it is not on this path at all. What carries over from it is its
// rule — losing what someone typed is worse than showing slightly old cells.
//
// So: one token per render, bumped by whoever paints, and every async paint
// checks that it is still the last one to have bumped it. THREE painters bump
// it — `dataFileTab`, `dataPreview` and `dataPasteTab` — because the tab buttons
// sit outside `.dbody` and stay clickable while a describe is in flight.
//
// **Not an `AbortController`, and the reason is not that it would be awkward.**
// It would cancel the browser's half of one fetch and nothing else: `describe`
// IS the remote read, it runs in the JVM, and loci has no cancel for it — so the
// six seconds are spent either way and only the PAINT was ever in question. The
// token also covers what a signal would not reach without being threaded there:
// the upload, which is one request per chunk, and a paint that was never a fetch
// at all (Paste). One rule for every async paint in this panel, and no second.
const dgen   = host => (host.__dgen=(host.__dgen||0)+1);
const dstale = (host,gen) => !host.isConnected || host.__dgen!==gen;
function dataFileTab(i,sp,host){
  const gen=dgen(host);
  host.innerHTML='<div style="color:var(--muted);font-size:13px;padding:6px 0">reading the file list…</div>';
  const back='<button class="btn ghost sm" data-a="dcancel">Cancel</button>';
  const wireCancel=()=>host.querySelectorAll('[data-a="dcancel"]')
    .forEach(el=>el.addEventListener('click',()=>renderBody(i)));
  // The upload row, drawn above the listing — and above the sentence that
  // stands in for one when the directory is empty, which is precisely the state
  // where uploading is the only thing there is to do.
  const up='<div class="dupload"><input type="file" class="dupfile" accept=".csv,.parquet,.json">'+
    '<span class="dprog"></span></div>';
  // The third door: a location loci does not hold and never will. `/api/source/files`
  // lists a directory, so no listing can ever offer an `s3://` bucket or a URL on
  // somebody's web server — the only way one reaches `describe` is typed.
  //
  // Nothing here validates the scheme. `sourcespec/locate` refuses one it does not
  // know BY NAME — *loci does not know this location: gs://… Remote schemes
  // (s3://, https://) arrive with httpfs* — and `describe` carries that back as
  // `{error}`, which the preview already draws. A copy of the scheme set here
  // would be a second place to be wrong about which schemes loci reads, and its
  // sentence would be worse than the one that already exists.
  const url='<div class="durl"><input class="durlin" type="url" spellcheck="false" autocapitalize="off" '+
    'placeholder="…or a URL loci fetches: https://host/sales.csv, s3://bucket/sales.csv">'+
    '<button type="button" class="btn ghost sm" data-a="durlgo">Preview</button></div>';
  const wireUrl=()=>{
    const inp=host.querySelector('.durlin'); if(!inp) return;
    // **The URL survives ‹ back**, and this line is the whole of the mechanism.
    // A remote preview that failed has just cost six seconds, and ‹ redraws this
    // tab from scratch — so without it the way out of a failure is to paste a
    // 500-character presigned URL again, from a clipboard that may not still
    // hold it. There is no "try again" on the error state and none is wanted:
    // ‹ IS the retry once the field it goes back to is not empty.
    //
    // Kept on the host and not in a closure, because `dataFileTab` runs again
    // from nothing each time and the host is the one thing that does not. It
    // dies with the panel: `startData` builds a fresh `.dbody` every open.
    inp.value=host.__durl||'';
    // Straight into `dataPreview`, which is the picker's own path — describe,
    // columns, mode, Connect. A typed URL is a location arriving, not a second
    // way to connect one, exactly as an upload is not.
    const go=()=>{
      const u=inp.value.trim(); if(!u) return;
      host.__durl=u;
      dataPreview(i,sp,host,{uri:u,name:uriTail(u)});
    };
    host.querySelectorAll('[data-a="durlgo"]').forEach(el=>el.addEventListener('click',go));
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  };
  const wireUpload=()=>{
    const inp=host.querySelector('.dupfile'), prog=host.querySelector('.dprog');
    if(!inp) return;
    inp.addEventListener('change',async()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      inp.disabled=true; prog.className='dprog';
      let r;
      try{ r=await uploadChunks(f,(n,t)=>{ prog.textContent=f.name+' — '+n+'/'+t; }); }
      catch(e){
        if(dstale(host,gen)) return;
        // The panel keeps its listing and says what the server said. Every
        // refusal this route can answer already has a sentence from phase 1;
        // the one new one is a chunk out of sequence, and it names itself.
        inp.disabled=false; inp.value='';
        prog.className='dprog bad';
        prog.textContent='upload: '+((e&&e.message)||'network error');
        return;
      }
      if(dstale(host,gen)) return;
      inp.disabled=false; prog.textContent='';
      // `:existed` means the hash was already in the directory, so nothing was
      // written — worth saying, because the file about to be previewed is the
      // one loci had rather than the one you just chose. They are the same
      // bytes; that is what a matching hash means.
      if(r&&r.existed) showToast('loci already had these exact bytes — connecting the file it holds');
      // The same `{file,name,uri,bytes,connectedAs}` shape the listing answers
      // with, handed to the same preview a picked row gets. An upload is a file
      // ARRIVING in loci's directory, and there is one describe→preview→connect
      // flow.
      //
      // `connectedAs` is on it because an upload IS an import: drag in a file
      // whose bytes are already a table and the hash matches, so nothing is
      // written and `existed` says so — but without this key the preview drew no
      // duplicate note and Connect made a second table from the same rows in
      // silence, which is the one thing the picked-row door has warned about
      // since phase 2.
      dataPreview(i,sp,host,{file:r.file,name:f.name,uri:r.uri,bytes:f.size,connectedAs:r.connectedAs});
    });
  };
  API.sourceFiles().then(r=>{
    if(dstale(host,gen)) return;     // the panel was closed, or repainted, while we asked
    const files=(r&&r.files)||[];
    if(r&&r.error){
      // The URL row survives a failed listing, and that is the point of drawing
      // it in this branch: whatever went wrong reading loci's own directory has
      // nothing to say about a location loci does not hold, and a tab whose only
      // control is Cancel is a dead end where a working door exists.
      host.innerHTML=url+'<div class="reclaimed"><p>'+esc(r.error)+'</p></div>'+
        '<div class="actions" style="margin-top:10px">'+back+'</div>';
      wireCancel(); wireUrl(); return;
    }
    if(!files.length){
      host.innerHTML=up+url+'<div style="color:var(--muted);font-size:13px;padding:2px 0 10px">'+
        'Nothing in loci’s files directory yet — upload one above, give it a URL, or paste is the other tab.</div>'+
        '<div class="actions">'+back+'</div>';
      wireCancel(); wireUpload(); wireUrl(); return;
    }
    // The name the manifest remembers, or the file itself when it remembers
    // none — a hand-placed file is listed under what it is called on disk,
    // permanently, and that is not a degraded case.
    host.innerHTML=up+url+'<div class="sec-h">or pick a file loci already has</div><div class="filelist">'+
      files.map(f=>'<button type="button" class="filerow" data-file="'+esc(f.file)+'">'+
        '<span class="fn">'+esc(f.name||f.file)+'</span>'+
        // Beside the name and not after the size, because it is part of what
        // this file IS. Absent — not a blank span — when the server sent no
        // `connectedAs`, so an unconnected file carries no empty box where a
        // note would be.
        (f.connectedAs?'<span class="dupe">already '+esc(f.connectedAs)+'</span>':'')+
        '<span class="fmeta">'+esc(srcFormat(f.uri))+' · '+fmtBytes(f.bytes)+'</span></button>').join('')+
      '</div><div class="actions" style="margin-top:11px">'+back+'</div>';
    wireCancel(); wireUpload(); wireUrl();
    host.querySelectorAll('[data-file]').forEach(el=>el.addEventListener('click',()=>
      dataPreview(i,sp,host,files.find(f=>f.file===el.dataset.file))));
  }).catch(()=>{
    if(dstale(host,gen)) return;
    host.innerHTML=url+'<div class="reclaimed"><p>loci could not read the file list.</p></div>'+
      '<div class="actions" style="margin-top:10px">'+back+'</div>';
    wireCancel(); wireUrl();
  });
}
// One file, described and not connected. `describe` IS the dry run — it reads
// the file, answers with the columns it has right now, and commits nothing — so
// this preview costs an event only if you go on to press Connect, and Cancel
// owes no undo.
//
// All three of raw header, loci's column name and DuckDB's type, because the
// three differ exactly where a surprise lives: `Total Revenue ($)` lands as
// `total_revenue`, and a column that sniffs as VARCHAR when you expected a
// number is the thing worth seeing BEFORE the table exists.
function dataPreview(i,sp,host,f){
  if(!f) return dataFileTab(i,sp,host);
  const gen=dgen(host);
  const uri=f.uri,
        // `uriTail` is the typed-URL case: a picked row and an upload both carry
        // a name, a URL carries only itself, and an empty heading over a blank
        // proposed title is the worst of the three.
        label=f.name||f.file||uriTail(uri),
        // From the extension and never from a control: `srcFormat`'s own comment
        // says why — a dropdown would be a second place to say it and so a
        // second place to be wrong.
        format=srcFormat(uri),
        // A location DuckDB fetches rather than one loci resolves. It changes
        // three things below and nothing else: what the wait says, what the mode
        // control is, and what the footnote under it explains.
        remote=isRemote(uri),
        base=label.replace(/\.[a-z0-9]+$/i,'');
  const head=n=>'<div class="sec-h">'+esc(label)+' · '+esc(format)+(n?' · '+n+' column'+(n===1?'':'s'):'')+'</div>';
  // `‹ back` for a URL: the destination is the same tab either way, but nothing
  // about a typed location was ever "another file", and the wait sentence points
  // at this button by name.
  const nav='<button class="btn ghost sm" data-a="dback">'+(remote?'‹ back':'‹ another file')+'</button>'+
            '<button class="btn ghost sm" data-a="dcancel">Cancel</button>';
  const wireNav=()=>{
    host.querySelectorAll('[data-a="dback"]').forEach(el=>el.addEventListener('click',()=>dataFileTab(i,sp,host)));
    host.querySelectorAll('[data-a="dcancel"]').forEach(el=>el.addEventListener('click',()=>renderBody(i)));
  };
  // The waiting state, which for a URL is not a formality. `describe` IS the
  // fetch — the object is read here, before Connect — and an `s3://` location
  // whose credentials have to be found and refused costs ~6 s (measured 6,069 ms
  // on a machine with none; 62 ms with no route out at all, because the chain
  // gives up rather than timing out on IMDS). There is no timeout and no cancel
  // anywhere in loci, so six idle seconds is what a reader gets, and a panel
  // showing three muted words for six seconds reads as broken.
  //
  // Two answers, both of them honest about what loci cannot do. Say how long it
  // may take and why, and draw the way OUT — which is not a cancel and does not
  // pretend to be: the fetch runs to completion, and leaving is leaving.
  host.innerHTML=head()+'<div class="dwait">'+(remote
      ? 'fetching '+esc(label)+' — a URL is read now, not when you press Connect. '+
        'Several seconds is normal, and an s3:// location with no credentials takes '+
        'about six of them before it can say so. Nothing has been committed; ‹ leaves.'
      : 'reading its columns…')+'</div>'+
    '<div class="actions" style="margin-top:10px">'+nav+'</div>';
  wireNav();
  API.sourceDescribe({uri,format}).then(d=>{
    if(dstale(host,gen)) return;
    if(!d||d.error||!d.cols||!d.cols.length){
      // `srcerr`, because THIS is where loci's paragraphs land. Every remote
      // failure — a missing httpfs, a credential chain with nothing in it — is
      // multi-line prose with an indented fix, and a `<p>` collapses newlines.
      host.innerHTML=head()+'<div class="reclaimed"><p class="srcerr">'+
        esc((d&&d.error)||('loci cannot read '+label))+'</p></div>'+
        '<div class="actions" style="margin-top:10px">'+nav+'</div>';
      wireNav(); return;
    }
    // The mode travels on the control as the word the SERVER knows, never as the
    // word on the label. `connect!` refuses anything that is neither
    // `materialise` nor `passthrough` BY NAME, which is a feature: a typo comes
    // back as a message quoting what was sent. Translating "copy in" here would
    // put loci's vocabulary in a second place and throw that away.
    const rn='dmode'+i;
    // The same fact the row carried, as a sentence: by the time you are reading
    // columns the row is gone and the decision is one click away. It says what
    // connecting again WOULD do rather than asking you not to — `import-csv!`
    // settled that for the paste box and this is the same rule at the other
    // door. Connect below is untouched.
    //
    // A typed URL carries no `connectedAs` and draws no note, and that is a gap
    // rather than a decision that it does not matter. `files/connected-as` can
    // answer for ANY uri, but the two places that fill this key —
    // `/api/source/files` and the upload reply — are both about loci's own
    // directory, and no directory listing will ever contain a bucket.
    //
    // What it does NOT need is a route that does not exist, and an earlier draft
    // of this comment said it did. `source-describe` already takes the store and
    // already ignores it — *"Takes `st` and ignores it, so the three routes read
    // alike and a later preview that wants the store does not change the route"*
    // is its own docstring, written in anticipation of exactly this — so the
    // answer is one more key on a reply the panel already waits for. It is
    // deferred because it is still a server change with its own contract and its
    // own test, in a phase that is about locations; not because there is nowhere
    // to put it. The cost is unchanged: connecting the same URL twice makes two
    // tables in silence — which `undo!` reverses, and which the picked-row door
    // has warned about since phase 2.
    const dupe=f.connectedAs
      ? '<div class="dupe-note">loci already has this file as <b>'+esc(f.connectedAs)+
        '</b>. Connecting again makes a second table from the same rows.</div>'
      : '';
    // Where the two radios go for a local file. `connect!` refuses passthrough
    // for a remote location with a sentence naming the mode and the uri, so a
    // radio for it is a control whose click can only ever produce an error —
    // and a disabled one is the same invitation with the click removed. A
    // statement instead, in the place the choice would have been, so the reader
    // sees that a mode WAS settled rather than that the panel forgot to offer
    // one. The measured reason is in the footnote below, not hidden here.
    const modes=remote
      ? '<span class="dmode-fixed">copied in</span>'
      : '<label class="dmode"><input type="radio" name="'+rn+'" value="materialise" checked> copy in</label>'+
        '<label class="dmode"><input type="radio" name="'+rn+'" value="passthrough"> read live</label>';
    const modeNote=remote
      ? '<b>A URL is copied in</b>, and there is no other mode for one. loci fetches the rows '+
        'now and keeps them; <b>Refresh</b> on the table fetches them again. Reading live would '+
        'mean a full fetch of the object for every query and another for every render — '+
        'measured locally at 244 ms of a 294 ms connect just to count the rows, which over a '+
        'network is a notebook that is slow for a reason nothing on screen can show you.'
      : '<b>copy in</b> stores the rows in loci, so they stay as they are now. <b>read live</b> '+
        'keeps the file as the truth and re-reads it every time — nothing is copied, and the '+
        'rows change when the file does.';
    host.innerHTML=head(d.cols.length)+dupe+
      '<div class="srcpreview"><table class="mold"><thead><tr>'+
        '<th class="txt">header</th><th class="txt">column</th><th class="txt">type</th></tr></thead><tbody>'+
        d.cols.map(c=>'<tr><td class="txt">'+esc(c.raw)+'</td><td class="txt">'+esc(c.col)+'</td>'+
          '<td class="txt"><span class="chip">'+esc(c.type)+'</span></td></tr>').join('')+
      '</tbody></table></div>'+
      '<div class="actions" style="margin-top:11px">'+
        '<input id="dtitle" placeholder="'+esc(base)+'" '+
        'style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px">'+
        modes+
        '<button class="btn sm" data-a="connect">Connect</button>'+nav+'</div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:8px">'+modeNote+'</div>';
    wireNav();
    const btn=host.querySelector('[data-a="connect"]');
    const go=async()=>{
      if(TIME){ showToast('time mode — ↩ now to connect'); return; }
      const title=host.querySelector('#dtitle').value.trim()||base;
      // The same `remote` that decided not to draw the radios, so there is one
      // condition and not a fallback: a LOCAL preview with no checked radio
      // still throws here, which is what a silent default to materialise would
      // hide.
      const mode=remote?'materialise':host.querySelector('input[name="'+rn+'"]:checked').value;
      const restore=()=>{ btn.disabled=false; btn.textContent='Connect'; };
      btn.disabled=true; btn.textContent='connecting…';
      let res; try{ res=await API.sourceConnect({uri,format,mode,title}, sp.id); }
      catch(e){ restore(); showToast('connect: network error'); return; }
      if(TIME){ showToast('finished — ↩ now to see it'); return; }
      if(res.error){ restore(); showToast('connect: '+res.error); return; }
      applyState(res.state); openId=res.openId; rebuild(); openObject(res.openId);
      // `res.mode` is read off the handle that was built, not echoed from the
      // radio — the two disagreeing is the whole of the string-mode defect
      // `connect!` was written against, so the toast quotes the answer.
      showToast(res.mode==='passthrough' ? 'Connected — loci reads '+label+' live (reversible)'
                                         : 'Connected — the rows were copied in (reversible)', undo);
    };
    btn.addEventListener('click',go);

// whose paint is a form somebody types into. Without the bump a describe that

// connected, and `__dgen` still holds the number the preview set. It then paints
// its columns over the textarea and everything typed into it, under a Paste tab

// The agent proposes; you decide. Every question is an editable field, because
// the phrasing is usually close and rarely exact, and refusing a good subtopic
// over one wrong word is a real loss. Two destination buttons, never one button
// whose meaning depends on a toggle: three new notebooks and three cells here are
// sharply different outcomes, and a mis-click is expensive. Nothing has been
// written when this opens, and Dismiss writes nothing either.
function openSuggest(i,sp,proposals){
  const rows=proposals.map((p,k)=>
    '<div class="sgrow" data-k="'+k+'"><label><input type="checkbox" checked> '+
    '<b>'+esc(p.title)+'</b></label>'+
    '<input class="sgq" value="'+esc(p.query||'')+'"></div>').join('');
  modal.innerHTML='<div class="modalcard" style="max-width:720px"><div class="modal-h">'+
    '<span class="modalbadge">SUGGEST</span>'+
    '<span class="q">questions worth pursuing in “<b>'+esc(sp.title)+'</b>”</span></div>'+
    '<div class="modal-b">'+rows+'</div>'+
    '<div class="modal-f">'+
      '<button class="btn sm" id="sgNew"></button>'+
      '<button class="btn sm" id="sgHere"></button>'+
      '<button class="btn ghost sm" id="sgDismiss">Dismiss</button>'+
      '<span style="font-size:11.5px;color:var(--muted)">nothing has been written yet</span>'+
    '</div></div>';
  modal.classList.add('on');
  // each row is paired with its proposal through its own data-k, not through its
  // position among the rows: the title travels with the proposal while the query
  // is read off the field beside it, so a positional map would send A's title with
  // B's question the day a row is hidden, sorted or dropped. A question edited to
  // blank counts as refused — an empty prompt is not a research question.
  const picked=()=>[...modal.querySelectorAll('.sgrow')].map(row=>{
    const p=proposals[+row.dataset.k];
    if(!p||!row.querySelector('input[type=checkbox]').checked) return null;
    const query=row.querySelector('.sgq').value.trim();
    return query?{title:p.title,intent:p.intent,query}:null;
  }).filter(Boolean);
  const relabel=()=>{ const n=picked().length;
    modal.querySelector('#sgNew').textContent='Research '+n+' in new notebook'+(n===1?'':'s');
    modal.querySelector('#sgHere').textContent='Research '+n+' in this notebook';
    modal.querySelectorAll('#sgNew,#sgHere').forEach(x=>x.disabled=(n===0)); };
  relabel();
  modal.querySelectorAll('.sgrow input[type=checkbox]').forEach(c=>c.addEventListener('change',relabel));
  modal.querySelectorAll('.sgrow .sgq').forEach(f=>f.addEventListener('input',relabel));
  modal.querySelector('#sgDismiss').addEventListener('click',closeModal);
  const go=async dest=>{
    if(TIME){ showToast('time mode — ↩ now to edit'); return; }
    const items=picked(); if(!items.length) return;
    closeModal();
    // this modal may have stood open while another job landed and applyState
    // re-ordered the panels, so find the notebook by id every time rather than
    // trusting the index captured when the button was drawn — otherwise the
    // progress note and the error repaint land on somebody else's panel. -1 also
    // means "an object is open there": don't paint over what is being read.
    const panelOf=()=>{ const j=STATE.spaces.findIndex(s=>s.id===sp.id);
      return (j>=0 && !(openId&&focusIdx===j)) ? j : -1; };
    const repaint=()=>{ const j=panelOf(); if(j>=0) renderBody(j); };
    const j=panelOf(), pb=j>=0?document.getElementById('body'+j):null;
    if(pb) pb.innerHTML='<div class="sec-h">researching</div><div style="color:var(--muted);font-size:13px">'+
      items.length+' question'+(items.length===1?'':'s')+' — this takes a while. You can keep working; results land when ready…</div>';
    let res; try{ res=await API.suggestRun(sp.id,items,dest); }
    catch(e){ showToast('suggest: network error'); repaint(); return; }
    if(res.error){ showToast('suggest: '+res.error); repaint(); return; }
    pollJob(res.job, r=>{
      if(TIME){ showToast('agent finished — ↩ now to see it'); return; }
      if(r.error){ showToast('suggest: '+r.error); repaint(); return; }
      applyState(r.state); safeRebuild();
      const n=(r.ran||[]).length;
      showToast(dest==='new'
        ? 'Spawned '+n+' connected notebook'+(n===1?'':'s')
        : 'Researched '+n+' question'+(n===1?'':'s')+' here');
    });
  };
  modal.querySelector('#sgNew').addEventListener('click',()=>go('new'));
  modal.querySelector('#sgHere').addEventListener('click',()=>go('here'));
}

async function openObject(id){
  openId=id;
  // make sure the owning space is focused
  const owner=STATE.spaces.findIndex(s=>s.members.includes(id));
  if(owner>=0 && (mode!=='focus' || focusIdx!==owner)){ focusIdx=owner; }
  mode='focus'; closeLeap();
  const at=tat();
  const m=await API.object(id,at);
  // A scrub now re-opens what is open at every settle, so two of these can be in
  // flight down one drag — and drawing whichever answers last would leave the
  // molder showing a point in time the bar has already left. The same guard
  // renderNotebook, deepen, pvSeq and scrubTo itself carry.
  if(openId!==id||tat()!==at) return;
  renderDetail(focusIdx,m); layout();
}

function renderDetail(i,m){
  const b=document.getElementById('body'+i);

  let opts=''; m.alternatives.forEach(([vid,label])=>{ opts+='<option value="'+vid+'"'+(vid===m.view?' selected':'')+'>'+esc(label)+'</option>'; });
  const describable = m.alternatives.some(a=>a[1]==='Rows');   // a table-shaped object
  const editBtn = m.kind==='text' ? '<button class="btn ghost sm" id="editbtn" style="margin-left:10px">Edit</button>' : '';
  const makeBtn = describable ? '<button class="btn ghost sm" id="makebtn" style="margin-left:8px">✦ make…</button>' : '';
  b.innerHTML='<button class="backlink" id="back">‹ back to the space</button>'+
    '<div class="molder"><div class="molder-h"><span class="t">'+esc(m.title)+'</span>'+
    (m.alternatives.length?'<span class="lab">view this as</span><select id="moldsel">'+opts+'</select>':'')+editBtn+makeBtn+'</div>'+
    '<div class="molder-b" id="moldbody">'+renderMold(m)+'</div></div>';
  b.querySelector('#back').addEventListener('click',()=>{ openId=null; renderBody(i); });
  const selEl=b.querySelector('#moldsel');
  if(selEl) selEl.addEventListener('change',()=>remold(m.id, selEl.value));
  const eb=b.querySelector('#editbtn'); if(eb) eb.addEventListener('click',()=>startEdit(i,m));
  const mk=b.querySelector('#makebtn'); if(mk) mk.addEventListener('click',()=>startDo(i,m));
  wireSourceButtons(b,i);
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openObject(el.dataset.open)));
  // A notebook is not a document. renderBody and renderNotebook have carried this
  // delegation all along; the molder had not needed it until an entity page drew a
  // source chip for the SPACE a fact came from — and openObject on a notebook
  // renders its {intent, cells} map as raw JSON, which is the same mistake act()'s
  // semantic branch documents. Silence when the id is not in STATE.spaces, exactly
  // as the other two are: with `?at=` now on /api/entity, the payload and STATE are
  // read at the same point, so a miss is a race and not a routine outcome.
  b.querySelectorAll('[data-space]').forEach(el=>el.addEventListener('click',()=>{
    const j=STATE.spaces.findIndex(s=>s.id===el.dataset.space); if(j>=0) enter(j);
  }));
  b.querySelectorAll('[data-gate]').forEach(el=>el.addEventListener('click',async ev=>{
    ev.stopPropagation();
    if(TIME){ showToast('time mode — ↩ now to decide'); return; }
    const ok=el.dataset.gate==='yes';
    let r; try{ r=await API.flowGate(el.dataset.flow, ok); }catch(e){ showToast('gate: network error'); return; }
    if(r.error){ showToast(r.error); return; }
    if(TIME){ showToast('finished — ↩ now to see it'); return; }
    if(ok){ showToast('Approved — the flow continues'); watchFlow(i, r.job); openObject(m.id); }
    else  { applyState(r.state); openObject(m.id); showToast('Rejected — the flow stopped (reversible)', undo); }
  }));
  if(m.kind==='applet') runApplet(m);
}

function renderMold(m){
  const d=m.rendered;
  // BEFORE the switch, not a case in it: the payload's `kind` is still "table",
  // because the object still IS a table — only its rows are gone. Both callers
  // reach this one function, so the molder (renderDetail) and every notebook
  // cell say it with one guard.
  if(m.reclaimed) return reclaimedHTML(m);
  // A broken external source, drawn as the state it is in. AFTER the reclaimed
  // guard and never before it: a materialised source whose old lake version
  // aged past the GC window is reclaimed AND sourced, and `source-block`'s cond
  // answers `reclaimed` for it for exactly that reason — the two must not be
  // able to disagree. Only the two repairable states land here; `live` and
  // `stored` have their rows and render them like any other table.
  if(m.source && (m.source.state==='unavailable'||m.source.state==='drift')){
    if(m.source.state==='drift') askSourceNow(m);
    return '<div class="srcblock" data-src="'+esc(m.id)+'">'+sourceHTML(m,SRCNOW[m.id])+'</div>';
  }
  switch(m.kind){
    // A div and an id is the ENTIRE integration surface: the ClojureScript side
    // fetches its own payload over Transit, so nothing here needs to know the
    // payload's shape. That is what keeps this seam one line wide.
    case 'table':  return liveBadge(m)+(CLJS_GRID
                     ? '<div data-cljs-grid="'+esc(m.id)+'"></div>'
                     : tableHTML(d));
    case 'list':   return '<ul class="moldlist">'+d.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
    case 'text':   return '<div class="moldtext">'+mdToHtml(d)+'</div>';
    case 'chart':  return chartSVG(d);
    case 'report': return renderReport(d);
    case 'cards':  return renderCards(d);
    case 'kpi':    return renderKPI(d);
    case 'applet': return '<div id="appletHost" style="min-height:340px"></div>';
    case 'flow':   return renderFlow(m.rendered, m.id);
    // a subject — no viewers, and the shell draws the very page the modal draws,
    // out of the very payload it draws it from. `m.title` goes with it because
    // both of this function's callers wrap the result in a header carrying it —
    // the molder's `.molder-h .t` and a notebook cell's `.cellmold .hd .t` — and
    // renderEntityPage will not draw the name twice. See renderEntityPage.
    case 'entity': return renderEntityPage(m.rendered, m.title);
    default:       return '<pre>'+esc(JSON.stringify(d,null,2))+'</pre>';
  }
}
const FLOWICON={pending:'○',running:'◐',done:'●','needs-you':'⚑',failed:'✕',rejected:'⊘'};
// What a cell is, at a glance, in the outline. Prose is ¶ because that is what
// it is; everything else takes the shape of the thing it molds.
const CELLICON={text:'¶',table:'▤',doc:'▤',report:'▤',metric:'◪',applet:'◈',
                entity:'⌾',flow:'⑂',viewspec:'◈',missing:'✕'};
// "1:07", "2m 14s", "—". Coarse on purpose: a flow is minutes of model calls,
// and a ticking seconds counter would be the loudest thing on a page whose
// point is the plan.
function fmtElapsed(from,to){
  if(!from) return '';
  const s=Math.max(0,Math.round(((to||Date.now())-from)/1000));
  return s<60 ? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s';
}
// The line that used to be the bare word "running". Everything in it was
// already in the flow object and simply never rendered: which step, how many,
// how long.
function flowPlanLine(f){
  const steps=f.steps||[], n=steps.length;
  const done=steps.filter(s=>s.status==='done').length;
  const i=steps.findIndex(s=>s.status==='running'||s.status==='needs-you');
  const el=fmtElapsed(f.started, f.ended);
  const bits=['PLAN', n+' STEP'+(n===1?'':'S')];
  if(f.status==='needs-you')   bits.push('<span class="fp-attn">NEEDS YOU · STEP '+(i+1)+'</span>');
  else if(f.status==='running') bits.push('RUNNING STEP '+(i<0?done+1:i+1));
  else if(f.status==='done')    bits.push('DONE');
  else bits.push('<span class="fp-attn">'+esc(String(f.status).toUpperCase())+'</span>');
  if(f.status!=='needs-you'&&f.status!=='running') bits.push(done+' OF '+n+' DONE');
  if(el) bits.push(el);
  return '<div class="flowplan">'+bits.join(' · ')+'</div>';
}
function renderFlow(f, fid){
  let h='<div class="flowgoal">'+esc(f.goal)+'</div>'+flowPlanLine(f)+'<div class="flowsteps">';
  (f.steps||[]).forEach((s,k)=>{
